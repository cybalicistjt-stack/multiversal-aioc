<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11141b"><title>Multiversal Development OS</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0d1016;color:#f5f3f8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#26203a,#0d1016 45%);min-height:100vh}header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:13px;background:#10131bee;border-bottom:1px solid #3b3547}header a,button{border:1px solid #5b5268;background:#292432;color:#fff;border-radius:11px;padding:10px 12px;font-weight:700}button{cursor:pointer}.primary{background:#7350ad;border-color:#b89be3}.good{background:#244b3d}.warn{background:#614d23}.danger{background:#642f36}main{max-width:1100px;margin:auto;padding:18px}.hero,.card,.panel{background:#1b1d27eF;border:1px solid #454050;border-radius:18px;padding:16px;box-shadow:0 10px 28px #0005}.hero h1{margin:5px 0;font-size:29px}.muted,small{color:#b9b2c2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px;margin:14px 0}.metric{font-size:30px;font-weight:900}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0}.tabs button{white-space:nowrap}.tabs button.active{background:#7350ad}.row{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #403a49;border-radius:12px;background:#151720;margin:7px 0}.grow{flex:1}.row b,.row small{display:block}.badge{font-size:11px;border:1px solid #655b72;padding:4px 7px;border-radius:999px}.bar{height:8px;border-radius:8px;background:#35313d;overflow:hidden}.bar i{display:block;height:100%;background:#8d6bc1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}input,textarea,select{width:100%;padding:11px;border:1px solid #534b60;border-radius:10px;background:#11141b;color:#fff;margin-top:5px}label{display:block;margin:9px 0;font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.node{display:inline-block;margin:4px;padding:7px 9px;border:1px solid #685b79;border-radius:999px;background:#282231}.callout{border-left:4px solid #8d6bc1;padding:12px;background:#17151d;border-radius:8px;margin:10px 0}.check{display:flex;gap:8px;align-items:flex-start}.check input{width:auto;margin-top:3px}@media(max-width:700px){.two{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style></head><body><header><a href="./index.html">← AIOC</a><div><b>Multiversal Development OS</b><div class="muted">Game-development headquarters · 1.0</div></div></header><main><section class="hero"><span class="badge">DEVELOPMENT OS</span><h1>See the game as one connected system.</h1><p class="muted">This layer joins design, dependencies, canon, coverage, development work, simulation, decisions, and release readiness using the same local AIOC data.</p></section><div id="metrics" class="grid"></div><nav class="tabs" id="tabs"></nav><section id="view"></section></main><script>
const SYSTEMS={graph:'Knowledge Graph',impact:'Impact Simulator',pipeline:'Content Pipeline',canon:'Canon Consistency',coverage:'Coverage Analyzer',team:'AI Team Dashboard',campaign:'Campaign Simulator',economy:'Economy Simulator',decisions:'Decision Log',release:'Release Control'};
const PIPE=['concept','draft','expert-review','balance','testing','approved','released','deprecated'];let active='graph';
function load(){try{return JSON.parse(localStorage.getItem('aioc-state')||'{}')}catch{return {}}}function save(s){localStorage.setItem('aioc-state',JSON.stringify(s))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return Date.now()+Math.floor(Math.random()*1000)}
function data(){const s=load();s.gameObjects=Array.isArray(s.gameObjects)?s.gameObjects:[];s.packLists=Array.isArray(s.packLists)?s.packLists:[];s.featureModules=Array.isArray(s.featureModules)?s.featureModules:[];s.agents=Array.isArray(s.agents)?s.agents:[];s.decisions=Array.isArray(s.decisions)?s.decisions:[];s.devOS=s.devOS||{};s.devOS.pipeline=s.devOS.pipeline||{};s.devOS.canonRules=s.devOS.canonRules||[];s.devOS.economy=s.devOS.economy||[];s.devOS.campaigns=s.devOS.campaigns||[];s.devOS.releaseMilestones=s.devOS.releaseMilestones||seedMilestones();return s}
function seedMilestones(){return[{id:'internal-alpha',name:'Internal Alpha',target:'Core play loops and authoring/import foundations',status:'active'},{id:'closed-alpha',name:'Closed Alpha',target:'Stable multiplayer campaigns, broader content and regression coverage',status:'future'},{id:'open-alpha',name:'Open Alpha',target:'Scalable onboarding, telemetry, accessibility and support',status:'future'},{id:'beta',name:'Beta',target:'Feature complete, balance stabilization and release operations',status:'future'},{id:'release',name:'Release',target:'Approved production build and content catalog',status:'future'}]}
function objects(s){return s.gameObjects}function deps(o){return [...new Set([...(o.dependencies||[]),...(o.baseDefinitionRef?[o.baseDefinitionRef]:[])])]}function refsTo(s,id){return objects(s).filter(o=>deps(o).includes(id))}function stage(s,o){return s.devOS.pipeline[o.id]||inferStage(o)}function inferStage(o){if(o.canonStatus==='approved')return 'approved';if(o.canonStatus==='deprecated')return 'deprecated';if(o.extensions?.['app.multiversal.aioc']?.balanceReport)return 'balance';return o.id?'draft':'concept'}
function render(){const s=data(),packed=new Set(s.packLists.flatMap(p=>p.objectIds||[])),tested=new Set((s.testPlans||[]).map(x=>x.subjectId).filter(Boolean));document.querySelector('#metrics').innerHTML=`<article class="card"><div class="metric">${objects(s).length}</div><b>Game objects</b></article><article class="card"><div class="metric">${objects(s).reduce((n,o)=>n+deps(o).length,0)}</div><b>Declared links</b></article><article class="card"><div class="metric">${objects(s).filter(o=>!packed.has(o.id)).length}</div><b>Unstaged</b></article><article class="card"><div class="metric">${objects(s).filter(o=>!tested.has(o.id)).length}</div><b>Without test evidence</b></article>`;document.querySelector('#tabs').innerHTML=Object.entries(SYSTEMS).map(([k,v])=>`<button class="${k===active?'active':''}" onclick="active='${k}';render()">${v}</button>`).join('');document.querySelector('#view').innerHTML=views[active](s)}
const views={graph,impact,pipeline,canon,coverage,team,campaign,economy,decisions,release};
function graph(s){const os=objects(s);return `<div class="two"><article class="panel"><h2>Design Knowledge Graph</h2><p class="muted">Select an object to see what it depends on and what depends on it.</p><input placeholder="Filter objects" oninput="filterRows(this.value,'graphRows')"><div id="graphRows">${os.slice(0,250).map(o=>`<button class="row" data-q="${esc((o.name+' '+o.id).toLowerCase())}" onclick="showGraph('${esc(o.id)}')"><span class="grow"><b>${esc(o.name||o.id)}</b><small>${esc(o.id)}</small></span><span class="badge">${deps(o).length} out</span><span class="badge">${refsTo(s,o.id).length} in</span></button>`).join('')||'<p>No game objects yet.</p>'}</div></article><article class="panel" id="graphDetail"><h2>Connected context</h2><p class="muted">Choose an object.</p></article></div>`}
function showGraph(id){const s=data(),o=objects(s).find(x=>x.id===id);if(!o)return;document.querySelector('#graphDetail').innerHTML=`<h2>${esc(o.name||o.id)}</h2><p class="muted">${esc(o.id)}</p><h3>Depends on</h3>${deps(o).map(x=>`<span class="node">${esc(x)}</span>`).join('')||'<p>None declared.</p>'}<h3>Used by</h3>${refsTo(s,id).map(x=>`<span class="node">${esc(x.name||x.id)}</span>`).join('')||'<p>No local references.</p>'}<h3>Pipeline</h3><span class="badge">${stage(s,o)}</span>`}
function impact(s){return `<article class="panel"><h2>Dependency Impact Simulator</h2><p class="muted">Choose an object and describe a proposed change. The simulator identifies affected records and likely review work; it does not alter canon.</p><label>Object<select id="impactObject">${objects(s).map(o=>`<option value="${esc(o.id)}">${esc(o.name||o.id)}</option>`).join('')}</select></label><label>Proposed change<textarea id="impactChange" placeholder="Example: reduce Fire Resistance from 5 to 3"></textarea></label><button class="primary" onclick="runImpact()">Analyze impact</button><div id="impactOut"></div></article>`}
function runImpact(){const s=data(),id=document.querySelector('#impactObject').value,o=objects(s).find(x=>x.id===id),direct=refsTo(s,id),second=[...new Set(direct.flatMap(x=>refsTo(s,x.id)).filter(x=>!direct.includes(x)))];document.querySelector('#impactOut').innerHTML=`<div class="callout"><b>${direct.length} direct and ${second.length} second-order records may require review.</b><p>${direct.length>20?'High':'direct'.length>5?'Medium':'Low'} coordination risk. Re-run balance and regression tests for affected mechanics.</p></div><h3>Directly affected</h3>${direct.map(x=>`<div class="row"><span class="grow"><b>${esc(x.name||x.id)}</b><small>${esc(x.objectKind||'')}</small></span></div>`).join('')||'<p>None found.</p>'}<h3>Second-order</h3>${second.slice(0,50).map(x=>`<span class="node">${esc(x.name||x.id)}</span>`).join('')||'<p>None found.</p>'}`}
function pipeline(s){const counts=Object.fromEntries(PIPE.map(x=>[x,0]));objects(s).forEach(o=>counts[stage(s,o)]++);return `<article class="panel"><h2>Content Pipeline Manager</h2><p class="muted">Move content through concept → draft → review → balance → testing → approval → release without losing provenance.</p><div class="grid">${PIPE.map(p=>`<div class="card"><div class="metric">${counts[p]}</div><b>${p}</b></div>`).join('')}</div><div>${objects(s).map(o=>`<div class="row"><span class="grow"><b>${esc(o.name||o.id)}</b><small>${esc(o.id)}</small></span><select style="width:auto" onchange="setStage('${esc(o.id)}',this.value)">${PIPE.map(p=>`<option ${stage(s,o)===p?'selected':''}>${p}</option>`).join('')}</select></div>`).join('')||'<p>No objects yet.</p>'}</div></article>`}
function setStage(id,v){const s=data();s.devOS.pipeline[id]=v;save(s);render()}
function canon(s){const issues=[];const ids=new Set();objects(s).forEach(o=>{if(ids.has(o.id))issues.push([o.id,'Duplicate stable ID']);ids.add(o.id);if(o.layer==='Variant'&&!o.baseDefinitionRef)issues.push([o.id,'Variant lacks base Definition']);deps(o).filter(d=>!objects(s).some(x=>x.id===d)).forEach(d=>issues.push([o.id,`Unresolved reference: ${d}`]));if(!o.provenance?.source)issues.push([o.id,'Missing provenance']);});return `<div class="two"><article class="panel"><h2>Canon Consistency Engine</h2><p class="muted">Runs deterministic structural continuity checks and stores designer-authored canon constraints.</p><h3>Detected issues (${issues.length})</h3>${issues.map(x=>`<div class="row"><span>⚠</span><span class="grow"><b>${esc(x[0])}</b><small>${esc(x[1])}</small></span></div>`).join('')||'<p>✓ No structural canon conflicts found.</p>'}</article><article class="panel"><h2>Canon constraints</h2><label>Rule<textarea id="canonRule" placeholder="Example: The Arkan Empire cannot exist before Year 340"></textarea></label><button onclick="addCanonRule()">Add rule</button>${s.devOS.canonRules.map((r,i)=>`<div class="row"><span class="grow">${esc(r.text)}</span><button onclick="removeCanonRule(${i})">Delete</button></div>`).join('')}</article></div>`}
function addCanonRule(){const s=data(),v=document.querySelector('#canonRule').value.trim();if(v){s.devOS.canonRules.push({text:v,created:new Date().toISOString()});save(s);render()}}function removeCanonRule(i){const s=data();s.devOS.canonRules.splice(i,1);save(s);render()}
function coverage(s){const groups={};objects(s).forEach(o=>{const k=o.objectKind||'Other';groups[k]=groups[k]||[];groups[k].push(o)});const domains=['Combat','Defense','Movement','Social','Investigation','Crafting','Technology','Magic','Psionics','Environmental'];return `<article class="panel"><h2>Coverage Analyzer</h2><p class="muted">Counts are planning signals, not proof of quality or balance.</p><h3>Content-kind coverage</h3>${Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).map(([k,a])=>`<div class="row"><span class="grow"><b>${esc(k)}</b><div class="bar"><i style="width:${Math.min(100,a.length*10)}%"></i></div></span><b>${a.length}</b></div>`).join('')||'<p>No objects.</p>'}<h3>Ability-domain coverage</h3>${domains.map(d=>{const n=objects(s).filter(o=>String(o.spec?.domain||'').toLowerCase()===d.toLowerCase()).length;return `<div class="row"><span class="grow"><b>${d}</b><div class="bar"><i style="width:${Math.min(100,n*15)}%"></i></div></span><b>${n}</b></div>`}).join('')}</article>`}
function team(s){return `<article class="panel"><h2>AI Development Team Dashboard</h2><p class="muted">Manage specialist roles, queues, dependencies, blockers, quality and capacity.</p><button onclick="addAgent()">＋ Add specialist</button>${s.agents.map((a,i)=>`<div class="row"><span class="grow"><b>${esc(a.name)}</b><small>${esc(a.role||'')} · ${esc(a.task||'No task')}</small></span><span class="badge">${esc(a.status||'idle')}</span><span class="badge">${a.capacity??0}% capacity</span><button onclick="editAgent(${i})">Edit</button></div>`).join('')||'<p>No agents recorded.</p>'}</article>`}
function addAgent(){const s=data(),name=prompt('Specialist name');if(!name)return;s.agents.push({id:uid(),name,role:prompt('Role')||'',status:'ready',task:'',capacity:100,quality:0});save(s);render()}function editAgent(i){const s=data(),a=s.agents[i];a.task=prompt('Current task',a.task||'')??a.task;a.status=prompt('Status',a.status||'ready')??a.status;a.capacity=Number(prompt('Capacity %',a.capacity??100));save(s);render()}
function campaign(s){return `<div class="two"><article class="panel"><h2>Campaign Flow Simulator</h2><p class="muted">Model progression across milestones and identify pacing, resource, equipment and difficulty spikes.</p><label>Campaign name<input id="campName"></label><label>Milestones<textarea id="campSteps" placeholder="Level 1 | power 10 | resources 5 | difficulty 8\nLevel 3 | power 18 | resources 9 | difficulty 15"></textarea></label><button class="primary" onclick="runCampaign()">Simulate</button><div id="campOut"></div></article><article class="panel"><h2>Saved campaign models</h2>${s.devOS.campaigns.map(c=>`<div class="row"><span class="grow"><b>${esc(c.name)}</b><small>${c.steps.length} milestones</small></span></div>`).join('')||'<p>None saved.</p>'}</article></div>`}
function runCampaign(){const s=data(),name=document.querySelector('#campName').value||'Campaign model',steps=document.querySelector('#campSteps').value.split('\n').filter(Boolean).map(x=>{const p=x.split('|').map(v=>v.trim());return {label:p[0],power:Number((p[1]||'').match(/[\d.]+/)?.[0]||0),resources:Number((p[2]||'').match(/[\d.]+/)?.[0]||0),difficulty:Number((p[3]||'').match(/[\d.]+/)?.[0]||0)}});const spikes=[];steps.slice(1).forEach((x,i)=>{const prev=steps[i];if(prev.power&&x.power/prev.power>1.6)spikes.push(`${x.label}: power spike`);if(x.difficulty-x.power>Math.max(5,x.power*.4))spikes.push(`${x.label}: difficulty may outpace power`)});s.devOS.campaigns.push({id:uid(),name,steps,created:new Date().toISOString()});save(s);document.querySelector('#campOut').innerHTML=`<div class="callout"><b>${spikes.length?spikes.join(' · '):'No major numeric spikes detected.'}</b><p>Review spotlight, choice density, recovery, travel and narrative pacing separately.</p></div>`}
function economy(s){return `<div class="two"><article class="panel"><h2>Economy Simulator</h2><p class="muted">Test income, recurring costs, purchase prices and arbitrage risk.</p><label>Starting wealth<input id="ecoStart" type="number" value="100"></label><label>Income per cycle<input id="ecoIncome" type="number" value="20"></label><label>Recurring costs<input id="ecoCosts" type="number" value="10"></label><label>Cycles<input id="ecoCycles" type="number" value="10"></label><label>Target purchase price<input id="ecoTarget" type="number" value="250"></label><button class="primary" onclick="runEconomy()">Simulate</button><div id="ecoOut"></div></article><article class="panel"><h2>Saved economy models</h2>${s.devOS.economy.map(x=>`<div class="row"><span class="grow"><b>${esc(x.name)}</b><small>Final wealth ${x.final}</small></span></div>`).join('')||'<p>None saved.</p>'}</article></div>`}
function runEconomy(){const s=data(),start=+document.querySelector('#ecoStart').value,income=+document.querySelector('#ecoIncome').value,costs=+document.querySelector('#ecoCosts').value,cycles=+document.querySelector('#ecoCycles').value,target=+document.querySelector('#ecoTarget').value,net=income-costs,final=start+net*cycles,time=net>0?Math.max(0,Math.ceil((target-start)/net)):Infinity,risk=net>target*.25?'High accumulation':net<=0?'Stagnation or loss':'Moderate';s.devOS.economy.push({id:uid(),name:`Economy ${new Date().toLocaleDateString()}`,final,net,target});save(s);document.querySelector('#ecoOut').innerHTML=`<div class="callout"><b>Final wealth: ${final}. Net per cycle: ${net}.</b><p>Target purchase reached in ${Number.isFinite(time)?time:'no'} cycles. ${risk}. Check resale loops, crafting conversion, shared ownership, repair, loot and faction discounts.</p></div>`}
function decisions(s){return `<article class="panel"><h2>Decision Log</h2><p class="muted">Preserve what was decided, why, rejected alternatives, evidence and revisit triggers.</p><button onclick="addDecision()">＋ Record decision</button>${s.decisions.map((d,i)=>`<div class="card" style="margin:9px 0"><b>${esc(d.title||'Decision')}</b><p>${esc(d.detail||d.rationale||'')}</p><small>${esc(d.status||'approved')} · ${esc(d.date||d.created||'')}</small>${d.alternatives?`<p><b>Rejected:</b> ${esc(d.alternatives)}</p>`:''}${d.revisit?`<p><b>Revisit when:</b> ${esc(d.revisit)}</p>`:''}</div>`).join('')||'<p>No decisions recorded.</p>'}</article>`}
function addDecision(){const s=data(),title=prompt('Decision');if(!title)return;s.decisions.unshift({id:uid(),title,detail:prompt('Why was this chosen?')||'',alternatives:prompt('Rejected alternatives')||'',revisit:prompt('What should trigger reconsideration?')||'',status:'approved',created:new Date().toISOString()});save(s);render()}
function release(s){const tests=s.testPlans||[],findings=s.testFindings||[],balance=objects(s).filter(o=>o.extensions?.['app.multiversal.aioc']?.balanceReport).length,blockedModules=s.featureModules.filter(m=>['blocked','future'].includes(m.stage)).length;return `<article class="panel"><h2>Release Control Center</h2><p class="muted">Combines feature, content, testing, balance and pipeline evidence for milestone decisions.</p>${s.devOS.releaseMilestones.map((m,i)=>{const active=m.status==='active';return `<div class="card" style="margin:10px 0"><div class="row"><span class="grow"><b>${esc(m.name)}</b><small>${esc(m.target)}</small></span><span class="badge">${esc(m.status)}</span><button onclick="setMilestone(${i})">Set active</button></div>${active?`<div class="grid"><div><b>${s.featureModules.length-blockedModules}/${s.featureModules.length}</b><small>modules not future/blocked</small></div><div><b>${tests.length}</b><small>test plans</small></div><div><b>${findings.filter(x=>x.status!=='closed').length}</b><small>open findings</small></div><div><b>${balance}/${objects(s).length}</b><small>balance reports</small></div></div><div class="callout">${releaseAdvice(s)}</div>`:''}</div>`}).join('')}</article>`}
function releaseAdvice(s){const blockers=[];if((s.testPlans||[]).length===0)blockers.push('No formal test plans');if((s.testFindings||[]).some(x=>['critical','high'].includes(String(x.severity).toLowerCase())&&x.status!=='closed'))blockers.push('Open high-severity findings');if(objects(s).some(o=>stage(s,o)==='concept'||stage(s,o)==='draft'))blockers.push('Draft content remains');if(s.featureModules.some(m=>m.stage==='blocked'))blockers.push('Blocked feature modules');return blockers.length?`<b>Not ready:</b> ${blockers.join(' · ')}`:'No high-level readiness blocker detected. Final schema, security, platform and regression gates still apply.'}
function setMilestone(i){const s=data();s.devOS.releaseMilestones.forEach((m,j)=>m.status=j===i?'active':j<i?'complete':'future');save(s);render()}
function filterRows(q,id){document.querySelectorAll(`#${id} [data-q]`).forEach(x=>x.style.display=x.dataset.q.includes(q.toLowerCase())?'flex':'none')}
render();
</script></body></html>
