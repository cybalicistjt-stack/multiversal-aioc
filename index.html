<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03040a">
<meta name="description" content="Multiversal AIOC Unified Desktop">
<meta name="aioc-build" content="unified-desktop-2.0">
<link rel="manifest" href="manifest.webmanifest?build=unified-desktop-2.0">
<link rel="icon" href="./icon-192.svg" type="image/svg+xml">
<link rel="stylesheet" href="unified-desktop.css?build=unified-desktop-2.0">
<title>Multiversal AIOC · Unified Desktop 2.0</title>
</head>
<body data-build="Unified Desktop 2.0">
<div class="mvdesk">
<header class="mv-top">
<button id="menuBtn" class="mv-iconbtn mv-mobile-menu" aria-label="Open navigation">☰</button>
<div><div class="mv-brand">MULTIVERSAL</div><div class="mv-subbrand">AIOC · Authoring & Operations Command</div></div>
<nav id="mvTabs" class="mv-tabs" aria-label="Open workspaces"></nav>
<div class="mv-top-actions"><button id="commandBtn" class="mv-iconbtn" title="Command palette">⌘</button><button id="reloadBtn" class="mv-iconbtn" title="Reload workspace">↻</button><button id="externalBtn" class="mv-iconbtn" title="Open workspace separately">↗</button></div>
</header>
<aside id="mvSidebar" class="mv-sidebar"></aside>
<main class="mv-main">
<div class="mv-workbar"><div id="workTitle" class="mv-work-title">AIOC Core</div><button id="splitBtn" class="mv-tab">Split View</button><button id="swapBtn" class="mv-tab">Swap</button></div>
<section id="workspace" class="mv-workspace">
<div class="mv-pane"><span id="primaryLabel" class="mv-pane-label">AIOC Core</span><iframe id="primaryFrame" title="Primary Multiversal workspace"></iframe></div>
<div id="resizer" class="mv-resizer" aria-label="Resize split view"></div>
<div class="mv-pane mv-pane-secondary"><span id="secondaryLabel" class="mv-pane-label">Balance Lab</span><iframe id="secondaryFrame" title="Secondary Multiversal workspace"></iframe></div>
</section>
</main>
<footer class="mv-status"><span class="ok">● Systems online</span><span id="statusObjects">0 objects</span><span id="statusPacks">0 packs</span><span>Current build <b id="statusBuild">2.0</b></span><span style="margin-left:auto">Local-first · shared project state</span></footer>
</div>
<div id="commandPalette" class="mv-command"><section class="mv-command-box"><div style="display:flex;gap:8px;align-items:center"><input id="commandInput" placeholder="Open a workspace…"><button id="commandClose" class="mv-iconbtn">✕</button></div><div id="commandResults" class="mv-command-results"></div></section></div>
<script src="unified-desktop.js?build=unified-desktop-2.0"></script>
<script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?build=unified-desktop-2.0',{updateViaCache:'none'}).then(r=>r.update()).catch(console.error));</script>
</body>
</html>
