<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#13151c" />
  <meta name="description" content="Multiversal AI Operations Center — local-first project command center." />
  <link rel="manifest" href="manifest.webmanifest?v=4" />
  <link rel="icon" href="./icon-192.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=4" />
  <link rel="stylesheet" href="authoring.css?v=4" />
  <title>Multiversal AIOC</title>
</head>
<body>
  <div id="app"></div>
  <script src="multiversal-seed.js?v=4"></script>
  <script src="app.js?v=4" defer></script>
  <script src="authoring.js?v=4" defer onload="render()"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./sw.js?v=4');
          await registration.update();
        } catch (error) {
          console.error('Service worker registration failed:', error);
        }
      });
    }
  </script>
</body>
</html>
