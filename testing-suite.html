<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13151c">
<title>Multiversal Game Testing Suite</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#101218;color:#f5f3f8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#222d39,#101218 48%);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:14px;background:#11141bea;border-bottom:1px solid #39424d}header a{color:#fff;text-decoration:none;border:1px solid #596674;border-radius:11px;padding:8px 11px}header b{display:block}header small{color:#aeb9c4}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 14px;background:#151922;border-bottom:1px solid #303844}.tabs button{white-space:nowrap;border:1px solid #475362;background:#202630;color:#dce5ee;border-radius:999px;padding:9px 12px}.tabs button.active{background:#426b86;border-color:#9bd4ef;color:#fff}main{max-width:1120px;margin:auto;padding:18px}.hero,.card,.panel{background:#1d232ddd;border:1px solid #46515e;border-radius:18px;padding:17px;box-shadow:0 12px 30px #0005}.hero h1{margin:5px 0 8px;font-size:28px}.hero p,.muted{color:#bcc6d0;line-height:1.48}.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:#263a49;color:#bde3f7;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:13px;margin-top:14px}.card h2,.card h3{margin:0 0 8px}.card p{color:#b9c3cd}.primary,.secondary,.danger{border:0;border-radius:11px;padding:11px 14px;font-weight:750}.primary{background:#4f89aa;color:#fff}.secondary{background:#343d48;color:#fff;border:1px solid #596674}.danger{background:#723e48;color:#fff}.wide{width:100%}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.metric{font-size:30px;font-weight:850}.list{display:grid;gap:9px}.row{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid #3e4955;border-radius:12px;background:#181d25}.row .grow{flex:1}.row b,.row small{display:block}.row small{color:#aeb8c2;margin-top:3px}.status{font-size:12px;border-radius:999px;padding:5px 8px;background:#29333e}.ok{border-left:4px solid #5bad85}.warn{border-left:4px solid #d6a85b}.fail{border-left:4px solid #d36b74}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-weight:700}.field small{color:#aeb8c2}.field input,.field select,.field textarea{width:100%;background:#11161d;color:#fff;border:1px solid #4d5a68;border-radius:10px;padding:10px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.question{padding:12px;border:1px solid #46515e;border-radius:12px;background:#171c24;margin-bottom:9px}.question b{display:block;margin-bottom:5px}.question textarea{width:100%;margin-top:8px;background:#10151c;color:#fff;border:1px solid #4d5a68;border-radius:9px;padding:9px}.checklist{display:grid;gap:8px}.checklist label{padding:9px;border:1px solid #404b57;border-radius:10px;background:#171c23}.step{display:none}.step.active{display:block}.progress{height:9px;background:#12171d;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:#63a1c4}.notice{padding:12px;border-left:4px solid #6ca8c8;background:#18242e;border-radius:9px;margin:12px 0}.report{background:#f4f0e7;color:#24222a;border-radius:16px;padding:22px}.report h1,.report h2{font-family:Georgia,serif}.report .rule{display:grid;grid-template-columns:150px 1fr;border-top:1px solid #c8c1b5;padding:7px 0}.empty{text-align:center;padding:24px;color:#aeb8c2}@media(max-width:700px){.columns{grid-template-columns:1fr}.report .rule{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style>
</head>
<body>
<header><a href="./index.html">← AIOC</a><div><b>Multiversal Game Testing Suite</b><small>Actual play, app testing, balance evidence, and decision reports</small></div></header>
<nav class="tabs" id="tabs"></nav><main id="app"></main>
<script>
const KEY='aioc-testing-suite-v1';
const TEST_TYPES={
 actual:{name:'Actual-play test',purpose:'Observe players and a GM using rules and content in a real session.',questions:['Can participants understand what choices are available?','Do choices create meaningful tradeoffs?','Where does play slow down or require rules lookup?','Does each participant receive useful spotlight?','Are difficulty, tension, and recovery appropriate?','Which rules are interpreted differently than intended?']},
 app:{name:'App usability test',purpose:'Test whether people can complete tasks correctly and confidently in the application.',questions:['Can the tester find the correct starting point?','Can the task be completed without outside explanation?','Where do errors, hesitation, or backtracking occur?','Are system states, permissions, and results understandable?','Can the user recover safely from mistakes?','Does the mobile experience remain usable?']},
 rules:{name:'Focused rules test',purpose:'Isolate a mechanic, subsystem, or interaction and test its clarity and outcomes.',questions:['What decision is this rule meant to create?','Does the rule produce the intended range of outcomes?','Are edge cases and timing interactions clear?','Can it be resolved consistently by different GMs?','Does it create exploits, dominant options, or dead choices?']},
 balance:{name:'Balance and stress test',purpose:'Collect repeated evidence about efficiency, difficulty, pacing, and counterplay.',questions:['What benchmark is the content expected to match?','How often does it outperform or underperform that benchmark?','How sensitive is it to party composition, terrain, initiative, or resources?','Does it create counterplay and meaningful weaknesses?','Is variance exciting, frustrating, or exploitable?']},
 regression:{name:'App regression test',purpose:'Verify that previously working behavior remains correct after a change.',questions:['What exact behavior must remain unchanged?','Which adjacent systems could be affected?','What saved-state, migration, offline, or permissions cases must be repeated?','What constitutes a blocking regression?']},
 content:{name:'Content and pack test',purpose:'Validate imported content, references, presentation, and runtime behavior.',questions:['Does the pack import and uninstall cleanly?','Do all stable references resolve?','Does the manual presentation match runtime behavior?','Are visibility, provenance, and canon status correct?','Does existing campaign state remain preserved?']}
};
const DEFAULT={plans:[],sessions:[],issues:[],decisions:[],templates:[],currentPlan:null};
let db=load(),view='home',wizard={step:0,data:{}};
function load(){try{return {...DEFAULT,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(DEFAULT)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));const s=loadAIOC();s.testingSuite=db;localStorage.setItem('aioc-state',JSON.stringify(s))}
function loadAIOC(){try{return JSON.parse(localStorage.getItem('aioc-state')||'{}')}catch{return {}}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return 'test-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}
function tabs(){const items=[['home','Overview'],['guide','What needs testing?'],['plans','Test plans'],['run','Run a session'],['issues','Findings & issues'],['reports','Reports']];document.querySelector('#tabs').innerHTML=items.map(([id,n])=>`<button class="${view===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('')}
function go(v){view=v;tabs();render()}
function render(){const fn={home,guide,plans,run,issues,reports}[view]||home;document.querySelector('#app').innerHTML=fn()}
function home(){const open=db.plans.filter(p=>!['complete','archived'].includes(p.status)).length,active=db.sessions.filter(s=>s.status==='active').length,unresolved=db.issues.filter(i=>!['resolved','accepted'].includes(i.status)).length;return `<section class="hero"><span class="badge">TESTING SUITE 1.0</span><h1>What question must the next test answer?</h1><p>Start with uncertainty, not with a general request to “playtest everything.” The Suite converts design risks into focused tests, evidence, findings, and decisions.</p><div class="toolbar"><button class="primary" onclick="startWizard()">Create guided test plan</button><button class="secondary" onclick="go('guide')">Find what needs testing</button></div></section><section class="grid"><article class="card"><div class="metric">${open}</div><h3>Open test plans</h3><p>Prepared or in progress.</p></article><article class="card"><div class="metric">${active}</div><h3>Live sessions</h3><p>Currently collecting evidence.</p></article><article class="card"><div class="metric">${unresolved}</div><h3>Unresolved findings</h3><p>Need triage or a decision.</p></article><article class="card"><div class="metric">${db.decisions.length}</div><h3>Testing decisions</h3><p>Conclusions preserved with evidence.</p></article></section><section class="panel" style="margin-top:14px"><h2>Recommended testing workflow</h2><div class="list">${['Identify the uncertainty or risk.','Choose the smallest test capable of answering it.','Write success, failure, and stop criteria before the session.','Collect observed behavior and measurable evidence separately from opinions.','Triage findings by severity, confidence, frequency, and affected scope.','Make a decision: change, preserve, investigate further, or accept the risk.','Create a regression test so the answer is not lost later.'].map((x,i)=>`<div class="row"><span class="status">${i+1}</span><div>${x}</div></div>`).join('')}</div></section>`}
function guide(){const modules=(loadAIOC().featureModules||[]),objects=(loadAIOC().gameObjects||[]);const suggestions=[];modules.forEach(m=>{if((m.progress?.tests??m.tests??0)<70)suggestions.push({name:m.name||m.title,type:'app',why:'Feature module test coverage is incomplete.',question:`Can users complete the primary ${m.name||m.title} workflow reliably?`})});objects.forEach(o=>{const ext=o.extensions?.['app.multiversal.aioc'];if(!ext?.balanceReport)suggestions.push({name:o.name||o.id,type:'balance',why:'No attached balance evidence.',question:`Does ${o.name||o.id} perform within its intended benchmark and role?`});if(!ext?.testEvidence)suggestions.push({name:o.name||o.id,type:'content',why:'No recorded runtime or content test evidence.',question:`Does ${o.name||o.id} behave in play exactly as its authored entry describes?`})});return `<section class="hero"><h1>Testing needs finder</h1><p>The list below is generated from local feature modules and authored game objects. It identifies missing evidence, not proof that something is defective.</p></section><div class="grid">${Object.entries(TEST_TYPES).map(([k,t])=>`<article class="card"><h3>${esc(t.name)}</h3><p>${esc(t.purpose)}</p><button class="secondary wide" onclick="startWizard('${k}')">Plan this test</button></article>`).join('')}</div><section class="panel" style="margin-top:14px"><h2>Suggested next tests</h2><div class="list">${suggestions.length?suggestions.slice(0,80).map(s=>`<div class="row warn"><div class="grow"><b>${esc(s.name)}</b><small>${esc(s.why)}</small><div>${esc(s.question)}</div></div><button class="secondary" onclick="startWizard('${s.type}','${escAttr(s.name)}','${escAttr(s.question)}')">Plan</button></div>`).join(''):'<div class="empty">No local modules or game objects currently require generated suggestions.</div>'}</div></section>`}
function escAttr(v){return String(v??'').replace(/'/g,"\\'").replace(/\n/g,' ')}
function startWizard(type='',subject='',question=''){wizard={step:0,data:{type,subject,primaryQuestion:question,questions:[],metrics:[],tasks:[],participants:'',environment:'',successCriteria:'',stopCriteria:'',risks:'',evidence:'',build:'',status:'draft'}};renderWizard()}
function renderWizard(){const steps=['Purpose','Questions','Method','Evidence','Review'];const d=wizard.data;let body=`<div class="progress"><span style="width:${(wizard.step+1)/steps.length*100}%"></span></div><p class="muted">Step ${wizard.step+1} of ${steps.length}: ${steps[wizard.step]}</p>`;
if(wizard.step===0)body+=`<div class="field"><label>Test type</label><select id="wtype">${Object.entries(TEST_TYPES).map(([k,t])=>`<option value="${k}" ${d.type===k?'selected':''}>${t.name}</option>`).join('')}</select><small>Choose the test that can answer the uncertainty with the least effort.</small></div><div class="field"><label>Subject under test</label><input id="wsubject" value="${esc(d.subject||'')}" placeholder="Feature, rule, adventure, object, build, or workflow"></div><div class="field"><label>Primary question</label><textarea id="wprimary" rows="4" placeholder="Example: Can a new player create a valid character without GM help?">${esc(d.primaryQuestion||'')}</textarea><small>A good test plan answers one primary question and only a few supporting questions.</small></div><div class="field"><label>Build, rules profile, or content version</label><input id="wbuild" value="${esc(d.build||'')}" placeholder="Commit, pack version, rules profile, or prototype name"></div>`;
if(wizard.step===1){const t=TEST_TYPES[d.type]||TEST_TYPES.actual;body+=`<div class="notice"><b>Suggested questions for ${esc(t.name)}</b><p>${esc(t.purpose)}</p></div><div class="checklist">${t.questions.map((q,i)=>`<label><input type="checkbox" class="wq" value="${esc(q)}" ${(d.questions||[]).includes(q)?'checked':''}> ${esc(q)}</label>`).join('')}</div><div class="field"><label>Additional questions, one per line</label><textarea id="wextra" rows="5">${esc(d.extraQuestions||'')}</textarea></div>`}
if(wizard.step===2)body+=`<div class="columns"><div><div class="field"><label>Participants and roles</label><textarea id="wparticipants" rows="5" placeholder="GM, players, observer, facilitator, device, experience level…">${esc(d.participants||'')}</textarea></div><div class="field"><label>Test environment</label><textarea id="wenvironment" rows="4" placeholder="Remote/in-person, phone model, browser, table setup, content available…">${esc(d.environment||'')}</textarea></div></div><div><div class="field"><label>Session tasks or scenes, one per line</label><textarea id="wtasks" rows="7" placeholder="Create a character\nImport the test pack\nRun a three-round encounter">${esc((d.tasks||[]).join('\n'))}</textarea></div><div class="field"><label>Known risks and confounds</label><textarea id="wrisks" rows="4">${esc(d.risks||'')}</textarea></div></div></div>`;
if(wizard.step===3)body+=`<div class="field"><label>Evidence to collect, one per line</label><textarea id="wevidence" rows="6" placeholder="Task completion\nTime on task\nRules lookups\nMisclicks/backtracks\nDamage per round\nParticipant quote">${esc(d.evidence||'')}</textarea></div><div class="field"><label>Success criteria</label><textarea id="wsuccess" rows="4" placeholder="State the observable result that supports the design.">${esc(d.successCriteria||'')}</textarea></div><div class="field"><label>Stop or safety criteria</label><textarea id="wstop" rows="4" placeholder="When should the facilitator pause, abandon, or invalidate the test?">${esc(d.stopCriteria||'')}</textarea></div>`;
if(wizard.step===4)body+=previewPlan(d);
body+=`<div class="toolbar"><button class="secondary" onclick="wizardBack()">${wizard.step?'Back':'Cancel'}</button><button class="primary" onclick="wizardNext()">${wizard.step===4?'Save test plan':'Continue'}</button></div>`;document.querySelector('#app').innerHTML=`<section class="hero"><h1>Guided test-plan builder</h1><p>Define the question before deciding how to test it.</p></section><section class="panel" style="margin-top:14px">${body}</section>`}
function captureWizard(){const d=wizard.data;if(wizard.step===0){d.type=val('wtype');d.subject=val('wsubject');d.primaryQuestion=val('wprimary');d.build=val('wbuild')}if(wizard.step===1){d.questions=[...document.querySelectorAll('.wq:checked')].map(x=>x.value);d.extraQuestions=val('wextra')}if(wizard.step===2){d.participants=val('wparticipants');d.environment=val('wenvironment');d.tasks=lines(val('wtasks'));d.risks=val('wrisks')}if(wizard.step===3){d.evidence=val('wevidence');d.successCriteria=val('wsuccess');d.stopCriteria=val('wstop')}}
function val(id){return document.getElementById(id)?.value.trim()||''}function lines(s){return String(s||'').split(/\n/).map(x=>x.trim()).filter(Boolean)}
function wizardNext(){captureWizard();if(wizard.step===0&&(!wizard.data.subject||!wizard.data.primaryQuestion))return alert('Add the subject and primary test question.');if(wizard.step<4){wizard.step++;renderWizard()}else{const p={...wizard.data,id:uid(),name:`${wizard.data.subject} — ${TEST_TYPES[wizard.data.type].name}`,created:new Date().toISOString(),updated:new Date().toISOString(),status:'planned'};p.questions=[...(p.questions||[]),...lines(p.extraQuestions)];db.plans.unshift(p);db.currentPlan=p.id;save();view='plans';tabs();render()}}
function wizardBack(){if(!wizard.step){view='home';tabs();render()}else{captureWizard();wizard.step--;renderWizard()}}
function previewPlan(d){return `<article class="report"><div class="badge">${esc(TEST_TYPES[d.type]?.name||'Test plan')}</div><h1>${esc(d.subject||'Untitled test')}</h1><p><b>Primary question:</b> ${esc(d.primaryQuestion||'')}</p><div class="rule"><b>Version</b><span>${esc(d.build||'Not recorded')}</span></div><div class="rule"><b>Participants</b><span>${esc(d.participants||'Not recorded')}</span></div><div class="rule"><b>Environment</b><span>${esc(d.environment||'Not recorded')}</span></div><h2>Supporting questions</h2><ul>${[...(d.questions||[]),...lines(d.extraQuestions)].map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h2>Tasks or scenes</h2><ol>${(d.tasks||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol><h2>Decision criteria</h2><p><b>Success:</b> ${esc(d.successCriteria||'Not defined')}</p><p><b>Stop:</b> ${esc(d.stopCriteria||'Not defined')}</p></article>`}
function plans(){return `<section class="hero"><h1>Test plans</h1><p>Every plan should identify a decision it can inform. Avoid combining unrelated questions into one session.</p><button class="primary" onclick="startWizard()">New guided plan</button></section><section class="list" style="margin-top:14px">${db.plans.length?db.plans.map(p=>`<article class="row ${p.status==='complete'?'ok':p.status==='blocked'?'fail':'warn'}"><div class="grow"><b>${esc(p.name)}</b><small>${esc(p.primaryQuestion)}</small><span class="status">${esc(p.status)}</span></div><button class="secondary" onclick="openPlan('${p.id}')">Open</button><button class="primary" onclick="startSession('${p.id}')">Run</button></article>`).join(''):'<div class="empty">No test plans yet.</div>'}</section>`}
function openPlan(id){const p=db.plans.find(x=>x.id===id);if(!p)return;document.querySelector('#app').innerHTML=`<section class="hero"><h1>${esc(p.subject)}</h1><p>${esc(p.primaryQuestion)}</p></section><section class="panel" style="margin-top:14px">${previewPlan(p)}<div class="toolbar"><button class="primary" onclick="startSession('${p.id}')">Start test session</button><button class="secondary" onclick="setPlanStatus('${p.id}','complete')">Mark complete</button><button class="secondary" onclick="go('plans')">Back</button></div></section>`}
function setPlanStatus(id,s){const p=db.plans.find(x=>x.id===id);if(p){p.status=s;p.updated=new Date().toISOString();save();go('plans')}}
function startSession(planId){const p=db.plans.find(x=>x.id===planId);if(!p)return;let s={id:uid(),planId,status:'active',started:new Date().toISOString(),notes:'',observations:[],metrics:{},answers:{},participants:'',build:p.build};db.sessions.unshift(s);save();db.currentSession=s.id;view='run';tabs();render()}
function run(){const active=db.sessions.find(s=>s.id===db.currentSession)||db.sessions.find(s=>s.status==='active');if(!active)return `<section class="hero"><h1>Run a testing session</h1><p>Select a prepared test plan. The live runner keeps observations separate from conclusions.</p></section><div class="list" style="margin-top:14px">${db.plans.filter(p=>p.status!=='complete').map(p=>`<div class="row"><div class="grow"><b>${esc(p.name)}</b><small>${esc(p.primaryQuestion)}</small></div><button class="primary" onclick="startSession('${p.id}')">Start</button></div>`).join('')||'<div class="empty">Create a test plan first.</div>'}</div>`;const p=db.plans.find(x=>x.id===active.planId);return `<section class="hero"><span class="badge">LIVE TEST</span><h1>${esc(p.subject)}</h1><p>${esc(p.primaryQuestion)}</p></section><section class="grid"><article class="card"><h3>Facilitator brief</h3><p>Do not coach unless the plan requires it. Ask participants to think aloud. Record what happened before interpreting why.</p><div class="checklist">${(p.tasks||[]).map((t,i)=>`<label><input type="checkbox" ${active.taskDone?.[i]?'checked':''} onchange="taskDone('${active.id}',${i},this.checked)"> ${esc(t)}</label>`).join('')}</div></article><article class="card"><h3>Observation capture</h3><div class="field"><label>Observed event</label><textarea id="obs" rows="5" placeholder="What happened? Avoid diagnosis in this field."></textarea></div><div class="field"><label>Evidence type</label><select id="obstype"><option>Behavior</option><option>Metric</option><option>Participant quote</option><option>Error</option><option>Rules interpretation</option><option>Balance outcome</option><option>Accessibility issue</option></select></div><button class="primary wide" onclick="addObservation('${active.id}')">Record observation</button></article></section><section class="panel" style="margin-top:14px"><h2>Live observation log</h2><div class="list">${(active.observations||[]).map((o,i)=>`<div class="row"><span class="status">${esc(o.type)}</span><div class="grow"><b>${esc(o.text)}</b><small>${new Date(o.at).toLocaleTimeString()}</small></div><button class="secondary" onclick="promoteIssue('${active.id}',${i})">Create finding</button></div>`).join('')||'<div class="empty">No observations yet.</div>'}</div><div class="toolbar"><button class="danger" onclick="finishSession('${active.id}')">End session and debrief</button></div></section>`}
function taskDone(id,i,on){const s=db.sessions.find(x=>x.id===id);s.taskDone=s.taskDone||{};s.taskDone[i]=on;save()}
function addObservation(id){const s=db.sessions.find(x=>x.id===id),text=val('obs');if(!text)return;s.observations.push({text,type:val('obstype'),at:new Date().toISOString()});save();render()}
function promoteIssue(sessionId,i){const s=db.sessions.find(x=>x.id===sessionId),o=s.observations[i],p=db.plans.find(x=>x.id===s.planId);db.issues.unshift({id:uid(),sessionId,planId:p.id,title:o.text.slice(0,90),evidence:o.text,type:o.type,severity:'medium',frequency:'observed once',confidence:'direct observation',status:'new',owner:'',decision:'',created:new Date().toISOString()});save();alert('Finding added to issue triage.')}
function finishSession(id){const s=db.sessions.find(x=>x.id===id);s.status='debrief';s.ended=new Date().toISOString();save();debrief(id)}
function debrief(id){const s=db.sessions.find(x=>x.id===id),p=db.plans.find(x=>x.id===s.planId);document.querySelector('#app').innerHTML=`<section class="hero"><h1>Session debrief</h1><p>Answer the planned questions from evidence. Separate confidence from preference.</p></section><section class="panel" style="margin-top:14px"><div id="debriefQs">${[p.primaryQuestion,...(p.questions||[])].map((q,i)=>`<div class="question"><b>${esc(q)}</b><textarea id="ans${i}" rows="3" placeholder="Answer, uncertainty, and supporting evidence…">${esc(s.answers?.[i]||'')}</textarea></div>`).join('')}</div><div class="columns"><div class="field"><label>What should change?</label><textarea id="change" rows="5">${esc(s.change||'')}</textarea></div><div class="field"><label>What should remain unchanged?</label><textarea id="preserve" rows="5">${esc(s.preserve||'')}</textarea></div></div><div class="field"><label>Required follow-up or regression test</label><textarea id="follow" rows="4">${esc(s.follow||'')}</textarea></div><div class="toolbar"><button class="primary" onclick="saveDebrief('${id}')">Save debrief and generate report</button></div></section>`}
function saveDebrief(id){const s=db.sessions.find(x=>x.id===id),p=db.plans.find(x=>x.id===s.planId);s.answers={};[p.primaryQuestion,...(p.questions||[])].forEach((_,i)=>s.answers[i]=val('ans'+i));s.change=val('change');s.preserve=val('preserve');s.follow=val('follow');s.status='complete';s.completed=new Date().toISOString();save();view='reports';tabs();render()}
function issues(){return `<section class="hero"><h1>Findings and issue triage</h1><p>A finding is evidence. A defect, balance problem, or design change is a conclusion that should cite that evidence.</p></section><div class="list" style="margin-top:14px">${db.issues.length?db.issues.map(i=>`<article class="row ${i.severity==='blocking'||i.severity==='critical'?'fail':i.severity==='low'?'ok':'warn'}"><div class="grow"><b>${esc(i.title)}</b><small>${esc(i.evidence)}</small><div><span class="status">${esc(i.severity)}</span> <span class="status">${esc(i.status)}</span> <span class="status">${esc(i.confidence)}</span></div></div><button class="secondary" onclick="editIssue('${i.id}')">Triage</button></article>`).join(''):'<div class="empty">No findings have been promoted yet.</div>'}</div>`}
function editIssue(id){const i=db.issues.find(x=>x.id===id);document.querySelector('#app').innerHTML=`<section class="hero"><h1>Triage finding</h1><p>${esc(i.title)}</p></section><section class="panel" style="margin-top:14px"><div class="field"><label>Severity</label><select id="isev">${['low','medium','high','critical','blocking'].map(x=>`<option ${i.severity===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Frequency</label><input id="ifreq" value="${esc(i.frequency)}"></div><div class="field"><label>Confidence</label><select id="iconf">${['hypothesis','participant report','direct observation','repeated observation','measured','reproduced'].map(x=>`<option ${i.confidence===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Decision / disposition</label><textarea id="idecision" rows="5">${esc(i.decision||'')}</textarea></div><div class="field"><label>Status</label><select id="istat">${['new','investigate','accepted','planned change','resolved','cannot reproduce'].map(x=>`<option ${i.status===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="primary" onclick="saveIssue('${id}')">Save triage</button></section>`}
function saveIssue(id){const i=db.issues.find(x=>x.id===id);i.severity=val('isev');i.frequency=val('ifreq');i.confidence=val('iconf');i.decision=val('idecision');i.status=val('istat');save();go('issues')}
function reports(){const complete=db.sessions.filter(s=>s.status==='complete');return `<section class="hero"><h1>Decision-ready testing reports</h1><p>Reports preserve the test question, version, evidence, answers, findings, and follow-up tests.</p></section><div class="list" style="margin-top:14px">${complete.length?complete.map(s=>{const p=db.plans.find(x=>x.id===s.planId);return `<div class="row"><div class="grow"><b>${esc(p?.subject||'Testing session')}</b><small>${esc(p?.primaryQuestion||'')}</small></div><button class="primary" onclick="showReport('${s.id}')">Open report</button></div>`}).join(''):'<div class="empty">Complete a testing session to create a report.</div>'}</div>`}
function showReport(id){const s=db.sessions.find(x=>x.id===id),p=db.plans.find(x=>x.id===s.planId),findings=db.issues.filter(i=>i.sessionId===id);document.querySelector('#app').innerHTML=`<article class="report"><div class="badge">${esc(TEST_TYPES[p.type]?.name)}</div><h1>${esc(p.subject)}</h1><p><b>Question:</b> ${esc(p.primaryQuestion)}</p><div class="rule"><b>Build / version</b><span>${esc(p.build||'Not recorded')}</span></div><div class="rule"><b>Session</b><span>${new Date(s.started).toLocaleString()}</span></div><h2>Evidence collected</h2><ul>${s.observations.map(o=>`<li><b>${esc(o.type)}:</b> ${esc(o.text)}</li>`).join('')}</ul><h2>Answers</h2>${[p.primaryQuestion,...(p.questions||[])].map((q,i)=>`<h3>${esc(q)}</h3><p>${esc(s.answers?.[i]||'No conclusion recorded.')}</p>`).join('')}<h2>Design disposition</h2><p><b>Change:</b> ${esc(s.change||'None recorded')}</p><p><b>Preserve:</b> ${esc(s.preserve||'None recorded')}</p><p><b>Follow-up:</b> ${esc(s.follow||'None recorded')}</p><h2>Findings</h2>${findings.length?findings.map(i=>`<div class="rule"><b>${esc(i.severity)}</b><span>${esc(i.title)} — ${esc(i.status)}</span></div>`).join(''):'<p>No promoted findings.</p>'}</article><div class="toolbar"><button class="secondary" onclick="go('reports')">Back</button><button class="primary" onclick="exportReport('${id}')">Download JSON report</button></div>`}
function exportReport(id){const s=db.sessions.find(x=>x.id===id),p=db.plans.find(x=>x.id===s.planId),issues=db.issues.filter(i=>i.sessionId===id);const blob=new Blob([JSON.stringify({format:'multiversal-testing-report/1.0',plan:p,session:s,issues},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${(p.subject||'test').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-testing-report.json`;a.click();URL.revokeObjectURL(a.href)}
tabs();render();
</script>
</body></html>
