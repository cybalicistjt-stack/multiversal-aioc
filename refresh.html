<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#13151c">
  <title>Updating Multiversal AIOC</title>
  <style>
    html,body{height:100%;margin:0;background:#0f1117;color:#f4f5fb;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{max-width:520px;width:100%;background:#171a23;border:1px solid #2c3140;border-radius:20px;padding:28px;box-sizing:border-box;text-align:center}h1{font-size:1.35rem;margin:0 0 12px}p{color:#b8bfd0;line-height:1.5}.spin{width:44px;height:44px;border:4px solid #32384a;border-top-color:#9f7aea;border-radius:50%;margin:0 auto 20px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{border:0;border-radius:12px;padding:13px 18px;background:#8b5cf6;color:white;font-weight:700;font-size:1rem}
  </style>
</head>
<body>
  <main class="card">
    <div class="spin"></div>
    <h1>Updating Multiversal AIOC</h1>
    <p id="status">Removing the old offline copy and loading the current build…</p>
    <button id="retry" hidden>Open current build</button>
  </main>
  <script>
    async function resetAIOC(){
      const status=document.getElementById('status');
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(k=>k.startsWith('multiversal-aioc')).map(k=>caches.delete(k)));
        }
        status.textContent='Update cleared. Opening Content Forge v1.1…';
        setTimeout(()=>location.replace('./?build=forge-1.1-'+Date.now()),500);
      }catch(error){
        status.textContent='The automatic reset could not finish. Tap below to open the newest build.';
        const b=document.getElementById('retry');b.hidden=false;b.onclick=()=>location.replace('./?build=forge-1.1-'+Date.now());
      }
    }
    resetAIOC();
  </script>
</body>
</html>
