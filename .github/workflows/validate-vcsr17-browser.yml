name: VCSR-17 Standalone Browser Acceptance
on:
  push:
    branches:
      - ops5/vcsr-cycle17-20261123
    paths:
      - 'governance/application-planning/vehicle-component-salvage-recovery/artifacts/Multiversal_VCSR_Cycle_17.html'
      - 'governance/application-planning/vehicle-component-salvage-recovery/VCSR-17_BROWSER_CHECK.cjs'
      - '.github/workflows/validate-vcsr17-browser.yml'
      - 'operations/work-items/VCSR-17.json'
  pull_request:
    paths:
      - 'governance/application-planning/vehicle-component-salvage-recovery/artifacts/Multiversal_VCSR_Cycle_17.html'
      - 'governance/application-planning/vehicle-component-salvage-recovery/VCSR-17_BROWSER_CHECK.cjs'
      - '.github/workflows/validate-vcsr17-browser.yml'
      - 'operations/work-items/VCSR-17.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    name: Cumulative 17-cycle browser / source-owner proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify VCSR17 source-bound offline file
        run: node governance/application-planning/vehicle-component-salvage-recovery/VCSR-17_BROWSER_CHECK.cjs
