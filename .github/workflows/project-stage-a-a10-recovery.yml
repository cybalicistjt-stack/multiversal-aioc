name: Project Stage A A10 Recovery

on:
  push:
    branches:
      - governance/stage-a-a10-revalidation-projection
    paths:
      - 'tools/project_stage_a_a10_recovery.py'
      - '.github/workflows/project-stage-a-a10-recovery.yml'

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Project completed A10 revalidation into canonical recovery state
        run: python tools/project_stage_a_a10_recovery.py
      - name: Commit bounded recovery projection
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/ai/runtime/CURRENT_WORK_POINTER.json \
                  governance/ai/runtime/CURRENT_IMPLEMENTATION_STATUS.json \
                  governance/ai/runtime/ROADMAP_INDEX.json \
                  governance/ai/work-state/STAGE-A-A10-current-revalidation-attempt-001.json \
                  governance/ai/MULTIVERSAL_NEW_CONVERSATION_BOOTSTRAP.md \
                  governance/application-planning/APPLICATION_IMPLEMENTATION_ROADMAP.md
          git diff --cached --quiet && { echo "projection already current"; exit 0; }
          git commit -m "Project A10 revalidation completion and activation boundary"
          git push origin HEAD:governance/stage-a-a10-revalidation-projection
