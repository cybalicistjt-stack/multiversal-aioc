name: Validate PPIA-01 Content Quality

on:
  pull_request:
    paths:
      - 'Csv.zip'
      - 'governance/object-system/csv-intake/**'
      - 'governance/application-planning/parallel-preimplementation/PPIA-01_CSV_CONTENT_QUALITY_AUDIT_FRAME.md'
      - 'governance/application-planning/parallel-preimplementation/PPIA-01_CSV_CONTENT_QUALITY_BASELINE.md'
      - 'governance/application-planning/parallel-preimplementation/PPIA-01_HIGH_PRIORITY_SOURCE_GAPS.csv'
      - 'governance/application-planning/parallel-preimplementation/PPIA-01_CONTENT_REPAIR_OVERLAY_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-01_CONTENT_REPAIR_OVERLAY_v0.2.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-01_CONTENT_REPAIR_OVERLAY_v0.3.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-01_MISSING_DEFINITION_CLOSURE_v0.1.0.json'
      - 'scripts/audit-ppia01-csv-content-quality.py'
      - 'scripts/analyze-ppia01-shapeshifter-pricing.py'
      - 'scripts/analyze-ppia01-gap-name-candidates.py'
      - 'scripts/validate-ppia01-repair-overlay.py'
      - 'scripts/validate-ppia01-missing-definitions.py'
      - 'scripts/run-full-csv-registry-reconciliation.py'
      - '.github/workflows/validate-ppia-01-content-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reproduce final 19,199-row registry reconciliation
        run: python scripts/run-full-csv-registry-reconciliation.py

      - name: Generate PPIA-01 CSV quality baseline
        run: |
          rm -rf build/ppia01-content-quality
          mkdir -p build/ppia01-content-quality
          python scripts/audit-ppia01-csv-content-quality.py \
            --output build/ppia01-content-quality/baseline.json \
            | tee build/ppia01-content-quality/summary.json

      - name: Verify deterministic audit output
        run: |
          python scripts/audit-ppia01-csv-content-quality.py \
            --output build/ppia01-content-quality/baseline-second.json \
            > build/ppia01-content-quality/summary-second.json
          cmp build/ppia01-content-quality/baseline.json build/ppia01-content-quality/baseline-second.json
          python - <<'PY'
          import json
          report=json.load(open('build/ppia01-content-quality/baseline.json',encoding='utf-8'))
          assert report['format']=='multiversal-ppia01-csv-content-quality-baseline'
          assert report['summary']['datasets']==20
          assert report['summary']['rows']==19199
          assert report['sourceAuthority']['finalRegistryWorkstream']=='8E-009L63'
          assert report['sourceAuthority']['ownerDelegationStatus']=='approved-and-active'
          assert len(report['highPrioritySourceGapRows'])==report['summary']['highPrioritySourceGapRows']
          assert report['summary']['highPrioritySourceGapRows']==84
          print(json.dumps(report['summary'],sort_keys=True))
          PY

      - name: Analyze exact-name candidates for explicit gaps
        run: |
          python scripts/analyze-ppia01-gap-name-candidates.py \
            --baseline build/ppia01-content-quality/baseline.json \
            --output build/ppia01-content-quality/gap-name-candidates.json \
            | tee build/ppia01-content-quality/gap-name-summary.json
          python - <<'PY'
          import json
          report=json.load(open('build/ppia01-content-quality/gap-name-candidates.json',encoding='utf-8'))
          assert report['summary']['gapRows']==84
          assert report['summary']['gapRowsWithExactNameCandidates']==4
          assert report['summary']['gapRowsWithoutExactNameCandidates']==80
          assert report['summary']['exactNameCandidateOccurrences']==5
          assert report['summary']['automaticResolutions']==0
          print(json.dumps(report['summary'],sort_keys=True))
          PY

      - name: Analyze Shapeshifter pricing-only source rows
        run: |
          python scripts/analyze-ppia01-shapeshifter-pricing.py \
            --output build/ppia01-content-quality/shapeshifter-pricing.json \
            --csv-output build/ppia01-content-quality/shapeshifter-pricing.csv \
            | tee build/ppia01-content-quality/shapeshifter-summary.json
          python - <<'PY'
          import json
          report=json.load(open('build/ppia01-content-quality/shapeshifter-pricing.json',encoding='utf-8'))
          assert report['summary']['detailedAbilityRows']==60
          assert report['summary']['pricingOnlyRows']==57
          assert report['summary']['exactNameSameBranchCandidates']==0
          assert report['summary']['exactNameCrossBranchCandidates']==1
          assert report['summary']['pricingRowsWithoutExactNameCandidate']==56
          assert report['summary']['automaticMerges']==0
          assert report['branches']['Combat Forms']['pricingOnlyRows']==20
          assert report['branches']['Environmental Adaptations']['pricingOnlyRows']==19
          assert report['branches']['Utility Transformations']['pricingOnlyRows']==18
          print(json.dumps(report['summary'],sort_keys=True))
          PY

      - name: Verify reconciliation analysis determinism
        run: |
          python scripts/analyze-ppia01-gap-name-candidates.py \
            --baseline build/ppia01-content-quality/baseline.json \
            --output build/ppia01-content-quality/gap-name-candidates-second.json \
            > build/ppia01-content-quality/gap-name-summary-second.json
          cmp build/ppia01-content-quality/gap-name-candidates.json build/ppia01-content-quality/gap-name-candidates-second.json
          python scripts/analyze-ppia01-shapeshifter-pricing.py \
            --output build/ppia01-content-quality/shapeshifter-pricing-second.json \
            --csv-output build/ppia01-content-quality/shapeshifter-pricing-second.csv \
            > build/ppia01-content-quality/shapeshifter-summary-second.json
          cmp build/ppia01-content-quality/shapeshifter-pricing.json build/ppia01-content-quality/shapeshifter-pricing-second.json
          cmp build/ppia01-content-quality/shapeshifter-pricing.csv build/ppia01-content-quality/shapeshifter-pricing-second.csv

      - name: Validate governed repair overlays against raw source
        run: python scripts/validate-ppia01-repair-overlay.py | tee build/ppia01-content-quality/repair-overlay-validation.json

      - name: Validate missing-definition closure against raw source
        run: python scripts/validate-ppia01-missing-definitions.py | tee build/ppia01-content-quality/missing-definition-validation.json

      - name: Verify tracked checkout was not mutated
        run: git diff --exit-code

      - name: Upload exact audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ppia-01-csv-content-quality-baseline
          path: |
            build/ppia01-content-quality/baseline.json
            build/ppia01-content-quality/summary.json
            build/ppia01-content-quality/gap-name-candidates.json
            build/ppia01-content-quality/gap-name-summary.json
            build/ppia01-content-quality/shapeshifter-pricing.json
            build/ppia01-content-quality/shapeshifter-pricing.csv
            build/ppia01-content-quality/shapeshifter-summary.json
            build/ppia01-content-quality/repair-overlay-validation.json
            build/ppia01-content-quality/missing-definition-validation.json
          retention-days: 30
