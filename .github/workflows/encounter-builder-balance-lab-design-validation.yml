name: Validate Encounter Builder and Balance Lab Design

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F012_*'
      - 'governance/application-planning/internal-alpha/validate_encounter_builder_balance_lab_design.py'
      - '.github/workflows/encounter-builder-balance-lab-design-validation.yml'
  workflow_dispatch:

concurrency:
  group: encounter-builder-balance-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python governance/application-planning/internal-alpha/validate_encounter_builder_balance_lab_design.py
