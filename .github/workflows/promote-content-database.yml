name: Promote Certified Content Database

on:
  workflow_run:
    workflows: ['Certify Content Database Pipeline']
    types: [completed]
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Successful Certify Content Database Pipeline run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: promote-certified-content-database
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      VALIDATION_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_run_id || github.event.workflow_run.id }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source certification run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID="$VALIDATION_RUN_ID"
          run_json="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$REPOSITORY/actions/runs/$RUN_ID")"
          workflow_name="$(jq -r '.name' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          event="$(jq -r '.event' <<<"$run_json")"
          head_branch="$(jq -r '.head_branch' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          [ "$workflow_name" = 'Certify Content Database Pipeline' ] || { echo "Unexpected workflow: $workflow_name"; exit 1; }
          [ "$conclusion" = 'success' ] || { echo "Certification run is not successful: $conclusion"; exit 1; }
          [ "$head_branch" = 'main' ] || { echo "Certification run did not certify main: $head_branch"; exit 1; }
          printf '%s\n' "$head_sha" > /tmp/validated-head-sha
          printf 'Certified source run %s (%s, event %s).\n' "$RUN_ID" "$head_sha" "$event"

      - name: Download certified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID="$VALIDATION_RUN_ID"
          rm -rf /tmp/certified-content
          mkdir -p /tmp/certified-content
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name certified-content-database --dir /tmp/certified-content
          test -f /tmp/certified-content/content-db/index.json
          test -f /tmp/certified-content/content-db/manifest.json
          test -f /tmp/certified-content/content-db/certification.json

      - name: Revalidate promotion contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const root = '/tmp/certified-content/content-db';
          const index = JSON.parse(fs.readFileSync(`${root}/index.json`, 'utf8'));
          const manifest = JSON.parse(fs.readFileSync(`${root}/manifest.json`, 'utf8'));
          const certificate = JSON.parse(fs.readFileSync(`${root}/certification.json`, 'utf8'));
          if (certificate.result !== 'PASS') throw new Error(`Certificate is not PASS: ${certificate.result}`);
          if (index.format !== 'multiversal-content-database') throw new Error('Unexpected database format');
          if (!Array.isArray(index.records) || index.records.length < 1000) throw new Error('Certified database is incomplete');
          if (index.recordCount !== index.records.length) throw new Error('Index record count mismatch');
          if (manifest.recordCount !== index.recordCount) throw new Error('Manifest record count mismatch');
          if (certificate.recordCount !== index.recordCount) throw new Error('Certificate record count mismatch');
          const semantic = index.records.map(r => [r.databaseId, r.stableId, r.objectType, r.name]);
          const fingerprint = `sha256:${crypto.createHash('sha256').update(JSON.stringify(semantic)).digest('hex')}`;
          if (certificate.semanticFingerprint !== fingerprint) throw new Error('Certificate fingerprint mismatch');
          console.log(`Promotion contract PASS: ${index.recordCount} records, ${fingerprint}`);
          NODE

      - name: Promote generated database
        run: |
          set -euo pipefail
          RUN_ID="$VALIDATION_RUN_ID"
          rm -rf content-db
          cp -R /tmp/certified-content/content-db content-db
          validated_sha="$(cat /tmp/validated-head-sha)"
          RUN_ID="$RUN_ID" VALIDATED_SHA="$validated_sha" PROMOTION_RUN_ID="${{ github.run_id }}" node - <<'NODE'
          const fs = require('fs');
          const value = {
            format: 'multiversal-content-database-promotion',
            promotedAt: new Date().toISOString(),
            validationRunId: String(process.env.RUN_ID),
            validatedCommit: process.env.VALIDATED_SHA,
            promotedByRun: String(process.env.PROMOTION_RUN_ID)
          };
          fs.writeFileSync('content-db/promotion.json', JSON.stringify(value, null, 2) + '\n');
          NODE

      - name: Commit promoted database
        run: |
          set -euo pipefail
          RUN_ID="$VALIDATION_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content-db
          if git diff --cached --quiet; then
            echo 'Certified database already matches the repository.'
            exit 0
          fi
          git commit -m "Promote certified content database from run $RUN_ID"
          git push origin HEAD:main
