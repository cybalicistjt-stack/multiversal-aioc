name: VCSR-18 Golden Browser and Accessibility Acceptance
on:
  push:
    branches:
      - ops5/vcsr-cycle18-20261123
    paths:
      - 'governance/application-planning/vehicle-component-salvage-recovery/artifacts/Multiversal_VCSR_Cycle_18.html'
      - 'governance/application-planning/vehicle-component-salvage-recovery/VCSR-18_BROWSER_CHECK.cjs'
      - '.github/workflows/validate-vcsr18-browser.yml'
      - 'operations/work-items/VCSR-18.json'
  pull_request:
    paths:
      - 'governance/application-planning/vehicle-component-salvage-recovery/artifacts/Multiversal_VCSR_Cycle_18.html'
      - 'governance/application-planning/vehicle-component-salvage-recovery/VCSR-18_BROWSER_CHECK.cjs'
      - '.github/workflows/validate-vcsr18-browser.yml'
      - 'operations/work-items/VCSR-18.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  golden-browser:
    name: Complete 18-cycle source and UX acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate full offline golden workflow
        run: node governance/application-planning/vehicle-component-salvage-recovery/VCSR-18_BROWSER_CHECK.cjs
