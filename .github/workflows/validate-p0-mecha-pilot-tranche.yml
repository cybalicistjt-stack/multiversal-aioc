name: Validate P0 Mecha Pilot Tranche

on:
  pull_request:
    paths:
      - 'governance/object-system/csv-intake/P0_MECHA_PILOT_TRANCHE_CONTRACT.json'
      - 'scripts/run-p0-mecha-pilot-tranche.py'
      - '.github/workflows/validate-p0-mecha-pilot-tranche.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete governed mecha pilot tranche
        run: python scripts/run-p0-mecha-pilot-tranche.py
      - uses: actions/upload-artifact@v4
        with:
          name: csv-p0-mecha-pilot-tranche-107
          path: build/csv-p0-mecha-pilot-tranche-l48/
