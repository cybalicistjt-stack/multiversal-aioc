name: VCSR-15 Standalone Browser Acceptance
on:
  push:
    branches:
      - ops5/vcsr-cycle15-20261123
    paths:
      - 'governance/application-planning/vehicle-component-salvage-recovery/artifacts/Multiversal_VCSR_Cycle_15.html'
      - 'governance/application-planning/vehicle-component-salvage-recovery/VCSR-15_BROWSER_CHECK.cjs'
      - '.github/workflows/validate-vcsr15-browser.yml'
      - 'operations/work-items/VCSR-15.json'
  pull_request:
    paths:
      - 'governance/application-planning/vehicle-component-salvage-recovery/artifacts/Multiversal_VCSR_Cycle_15.html'
      - 'governance/application-planning/vehicle-component-salvage-recovery/VCSR-15_BROWSER_CHECK.cjs'
      - '.github/workflows/validate-vcsr15-browser.yml'
      - 'operations/work-items/VCSR-15.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    name: Cumulative offline browser and owner-handoff checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify VCSR15 cumulative offline document
        run: node governance/application-planning/vehicle-component-salvage-recovery/VCSR-15_BROWSER_CHECK.cjs
