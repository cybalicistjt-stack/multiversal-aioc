name: Validate PPIA-16 Completion Contract

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-16_*'
      - 'governance/application-planning/parallel-preimplementation/PPIA_PROGRAM_BACKLOG.json'
      - 'governance/application-planning/parallel-preimplementation/validate_ppia_program.py'
      - 'governance/application-planning/parallel-preimplementation/validate_ppia_program_state.py'
      - 'governance/ai/work-state/PPIA-16-attempt-001.json'
      - 'governance/ai/runtime/CURRENT_WORK_POINTER.json'
      - 'governance/ai/runtime/CURRENT_IMPLEMENTATION_STATUS.json'
      - 'scripts/validate-ppia16-completion-contracts.py'
      - 'scripts/validate-ppia16-historical-predecessor.py'
      - 'scripts/validate-ppia15-completion-contracts.py'
      - '.github/workflows/validate-ppia-16-completion-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ppia16-completion-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA-16 Completion Contract
        run: python scripts/validate-ppia16-completion-contracts.py
      - name: Validate PPIA-16 Integrated predecessor evidence
        run: python scripts/validate-ppia16-historical-predecessor.py integrated
      - name: Validate PPIA-16 Screen/Action predecessor evidence
        run: python scripts/validate-ppia16-historical-predecessor.py screen
      - name: Validate PPIA-16 Foundation predecessor evidence
        run: python scripts/validate-ppia16-historical-predecessor.py foundation
      - name: Validate PPIA-15 to PPIA-16 transition evidence
        run: python scripts/validate-ppia16-historical-predecessor.py transition
      - name: Validate PPIA-15 completion dependency regression
        run: python scripts/validate-ppia15-completion-contracts.py
      - name: Validate generalized PPIA continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program_state.py
      - name: Validate conversation continuity
        run: python tools/continuity_state.py validate
      - name: Run conversation continuity regression tests
        run: python -m unittest discover -s tests/continuity -v
