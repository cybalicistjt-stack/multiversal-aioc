name: Validate PPIA Program

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/**'
      - 'governance/application-planning/APPLICATION_IMPLEMENTATION_ROADMAP.md'
      - 'governance/ai/runtime/CURRENT_WORK_POINTER.json'
      - 'governance/ai/runtime/CURRENT_IMPLEMENTATION_STATUS.json'
      - 'governance/ai/runtime/ROADMAP_INDEX.json'
      - 'governance/ai/work-state/PPIA-01-attempt-001.json'
      - 'governance/ai/work-state/PPIA-16-attempt-001.json'
      - '.github/workflows/validate-ppia-program.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA program and continuity projections
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program_state.py
