name: ARI-21 start projection
on:
  push:
    branches: [governance/ari-21-start]
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/ari-21-start
          fetch-depth: 0
      - name: Project ARI-21 governed start
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text())
          def save(p,v): Path(p).write_text(json.dumps(v,indent=2)+"\n")
          branch="implementation/ari-21-missing-source-relink-derivative-rebuild-recovery"
          cp_path="governance/ai/work-state/ARI-21-attempt-001.json"
          cp=load(cp_path)
          cp.update({"schema_version":"0.4.0","status":"in_progress","implementation_authority":True,"implementation_branch":branch,"completed":False,"started_at":"2026-09-13T07:06:02-05:00","active_substep":"governed_start","next_action":"Validate and merge this atomic AIOC start projection, run transaction preflight against fresh application branch/open-PR state, then create only the reserved ARI-21 implementation branch."})
          cp["convergence_control"]={"owner_continue_count":1,"execution_cycles":1,"repair_cycles":0,"no_progress_cycles":0,"diagnostic_mode":False,"last_failure_signature":None,"last_failure_class":None,"diagnostic_hypotheses":[],"retry_basis":None,"service_objective":{"ordinary_tranche_single_continue_target_percent":100,"max_execution_cycles_without_genuine_blocker":1,"unrelated_historical_validation_jobs_target":0,"reruns_without_changed_evidence_target":0,"post_merge_stale_pointer_target":0}}
          save(cp_path,cp)

          p=load("governance/ai/runtime/CURRENT_WORK_POINTER.json")
          p["schema_version"]="20.10.0"
          p["selection_reason"]="Owner authorized ARI-21 execution on 2026-09-13. ARI-20 is completed_verified and ARI-21 is now in_progress on its reserved branch under the sealed ARI family preflight."
          p["active_attempt"].update({"status":"in_progress","implementation_branch":branch,"implementation_authority":True})
          p["bounded_authority"].update({"selected_ari_unit":"ARI-21","ari_implementation":True,"implementation_branch":branch,"rule":"ARI-21 alone has bounded product implementation authority on the reserved branch; ARI-22A+ remain inactive."})
          p["selection_invariants"]=[s.replace("ARI-21 is selected_not_started with no implementation branch or implementation authority.","ARI-21 is in_progress with bounded implementation authority only on the reserved branch; ARI-22A+ remain inactive.") for s in p["selection_invariants"]]
          p["exact_next_action"]="Validate and merge the governed ARI-21 start projection, pass execution transaction preflight against fresh branch/open-PR state, then create only implementation/ari-21-missing-source-relink-derivative-rebuild-recovery."
          save("governance/ai/runtime/CURRENT_WORK_POINTER.json",p)

          a=load("governance/ai/runtime/ACTIVE_AUTHORITY_REGISTRY.json")
          a["schema_version"]="20.15.0"
          a["rule"]="Only registered CURRENT or CURRENT_COMPATIBLE surfaces may govern. ARI-20 is completed_verified. ARI-21 is in_progress with bounded implementation authority only on implementation/ari-21-missing-source-relink-derivative-rebuild-recovery; ARI-22A+ remain inactive."
          a["active_planning_work"].update({"state":"in_progress","implementation_branch":branch,"implementation_authority":True,"implementation_scope":"ARI-21 alone may implement bounded missing-source/relink/derivative-rebuild recovery; ARI-22A+ remain inactive."})
          a["family_preflight"]["implementation_authority"]=True
          a["roadmap_execution_authority"]["implementation_authority"]=True
          save("governance/ai/runtime/ACTIVE_AUTHORITY_REGISTRY.json",a)

          r=load("governance/repository-health/RUNTIME_STATE_LIFECYCLE_REGISTRY.json")
          r["active_work"].update({"state":"in_progress","implementation_branch":branch,"implementation_authority":True,"execution_rule":"ARI-21 alone has bounded product mutation authority after fresh collision state passes execution_transaction_preflight.py; ARI-22A+ remain inactive."})
          save("governance/repository-health/RUNTIME_STATE_LIFECYCLE_REGISTRY.json",r)

          c=load("governance/ai/runtime/ROADMAP_COMPILED_PROJECTION.json")
          c["current_selection"].update({"status":"in_progress","implementation_authority":True})
          save("governance/ai/runtime/ROADMAP_COMPILED_PROJECTION.json",c)
          PY
          rm .github/workflows/ari21-start-projection.yml
          git config user.name multiversal-start
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "ARI-21: record governed start"
          git push origin HEAD:governance/ari-21-start
