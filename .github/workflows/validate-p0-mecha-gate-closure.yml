name: Validate P0 Mecha Gate Closure

on:
  pull_request:
    paths:
      - 'governance/object-system/csv-intake/P0_MECHA_GATE_CLOSURE_CONTRACT.json'
      - 'scripts/close-p0-mecha-promotion-gates.py'
      - '.github/workflows/validate-p0-mecha-gate-closure.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Close mecha promotion gates and validate canonical pilot package
        run: python scripts/close-p0-mecha-promotion-gates.py
      - uses: actions/upload-artifact@v4
        with:
          name: csv-p0-mecha-gate-closure-107
          path: build/csv-p0-mecha-gate-closure-l50/
