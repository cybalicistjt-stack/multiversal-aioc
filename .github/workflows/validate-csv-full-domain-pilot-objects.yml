name: Validate CSV Full-Domain Pilot Objects

on:
  pull_request:
    paths:
      - 'governance/object-system/csv-intake/CSV_FULL_DOMAIN_PILOT_OBJECTS.json'
      - 'governance/object-system/csv-intake/CSV_FULL_DOMAIN_REPRESENTATIVE_SELECTIONS.json'
      - 'governance/object-system/item-examples/CSV_PILOT_CONVERSION_OBJECTS.json'
      - 'scripts/validate-csv-full-domain-pilot-objects.py'
      - '.github/workflows/validate-csv-full-domain-pilot-objects.yml'
  push:
    branches: [main]
    paths:
      - 'governance/object-system/csv-intake/CSV_FULL_DOMAIN_PILOT_OBJECTS.json'
      - 'governance/object-system/csv-intake/CSV_FULL_DOMAIN_REPRESENTATIVE_SELECTIONS.json'
      - 'governance/object-system/item-examples/CSV_PILOT_CONVERSION_OBJECTS.json'
      - 'scripts/validate-csv-full-domain-pilot-objects.py'
      - '.github/workflows/validate-csv-full-domain-pilot-objects.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-csv-full-domain-pilot-objects.py
