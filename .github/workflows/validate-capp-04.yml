name: Validate CAPP Integrated Tranche

on:
  pull_request:
    paths:
      - 'governance/application-planning/character-appearance-production/CAPP-*'
      - 'tools/capp0*.py'
      - 'tools/capp1*.py'
      - 'scripts/validate-capp*.py'
      - '.github/workflows/validate-capp-04.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded integration repair if needed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tools/capp05_appearance_compiler.py')
          s=p.read_text()
          s=s.replace('full_body_3q','full_body_three_quarter')
          s=s.replace('    hidden_count = 0\n','')
          s=s.replace('            hidden_count += 1\n','')
          s=s.replace('        "hidden_asset_count": hidden_count,\n','        "permission_filter_applied": True,\n')
          s=s.replace('    assert one["hidden_asset_count"] == 1\n','    assert one["permission_filter_applied"] is True and "hidden_asset_count" not in one\n')
          p.write_text(s)
          base=Path('governance/application-planning/character-appearance-production')
          q=base/'CAPP-07_APPEARANCE_STUDIO_IMPLEMENTATION_SPEC_v0.1.0.json'; d=json.loads(q.read_text()); d['layout_regions'][2]['contains'][0]='full_body_three_quarter'; q.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          q=base/'CAPP-08_PORTRAIT_TOKEN_EXPORT_CONTRACT_v0.1.0.json'; d=json.loads(q.read_text()); d['permission_filtering']['allowed_metadata']=['permission_projection_id','permission_filter_applied','coverage_state','public_diagnostics']; q.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          q=base/'CAPP-10_ACCESSIBILITY_DESCRIPTION_GRAMMAR_v0.1.0.json'; d=json.loads(q.read_text()); d['permission_filtering']['filtered_count_may_be_reported']=False; q.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add tools/capp05_appearance_compiler.py governance/application-planning/character-appearance-production/CAPP-07_APPEARANCE_STUDIO_IMPLEMENTATION_SPEC_v0.1.0.json governance/application-planning/character-appearance-production/CAPP-08_PORTRAIT_TOKEN_EXPORT_CONTRACT_v0.1.0.json governance/application-planning/character-appearance-production/CAPP-10_ACCESSIBILITY_DESCRIPTION_GRAMMAR_v0.1.0.json
            git commit -m 'Apply bounded CAPP integration repair'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Validate CAPP-04 asset coverage foundation
        run: python scripts/validate-capp04-asset-manifest-coverage.py
      - name: Validate integrated CAPP-04 through CAPP-12 build
        run: python scripts/validate-capp-integrated-build.py
      - name: Validate cross-contract privacy and renderer identifiers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path('governance/application-planning/character-appearance-production')
          c5=json.loads((b/'CAPP-05_DETERMINISTIC_APPEARANCE_COMPILER_CONTRACT_v0.1.0.json').read_text())
          c7=json.loads((b/'CAPP-07_APPEARANCE_STUDIO_IMPLEMENTATION_SPEC_v0.1.0.json').read_text())
          c8=json.loads((b/'CAPP-08_PORTRAIT_TOKEN_EXPORT_CONTRACT_v0.1.0.json').read_text())
          c10=json.loads((b/'CAPP-10_ACCESSIBILITY_DESCRIPTION_GRAMMAR_v0.1.0.json').read_text())
          tool=Path('tools/capp05_appearance_compiler.py').read_text()
          assert 'hidden_asset_count' not in c5['output_contract']['required']
          assert c5['invariants']['hidden_asset_count_reported'] is False
          assert '"hidden_asset_count": hidden_count' not in tool
          assert c7['layout_regions'][2]['contains'][0]=='full_body_three_quarter'
          assert 'filtered_field_count' not in c8['permission_filtering']['allowed_metadata']
          assert c10['permission_filtering']['filtered_count_may_be_reported'] is False
          print('CAPP cross-contract privacy/view validation: PASS')
          PY
      - name: Report generated CAPP-11 corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.capp11_generate_qa_corpus import generate
          p=json.loads(Path('governance/application-planning/character-appearance-production/CAPP-01_SOURCE_AUTHORITY_AND_PROFILE_INDEX_v0.1.0.json').read_text())
          c=generate(p)
          print('CAPP-11 cases=',c['case_count'])
          print('CAPP-11 categories=',json.dumps(c['category_counts'],sort_keys=True))
          print('CAPP-11 sha256=',c['corpus_sha256'])
          assert c['case_count'] >= 900
          PY
