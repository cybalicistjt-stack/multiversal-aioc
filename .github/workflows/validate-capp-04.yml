name: Validate CAPP Integrated Tranche

on:
  pull_request:
    paths:
      - 'governance/application-planning/character-appearance-production/CAPP-*'
      - 'governance/ai/runtime/CURRENT_WORK_POINTER.json'
      - 'governance/ai/runtime/CURRENT_IMPLEMENTATION_STATUS.json'
      - 'governance/ai/work-state/CAPP-04-attempt-001.json'
      - 'tools/capp0*.py'
      - 'tools/capp1*.py'
      - 'scripts/validate-capp*.py'
      - '.github/workflows/validate-capp-04.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CAPP-04 asset coverage foundation
        run: python scripts/validate-capp04-asset-manifest-coverage.py
      - name: Validate integrated CAPP-04 through CAPP-12 build
        run: python scripts/validate-capp-integrated-build.py
      - name: Validate continuity state
        run: python tools/continuity_state.py validate
      - name: Validate final CAPP projection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path('governance/application-planning/character-appearance-production')
          backlog=json.loads((b/'CAPP_PROGRAM_BACKLOG.json').read_text())
          receipt=json.loads((b/'CAPP-04-12_VERIFIED_COMPLETION_RECEIPT_v1.0.0.json').read_text())
          assert backlog['completed_work_items']==12
          assert backlog['active_work_item_id'] is None
          assert backlog['next_planned_work_item_id'] is None
          assert all(x['status']=='completed_verified' for x in backlog['work_items'])
          assert receipt['state']=='completed_verified'
          assert receipt['qa_corpus']['case_count']==917
          assert all(v is False for v in backlog['boundaries'].values())
          print('CAPP final projection: PASS')
          PY
      - name: Report generated CAPP-11 corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.capp11_generate_qa_corpus import generate
          p=json.loads(Path('governance/application-planning/character-appearance-production/CAPP-01_SOURCE_AUTHORITY_AND_PROFILE_INDEX_v0.1.0.json').read_text())
          c=generate(p)
          print('CAPP-11 cases=',c['case_count'])
          print('CAPP-11 sha256=',c['corpus_sha256'])
          assert c['case_count']==917
          assert c['corpus_sha256']=='7b5aeaafb73da140a63065c86cb8a3886516731e66518b05e470d4a23761f024'
          PY
