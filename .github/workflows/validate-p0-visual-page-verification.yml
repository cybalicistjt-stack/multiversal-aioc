name: Validate P0 Visual Page Verification

on:
  pull_request:
    paths:
      - 'governance/object-system/csv-intake/P0_VISUAL_PAGE_VERIFICATION_CONTRACT.json'
      - 'governance/object-system/csv-intake/P0_VISUAL_PAGE_VERIFICATION.json'
      - 'scripts/validate-p0-visual-page-verification.py'
      - '.github/workflows/validate-p0-visual-page-verification.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate visual page verification evidence
        run: python scripts/validate-p0-visual-page-verification.py
      - uses: actions/upload-artifact@v4
        with:
          name: csv-p0-visual-page-verification-33
          path: governance/object-system/csv-intake/P0_VISUAL_PAGE_VERIFICATION.json
          if-no-files-found: error
