name: Validate Campaign Scene Session Design

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F005_*'
      - 'governance/application-planning/internal-alpha/validate_campaign_scene_session_design.py'
      - '.github/workflows/campaign-scene-session-design-validation.yml'
  workflow_dispatch:

concurrency:
  group: campaign-scene-session-design-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python governance/application-planning/internal-alpha/validate_campaign_scene_session_design.py
