name: VTI-09 RED Unlock Projection
on:
  push:
    branches:
      - governance/vti-09-seal-red-unlock-production
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/vti-09-seal-red-unlock-production
          fetch-depth: 0
      - name: Project sealed RED unlock
        run: python3 scripts/_vti09_red_unlock_projection.py
      - name: Remove temporary helpers before validation
        run: rm scripts/_vti09_red_unlock_projection.py .github/workflows/vti09-red-unlock-projection.yml
      - name: Run control-plane regressions
        run: python3 -m unittest discover -s tests/control_plane -p 'test_*.py'
      - name: Run repository health
        run: python3 scripts/validate_repository_health.py --root .
      - name: Commit validated RED unlock tree
        run: |
          git config user.name "cybalicistjt-stack"
          git config user.email "cybalicist.jt@gmail.com"
          git add -A
          git commit -m "VTI-09: seal matching RED and unlock bounded production"
          git push origin HEAD:governance/vti-09-seal-red-unlock-production
