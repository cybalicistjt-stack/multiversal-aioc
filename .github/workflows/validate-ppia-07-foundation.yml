name: Validate PPIA-07 Foundation

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_SOURCE_AND_DESIGN_INVENTORY.md'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_SOURCE_MANIFEST_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_RUNE_COMPOSITION_TAXONOMY_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_AUTHORITY_AND_BOUNDARY_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_FOUNDATION_CANDIDATE.md'
      - 'governance/ai/work-state/PPIA-07-attempt-001.json'
      - 'scripts/validate-ppia07-foundation.py'
      - '.github/workflows/validate-ppia-07-foundation.yml'
  push:
    branches:
      - governance/ppia-07-rune-construction-rpg-system

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA-07 source/design foundation
        run: python scripts/validate-ppia07-foundation.py
      - name: Validate PPIA-12 to PPIA-07 transition continuity
        run: python scripts/validate-ppia12-to-ppia07-transition.py
      - name: Validate generalized PPIA program continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program.py
