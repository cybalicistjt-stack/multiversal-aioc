name: Build Survivor Review Tranche 03

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-survivor-review-tranche-03.yml'

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Syntax preflight
        run: python -m py_compile audit/build_direct_review_campaign_v4.py
      - name: Download latest successful v4 candidates
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          RUN_ID=$(gh run list --workflow='Run Semantic Recovery v4' --status=success --limit=1 --json databaseId --jq='.[0].databaseId')
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --dir downloaded
          C=$(find downloaded -path '*/canonical/canonical-candidates-v4.jsonl' -print -quit)
          test -n "$C"
          mkdir -p input
          cp "$C" input/canonical-candidates-v4.jsonl
      - name: Build fresh review campaign
        run: python audit/build_direct_review_campaign_v4.py --candidates input --out survivor-review-v4 --batch-size 30
      - name: Assemble survivor tranche 03
        run: |
          mkdir -p tranche-03
          for f in \
            creature-batch-01.json \
            npc-batch-01.json \
            adventure-batch-01.json \
            faction-batch-01.json \
            item-batch-01.json \
            vehicle-batch-01.json \
            ability-batch-01.json \
            ability-batch-02.json \
            species-batch-01.json \
            environment-batch-01.json \
            world-batch-01.json; do
            test -f "survivor-review-v4/$f" && cp "survivor-review-v4/$f" tranche-03/
          done
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('tranche-03')
          files=[]
          total=0
          families={}
          for p in sorted(d.glob('*.json')):
              data=json.loads(p.read_text())
              count=len(data.get('records', []))
              fam=data.get('family', p.name.split('-batch-')[0])
              files.append({'file':p.name,'family':fam,'count':count})
              total += count
              families[fam]=families.get(fam,0)+count
          index={
              'format':'multiversal-survivor-review-tranche-03',
              'version':'1.0.0',
              'recordCount':total,
              'familyCounts':families,
              'files':files,
              'authority':'Review evidence only; no decision changes canon.'
          }
          (d/'survivor-review-tranche-03-index.json').write_text(json.dumps(index,indent=2)+'\n')
          PY
      - name: Upload complete survivor tranche
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-survivor-review-tranche-03-${{ github.run_id }}
          path: tranche-03/
          retention-days: 90
      - name: Publish survivor tranche
        run: |
          DEST=v2/audit-data/semantic-recovery-v4/survivor-review-tranche-03
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp tranche-03/*.json "$DEST"/
          git config user.name 'multiversal-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish survivor review tranche 03 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
