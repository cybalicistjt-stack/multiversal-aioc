name: VCSR-16 Standalone Browser Acceptance
on:
  push:
    branches:
      - ops5/vcsr-cycle16-20261123
    paths:
      - 'governance/application-planning/vehicle-component-salvage-recovery/artifacts/Multiversal_VCSR_Cycle_16.html'
      - 'governance/application-planning/vehicle-component-salvage-recovery/VCSR-16_BROWSER_CHECK.cjs'
      - '.github/workflows/validate-vcsr16-browser.yml'
      - 'operations/work-items/VCSR-16.json'
  pull_request:
    paths:
      - 'governance/application-planning/vehicle-component-salvage-recovery/artifacts/Multiversal_VCSR_Cycle_16.html'
      - 'governance/application-planning/vehicle-component-salvage-recovery/VCSR-16_BROWSER_CHECK.cjs'
      - '.github/workflows/validate-vcsr16-browser.yml'
      - 'operations/work-items/VCSR-16.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    name: Full cumulative offline Character/GM browser proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify cumulative Cycle16 document
        run: node governance/application-planning/vehicle-component-salvage-recovery/VCSR-16_BROWSER_CHECK.cjs
