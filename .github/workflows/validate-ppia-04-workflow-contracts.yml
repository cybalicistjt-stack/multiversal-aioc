name: Validate PPIA-04 Workflow Contracts

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-04_WORKFLOW_AUTHORING_CONTRACT_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-04_VEHICLE_INSPECTOR_PROJECTION_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-04_REFERENCE_CASES_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-04_VEHICLE_EXPERIENCE_TAXONOMY_v0.1.0.json'
      - 'scripts/validate-ppia04-workflow-contracts.py'
      - '.github/workflows/validate-ppia-04-workflow-contracts.yml'
  push:
    branches:
      - governance/ppia-04-vehicle-mecha-starship
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-04_WORKFLOW_AUTHORING_CONTRACT_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-04_VEHICLE_INSPECTOR_PROJECTION_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-04_REFERENCE_CASES_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-04_VEHICLE_EXPERIENCE_TAXONOMY_v0.1.0.json'
      - 'scripts/validate-ppia04-workflow-contracts.py'
      - '.github/workflows/validate-ppia-04-workflow-contracts.yml'

permissions:
  contents: read

jobs:
  validate-ppia04-workflow-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PPIA-04 workflow and authoring contracts
        run: python scripts/validate-ppia04-workflow-contracts.py
