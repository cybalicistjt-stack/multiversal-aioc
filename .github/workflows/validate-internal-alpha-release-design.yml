name: Validate Internal Alpha Release Design

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/IA-D09_*'
      - 'governance/application-planning/internal-alpha/validate_internal_alpha_release_design.py'
      - '.github/workflows/validate-internal-alpha-release-design.yml'
  push:
    branches:
      - main
    paths:
      - 'governance/application-planning/internal-alpha/IA-D09_*'
      - 'governance/application-planning/internal-alpha/validate_internal_alpha_release_design.py'
      - '.github/workflows/validate-internal-alpha-release-design.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate IA-D09 release design
        run: python governance/application-planning/internal-alpha/validate_internal_alpha_release_design.py
