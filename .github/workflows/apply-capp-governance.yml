name: Apply CAPP Governance Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/apply-capp-governance.py'
      - '.github/workflows/apply-capp-governance.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'governance/capp-character-appearance-production-prep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact CAPP roadmap/bootstrap patch
        run: python scripts/apply-capp-governance.py
      - name: Commit patched governance
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply CAPP roadmap and bootstrap governance patch'
          git push origin HEAD:${{ github.head_ref }}
