name: Validate PPIA-08 to PPIA-09 Transition

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA_PROGRAM_BACKLOG.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-08_COMPLETION_REPORT.md'
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F011_*'
      - 'governance/ai/work-state/PPIA-08-attempt-001.json'
      - 'governance/ai/work-state/PPIA-09-attempt-001.json'
      - 'governance/ai/runtime/CURRENT_WORK_POINTER.json'
      - 'governance/ai/runtime/CURRENT_IMPLEMENTATION_STATUS.json'
      - 'scripts/validate-ppia08-completion-contracts.py'
      - 'scripts/validate-ppia08-to-ppia09-transition.py'
      - 'governance/application-planning/parallel-preimplementation/validate_ppia_program.py'
      - '.github/workflows/validate-ppia-08-to-09-transition.yml'
  push:
    branches:
      - governance/ppia-08-to-ppia-09-transition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-transition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA-08 completion and PPIA-09 transition
        run: python scripts/validate-ppia08-to-ppia09-transition.py
      - name: Validate PPIA-08 completion regression
        run: python scripts/validate-ppia08-completion-contracts.py
      - name: Validate PPIA-08 workflow regression
        run: python scripts/validate-ppia08-workflow-contracts.py
      - name: Validate PPIA-07 to PPIA-08 historical transition
        run: python scripts/validate-ppia07-to-ppia08-transition.py
      - name: Validate generalized PPIA continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program.py
