name: Validate Vehicle Mecha Starship Operations Design

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/**'
      - '.github/workflows/vehicle-operations-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python governance/application-planning/internal-alpha/validate_vehicle_mecha_starship_operations.py
