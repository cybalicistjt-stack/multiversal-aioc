name: Validate First Playable Action and GM Approval Loop

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F006_*'
      - 'governance/application-planning/internal-alpha/validate_first_playable_action_approval_loop.py'
      - '.github/workflows/first-playable-action-approval-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F006_*'
      - 'governance/application-planning/internal-alpha/validate_first_playable_action_approval_loop.py'
      - '.github/workflows/first-playable-action-approval-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate First Playable Action and GM Approval Loop
        run: python governance/application-planning/internal-alpha/validate_first_playable_action_approval_loop.py
