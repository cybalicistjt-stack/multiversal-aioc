name: Validate First Playable Action and GM Approval Loop

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F006_*'
      - 'governance/application-planning/internal-alpha/validate_first_playable_action_approval_loop.py'
      - 'governance/application-planning/internal-alpha/INTERNAL_ALPHA_FEATURE_REGISTRY.json'
      - 'governance/application-planning/internal-alpha/INTERNAL_ALPHA_DESIGN_BACKLOG.md'
      - 'governance/application-planning/internal-alpha/README.md'
      - 'governance/application-planning/internal-alpha/feature-packets/README.md'
      - 'governance/ai/runtime/ROADMAP_INDEX.json'
      - '.github/workflows/first-playable-action-approval-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate First Playable Action and GM Approval Loop
        run: python governance/application-planning/internal-alpha/validate_first_playable_action_approval_loop.py
