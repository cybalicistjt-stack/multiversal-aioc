          Path('tests/control_plane/test_vti09_first_full_platform_integration_registration.py').write_text('''import json\nimport unittest\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[2]\ndef load_json(p): return json.loads((ROOT/p).read_text())\nclass Vti09LifecycleTests(unittest.TestCase):\n def test_vti09_terminal_evidence_and_vti10_selection(self):\n  cp=load_json("governance/ai/work-state/VTI-09-attempt-001.json"); nxt=load_json("governance/ai/work-state/VTI-10-attempt-001.json"); b=load_json("governance/application-planning/virtual-tabletop-interoperability/VTI_PROGRAM_BACKLOG.json"); p=load_json("governance/ai/runtime/CURRENT_WORK_POINTER.json"); a=load_json("governance/ai/runtime/ACTIVE_AUTHORITY_REGISTRY.json"); r=load_json("governance/repository-health/RUNTIME_STATE_LIFECYCLE_REGISTRY.json")\n  self.assertEqual(cp["status"],"completed_verified"); self.assertTrue(cp["authority_retired"]); self.assertFalse(cp["implementation_authority"]); self.assertFalse(cp["production_mutation_authorized"]); self.assertEqual(cp["application_merge_sha"],"'''+MERGE+''' ".strip())\n  self.assertEqual(cp["validation"]["final_green"]["head_sha"],"'''+GREEN['head_sha']+'''"); self.assertEqual(cp["validation"]["final_green"]["deterministic_receipt_sha256"],"'''+GREEN['deterministic_receipt_sha256']+'''")\n  self.assertEqual(nxt["status"],"selected_not_started"); self.assertIsNone(nxt["implementation_branch"]); self.assertFalse(nxt["implementation_authority"]); self.assertEqual(nxt["application_baseline_sha"],"'''+MERGE+'''")\n  self.assertEqual(b["completed_through"],"VTI-09"); self.assertEqual(b["current_item"],"VTI-10"); self.assertEqual(p["active_attempt"]["work_item_id"],"VTI-10"); self.assertEqual(r["active_work"]["work_item"],"VTI-10")\n  self.assertTrue(a["vti_09_authority"]["retired"]); self.assertFalse(a["vti_09_authority"]["implementation_authority"]); self.assertTrue(a["vti_10_authority"]["selected_not_started"]); self.assertFalse(a["vti_10_authority"]["implementation_authority"])\nif __name__=="__main__": unittest.main()\n''')
