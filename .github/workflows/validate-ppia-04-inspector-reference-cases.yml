name: Validate PPIA-04 Inspector and Reference Cases

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-04_VEHICLE_INSPECTOR_PROJECTION_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-04_REFERENCE_CASES_v0.1.0.json'
      - 'scripts/validate-ppia04-inspector-reference-cases.py'
      - '.github/workflows/validate-ppia-04-inspector-reference-cases.yml'
  push:
    branches:
      - governance/ppia-04-vehicle-mecha-starship
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-04_VEHICLE_INSPECTOR_PROJECTION_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-04_REFERENCE_CASES_v0.1.0.json'
      - 'scripts/validate-ppia04-inspector-reference-cases.py'
      - '.github/workflows/validate-ppia-04-inspector-reference-cases.yml'

permissions:
  contents: read

jobs:
  validate-ppia04-inspector-reference-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PPIA-04 projection matrix and reference cases
        run: python scripts/validate-ppia04-inspector-reference-cases.py
