name: Generate Interaction Pilot Scorecards for CAPP Governance

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/generate-capp-interaction-scorecards.yml'

permissions:
  contents: read

jobs:
  generate:
    if: github.head_ref == 'governance/capp-character-appearance-production-prep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate deterministic interaction scorecards
        id: generate
        continue-on-error: true
        run: python tools/interaction_pilot.py run --generated-at 2026-08-13T12:29:00+00:00
      - name: Print source scorecard
        run: |
          echo '===SOURCE_SCORECARD_BEGIN==='
          cat governance/ai/interaction-system/pilot/OPERATIONAL_PILOT_SCORECARD.json
          echo '===SOURCE_SCORECARD_END==='
      - name: Print runtime scorecard
        run: |
          echo '===RUNTIME_SCORECARD_BEGIN==='
          cat governance/ai/runtime/INTERACTION_OPERATIONAL_SCORECARD.json
          echo '===RUNTIME_SCORECARD_END==='
      - name: Preserve pilot conclusion
        if: steps.generate.outcome != 'success'
        run: exit 1
