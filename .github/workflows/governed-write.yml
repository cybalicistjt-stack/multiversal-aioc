name: Governed Write

on:
  push:
    branches: ['governance/**']
    paths: ['governance/ai/write-request.json']

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/governed_write_bridge.py apply --request governance/ai/write-request.json
      - run: python tools/governed_write_bridge.py self-test
      - run: |
          rm governance/ai/write-request.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add governance scripts tools tests
          git commit -m 'Apply governed write request'
          git push origin HEAD:${GITHUB_REF_NAME}
