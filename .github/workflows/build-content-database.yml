name: Certify Content Database Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/materialize-content-source.mjs'
      - 'scripts/build-content-database.mjs'
      - 'scripts/certify-content-pipeline.mjs'
      - 'catalog-seed-parts/**'
      - 'content-source/**'
      - '.github/workflows/build-content-database.yml'
      - '.github/workflows/promote-content-database.yml'
      - '.github/workflows/verify-promoted-content-database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certify-content-database
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check pipeline syntax
        run: |
          node --check scripts/materialize-content-source.mjs
          node --check scripts/build-content-database.mjs
          node --check scripts/certify-content-pipeline.mjs

      - name: Materialize canonical source bundle
        run: node scripts/materialize-content-source.mjs

      - name: Build database in isolated runner workspace
        run: node scripts/build-content-database.mjs

      - name: Independently certify seed, source, and generated database
        run: node scripts/certify-content-pipeline.mjs

      - name: Verify promotion artifact contract
        run: |
          test -f content-db/index.json
          test -f content-db/manifest.json
          test -f content-db/certification.json
          node - <<'NODE'
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('content-db/index.json', 'utf8'));
          const certificate = JSON.parse(fs.readFileSync('content-db/certification.json', 'utf8'));
          if (certificate.result !== 'PASS') throw new Error('Certificate is not PASS');
          if (certificate.recordCount !== index.recordCount) throw new Error('Certificate record count mismatch');
          if (!String(certificate.semanticFingerprint || '').startsWith('sha256:')) throw new Error('Semantic fingerprint is missing');
          console.log(`Artifact contract PASS: ${certificate.recordCount} records; ${certificate.semanticFingerprint}`);
          NODE

      - name: Show certification result
        run: cat evidence/content-pipeline/latest-certificate.json

      - name: Upload certified database and evidence
        uses: actions/upload-artifact@v4
        with:
          name: certified-content-database
          path: |
            content-db
            evidence/content-pipeline/latest-certificate.json
          retention-days: 30
          if-no-files-found: error
