name: Certify Content Database Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/materialize-content-source.mjs'
      - 'scripts/build-content-database.mjs'
      - 'scripts/certify-content-pipeline.mjs'
      - 'catalog-seed-parts/**'
      - 'content-source/**'
      - '.github/workflows/build-content-database.yml'
      - '.github/workflows/promote-content-database.yml'
      - '.github/workflows/verify-promoted-content-database.yml'
      - '.github/workflows/record-content-pipeline-result.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certify-content-database
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check pipeline syntax
        run: |
          node --check scripts/materialize-content-source.mjs
          node --check scripts/build-content-database.mjs
          node --check scripts/certify-content-pipeline.mjs

      - name: Materialize canonical source bundle
        run: node scripts/materialize-content-source.mjs

      - name: Diagnose seed archive boundaries
        run: |
          mkdir -p evidence/content-pipeline
          node - <<'NODE' | tee evidence/content-pipeline/seed-layout.txt
          const fs = require('fs');
          const crypto = require('crypto');
          const parts = [0,1,2,3,4].map(i => `catalog-seed-parts/phase1-7.${String(i).padStart(2,'0')}.txt`);
          const clean = value => String(value).replace(/[^A-Za-z0-9+/=]/g, '');
          const hash = value => crypto.createHash('sha256').update(value).digest('hex');
          let joined = '';
          for (const file of parts) {
            const raw = fs.readFileSync(file, 'utf8');
            const compact = clean(raw);
            const padding = [...compact].map((c,i) => c === '=' ? i : -1).filter(i => i >= 0);
            console.log(JSON.stringify({
              file,
              rawBytes: Buffer.byteLength(raw),
              compactLength: compact.length,
              modulo4: compact.length % 4,
              prefix: compact.slice(0,16),
              suffix: compact.slice(-16),
              paddingCount: padding.length,
              firstPadding: padding.length ? padding[0] : null,
              lastPadding: padding.length ? padding.at(-1) : null,
              compactSha256: hash(compact)
            }));
            joined += compact;
          }
          const internalPadding = [...joined].map((c,i) => c === '=' && i < joined.length - 2 ? i : -1).filter(i => i >= 0);
          console.log(JSON.stringify({
            joinedLength: joined.length,
            joinedModulo4: joined.length % 4,
            joinedPrefix: joined.slice(0,16),
            joinedSuffix: joined.slice(-16),
            totalPadding: [...joined].filter(c => c === '=').length,
            internalPaddingCount: internalPadding.length,
            firstInternalPadding: internalPadding.length ? internalPadding[0] : null,
            joinedSha256: hash(joined)
          }));
          NODE

      - name: Build database in isolated runner workspace
        run: node scripts/build-content-database.mjs

      - name: Independently certify seed, source, and generated database
        run: node scripts/certify-content-pipeline.mjs

      - name: Verify promotion artifact contract
        run: |
          test -f content-db/index.json
          test -f content-db/manifest.json
          test -f content-db/certification.json
          node - <<'NODE'
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('content-db/index.json', 'utf8'));
          const certificate = JSON.parse(fs.readFileSync('content-db/certification.json', 'utf8'));
          if (certificate.result !== 'PASS') throw new Error('Certificate is not PASS');
          if (certificate.recordCount !== index.recordCount) throw new Error('Certificate record count mismatch');
          if (!String(certificate.semanticFingerprint || '').startsWith('sha256:')) throw new Error('Semantic fingerprint is missing');
          console.log(`Artifact contract PASS: ${certificate.recordCount} records; ${certificate.semanticFingerprint}`);
          NODE

      - name: Show certification result
        run: cat evidence/content-pipeline/latest-certificate.json

      - name: Upload certified database and evidence
        uses: actions/upload-artifact@v4
        with:
          name: certified-content-database
          path: |
            content-db
            evidence/content-pipeline/latest-certificate.json
          retention-days: 30
          if-no-files-found: error

      - name: Write bounded runner summary
        if: always()
        run: |
          mkdir -p evidence/content-pipeline
          {
            echo '# Content certification runner summary'
            echo
            echo "- Run: ${GITHUB_RUN_ID}"
            echo "- Attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Recorded: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Certificate present: $([ -f content-db/certification.json ] && echo yes || echo no)"
            echo "- Database index present: $([ -f content-db/index.json ] && echo yes || echo no)"
          } | tee evidence/content-pipeline/runner-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-certification-runner-diagnostics
          path: evidence/content-pipeline
          retention-days: 14
          if-no-files-found: warn
