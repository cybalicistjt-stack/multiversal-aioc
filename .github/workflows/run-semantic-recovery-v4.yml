name: Run Semantic Recovery v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit/build_hierarchical_structure.py'
      - 'audit/reconstruct_tables_and_forms.py'
      - 'audit/build_object_assembly_v4.py'
      - 'audit/filter_assembled_objects_v4.py'
      - 'audit/build_relationships_and_canonical_v4.py'
      - 'audit/sanitize_canonical_relationships_v4.py'
      - 'audit/build_golden_corpus_packet_v4.py'
      - 'audit/evaluate_golden_corpus_v4.py'
      - 'audit/golden-corpus-v4.json'
      - 'docs/SEMANTIC-RECOVERY-V4-PROGRAM.md'
      - '.github/workflows/run-semantic-recovery-v4.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: multiversal-semantic-recovery-v4
  cancel-in-progress: true

jobs:
  recovery-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize status receipts
        run: mkdir -p semantic-recovery-v4/status/receipts

      - name: Syntax preflight
        id: preflight
        continue-on-error: true
        run: |
          python -m py_compile \
            audit/build_hierarchical_structure.py \
            audit/reconstruct_tables_and_forms.py \
            audit/build_object_assembly_v4.py \
            audit/filter_assembled_objects_v4.py \
            audit/build_relationships_and_canonical_v4.py \
            audit/sanitize_canonical_relationships_v4.py \
            audit/build_golden_corpus_packet_v4.py \
            audit/evaluate_golden_corpus_v4.py
      - name: Record preflight
        if: always()
        run: printf '{"stage":"preflight","outcome":"%s"}\n' '${{ steps.preflight.outcome }}' > semantic-recovery-v4/status/receipts/preflight.json

      - name: Download authoritative forensic artifact
        id: source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow='Run Forensic Audit' --status=success --limit=1 --json databaseId --jq='.[0].databaseId')
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --dir downloaded
          ARCHIVE=$(find downloaded -name 'multiversal-forensic-audit-output.tar.gz' -print -quit)
          test -n "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          test -f audit-output/findings.jsonl
      - name: Record source
        if: always()
        run: printf '{"stage":"source","outcome":"%s"}\n' '${{ steps.source.outcome }}' > semantic-recovery-v4/status/receipts/source.json

      - name: Build hierarchical evidence
        id: hierarchy
        continue-on-error: true
        if: steps.preflight.outcome == 'success' && steps.source.outcome == 'success'
        run: python audit/build_hierarchical_structure.py --input audit-output --out semantic-recovery-v4/hierarchy
      - name: Record hierarchy
        if: always()
        run: printf '{"stage":"hierarchy","outcome":"%s"}\n' '${{ steps.hierarchy.outcome }}' > semantic-recovery-v4/status/receipts/hierarchy.json

      - name: Reconstruct tables and forms
        id: reconstruction
        continue-on-error: true
        if: steps.hierarchy.outcome == 'success'
        run: python audit/reconstruct_tables_and_forms.py --structure semantic-recovery-v4/hierarchy --out semantic-recovery-v4/reconstruction
      - name: Record reconstruction
        if: always()
        run: printf '{"stage":"reconstruction","outcome":"%s"}\n' '${{ steps.reconstruction.outcome }}' > semantic-recovery-v4/status/receipts/reconstruction.json

      - name: Assemble and boundary-filter complete objects
        id: assembly
        continue-on-error: true
        if: steps.hierarchy.outcome == 'success'
        run: |
          python audit/build_object_assembly_v4.py --structure semantic-recovery-v4/hierarchy --out semantic-recovery-v4/assembly
          python audit/filter_assembled_objects_v4.py --assembly semantic-recovery-v4/assembly
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('semantic-recovery-v4/assembly/object-assembly-v4-index.json')
          d=json.loads(p.read_text())
          assert d['assembledObjectCount'] > 0, d
          assert len(d['familyCounts']) >= 3, d
          bad=('Ac: 13','HP: 10','Campaign Use','Investigation Hooks')
          names={x.get('name') for x in d.get('publishedSample',[])}
          assert not any(x in names for x in bad), (bad,names)
          PY
      - name: Record assembly
        if: always()
        run: printf '{"stage":"assembly","outcome":"%s"}\n' '${{ steps.assembly.outcome }}' > semantic-recovery-v4/status/receipts/assembly.json

      - name: Build and sanitize relationships and canonical envelopes
        id: canonical
        continue-on-error: true
        if: steps.assembly.outcome == 'success'
        run: |
          python audit/build_relationships_and_canonical_v4.py --assembly semantic-recovery-v4/assembly --out semantic-recovery-v4/canonical
          python audit/sanitize_canonical_relationships_v4.py --canonical semantic-recovery-v4/canonical
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('semantic-recovery-v4/canonical/canonical-candidate-v4-index.json')
          d=json.loads(p.read_text())
          assert d['candidateCount'] > 0, d
          for row in d.get('publishedSample',[]):
              assert row.get('name') != 'Ac: 13', row
              for rel in row.get('relationships') or []:
                  assert not re.fullmatch(r'[a-z],?', str(rel.get('targetName') or ''), re.I), rel
          PY
      - name: Record canonical
        if: always()
        run: printf '{"stage":"canonical","outcome":"%s"}\n' '${{ steps.canonical.outcome }}' > semantic-recovery-v4/status/receipts/canonical.json

      - name: Build Golden Corpus annotation packet
        id: golden_packet
        continue-on-error: true
        if: steps.canonical.outcome == 'success'
        run: python audit/build_golden_corpus_packet_v4.py --candidates semantic-recovery-v4/canonical --out semantic-recovery-v4/golden --per-family 20
      - name: Record Golden packet
        if: always()
        run: printf '{"stage":"goldenPacket","outcome":"%s"}\n' '${{ steps.golden_packet.outcome }}' > semantic-recovery-v4/status/receipts/golden-packet.json

      - name: Evaluate convergence against verified Golden Corpus
        id: evaluation
        continue-on-error: true
        if: steps.canonical.outcome == 'success'
        run: python audit/evaluate_golden_corpus_v4.py --candidates semantic-recovery-v4/canonical --golden audit/golden-corpus-v4.json --out semantic-recovery-v4/evaluation
      - name: Record evaluation
        if: always()
        run: printf '{"stage":"evaluation","outcome":"%s"}\n' '${{ steps.evaluation.outcome }}' > semantic-recovery-v4/status/receipts/evaluation.json

      - name: Aggregate stage receipts and build baseline lock
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt_dir=Path('semantic-recovery-v4/status/receipts')
          stages={}
          for p in sorted(receipt_dir.glob('*.json')):
              row=json.loads(p.read_text())
              stages[row['stage']]=row['outcome']
          Path('semantic-recovery-v4/status/stage-status.json').write_text(json.dumps({
              'format':'multiversal-semantic-recovery-v4-stage-status',
              'version':'4.3.1',
              'stages':stages,
              'allEngineeringStagesSucceeded':all(v=='success' for v in stages.values())
          },indent=2)+'\n')
          manifest=json.loads(Path('audit/golden-corpus-v4.json').read_text())
          ep=Path('semantic-recovery-v4/evaluation/golden-corpus-evaluation.json')
          evaluation=json.loads(ep.read_text()) if ep.exists() else {'engineeringConvergencePassed':False,'gates':{}}
          locked=bool(evaluation.get('engineeringConvergencePassed')) and manifest.get('ownerCertified') is True
          Path('semantic-recovery-v4/status/baseline-lock-status.json').write_text(json.dumps({
              'format':'multiversal-semantic-baseline-v4-lock-status',
              'version':'4.3.1',
              'engineeringConvergencePassed':bool(evaluation.get('engineeringConvergencePassed')),
              'ownerCertified':manifest.get('ownerCertified') is True,
              'baselineLocked':locked,
              'uiUxConsultancyPhase':'ready-to-start' if locked else 'blocked-by-semantic-baseline',
              'nextRequiredAction':'Begin UXC-001 discovery and workflow inventory.' if locked else 'Complete Golden Corpus annotation, rerun convergence, and owner-certify the verified manifest.',
              'gates':evaluation.get('gates',{}),
              'authorityNote':'Baseline lock requires both measured engineering convergence and explicit owner certification.'
          },indent=2)+'\n')
          PY

      - name: Publish v4 diagnostics before enforcement
        if: always()
        run: |
          mkdir -p v2/audit-data/semantic-recovery-v4
          find semantic-recovery-v4 -type f \( -name '*index.json' -o -name '*evaluation.json' -o -name '*status.json' -o -name '*packet.json' \) -print | while read f; do cp "$f" "v2/audit-data/semantic-recovery-v4/$(basename "$f")"; done

      - name: Upload full v4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-semantic-recovery-v4-${{ github.sha }}
          path: semantic-recovery-v4/
          retention-days: 90

      - name: Commit v4 diagnostics
        if: always()
        run: |
          git config user.name 'multiversal-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/audit-data/semantic-recovery-v4
          if git diff --cached --quiet; then echo 'No v4 diagnostics changed.'; exit 0; fi
          git commit -m 'Publish Semantic Recovery v4 stage and convergence diagnostics [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce engineering pipeline gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('semantic-recovery-v4/status/stage-status.json').read_text())
          required=('preflight','source','hierarchy','reconstruction','assembly','canonical','goldenPacket','evaluation')
          assert all(s['stages'].get(k)=='success' for k in required),s
          PY

      - name: Report baseline lock state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('semantic-recovery-v4/status/baseline-lock-status.json').read_text())
          print(json.dumps(lock,indent=2))
          PY
