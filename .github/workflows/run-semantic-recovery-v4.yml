name: Run Semantic Recovery v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit/build_hierarchical_structure.py'
      - 'audit/reconstruct_tables_and_forms.py'
      - 'audit/build_object_assembly_v4.py'
      - 'audit/build_relationships_and_canonical_v4.py'
      - 'audit/build_golden_corpus_packet_v4.py'
      - 'audit/evaluate_golden_corpus_v4.py'
      - 'audit/golden-corpus-v4.json'
      - 'docs/SEMANTIC-RECOVERY-V4-PROGRAM.md'
      - '.github/workflows/run-semantic-recovery-v4.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: multiversal-semantic-recovery-v4
  cancel-in-progress: true

jobs:
  recovery-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax preflight
        run: |
          python -m py_compile \
            audit/build_hierarchical_structure.py \
            audit/reconstruct_tables_and_forms.py \
            audit/build_object_assembly_v4.py \
            audit/build_relationships_and_canonical_v4.py \
            audit/build_golden_corpus_packet_v4.py \
            audit/evaluate_golden_corpus_v4.py
      - name: Download authoritative forensic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow='Run Forensic Audit' --status=success --limit=1 --json databaseId --jq='.[0].databaseId')
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --dir downloaded
          ARCHIVE=$(find downloaded -name 'multiversal-forensic-audit-output.tar.gz' -print -quit)
          test -n "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          test -f audit-output/findings.jsonl
      - name: Initialize explicit stage status
        run: |
          mkdir -p semantic-recovery-v4/status
          printf '%s\n' '{"format":"multiversal-semantic-recovery-v4-stage-status","version":"4.0.0","stages":{}}' > semantic-recovery-v4/status/stage-status.json
      - name: Build hierarchical evidence
        id: hierarchy
        continue-on-error: true
        run: python audit/build_hierarchical_structure.py --input audit-output --out semantic-recovery-v4/hierarchy
      - name: Record hierarchy status
        if: always()
        run: python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('semantic-recovery-v4/status/stage-status.json');d=json.loads(p.read_text());d['stages']['hierarchy']='${{ steps.hierarchy.outcome }}';p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Reconstruct tables and forms
        id: reconstruction
        continue-on-error: true
        run: python audit/reconstruct_tables_and_forms.py --structure semantic-recovery-v4/hierarchy --out semantic-recovery-v4/reconstruction
      - name: Record reconstruction status
        if: always()
        run: python - <<'PY'
          import json
          from pathlib import Path
          p=Path('semantic-recovery-v4/status/stage-status.json');d=json.loads(p.read_text());d['stages']['reconstruction']='${{ steps.reconstruction.outcome }}';p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Assemble complete objects with document grammars
        id: assembly
        continue-on-error: true
        run: python audit/build_object_assembly_v4.py --structure semantic-recovery-v4/hierarchy --out semantic-recovery-v4/assembly
      - name: Record assembly status
        if: always()
        run: python - <<'PY'
          import json
          from pathlib import Path
          p=Path('semantic-recovery-v4/status/stage-status.json');d=json.loads(p.read_text());d['stages']['assembly']='${{ steps.assembly.outcome }}';p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Build relationships and canonical envelopes
        id: canonical
        continue-on-error: true
        run: python audit/build_relationships_and_canonical_v4.py --assembly semantic-recovery-v4/assembly --out semantic-recovery-v4/canonical
      - name: Record canonical status
        if: always()
        run: python - <<'PY'
          import json
          from pathlib import Path
          p=Path('semantic-recovery-v4/status/stage-status.json');d=json.loads(p.read_text());d['stages']['canonical']='${{ steps.canonical.outcome }}';p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Build Golden Corpus annotation packet
        id: golden_packet
        continue-on-error: true
        run: python audit/build_golden_corpus_packet_v4.py --candidates semantic-recovery-v4/canonical --out semantic-recovery-v4/golden --per-family 20
      - name: Record Golden packet status
        if: always()
        run: python - <<'PY'
          import json
          from pathlib import Path
          p=Path('semantic-recovery-v4/status/stage-status.json');d=json.loads(p.read_text());d['stages']['goldenPacket']='${{ steps.golden_packet.outcome }}';p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Evaluate convergence against verified Golden Corpus
        id: evaluation
        continue-on-error: true
        run: python audit/evaluate_golden_corpus_v4.py --candidates semantic-recovery-v4/canonical --golden audit/golden-corpus-v4.json --out semantic-recovery-v4/evaluation
      - name: Record evaluation status
        if: always()
        run: python - <<'PY'
          import json
          from pathlib import Path
          p=Path('semantic-recovery-v4/status/stage-status.json');d=json.loads(p.read_text());d['stages']['evaluation']='${{ steps.evaluation.outcome }}';p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Build baseline lock and UI consultancy transition status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('audit/golden-corpus-v4.json').read_text())
          ep=Path('semantic-recovery-v4/evaluation/golden-corpus-evaluation.json')
          evaluation=json.loads(ep.read_text()) if ep.exists() else {'engineeringConvergencePassed':False,'gates':{}}
          locked=bool(evaluation.get('engineeringConvergencePassed')) and manifest.get('ownerCertified') is True
          payload={
            'format':'multiversal-semantic-baseline-v4-lock-status',
            'version':'4.0.0',
            'engineeringConvergencePassed':bool(evaluation.get('engineeringConvergencePassed')),
            'ownerCertified':manifest.get('ownerCertified') is True,
            'baselineLocked':locked,
            'uiUxConsultancyPhase': 'ready-to-start' if locked else 'blocked-by-semantic-baseline',
            'nextRequiredAction': 'Begin UXC-001 discovery and workflow inventory.' if locked else 'Complete Golden Corpus annotation, rerun convergence, and owner-certify the verified manifest.',
            'gates':evaluation.get('gates',{}),
            'authorityNote':'Baseline lock requires both measured engineering convergence and explicit owner certification.'
          }
          Path('semantic-recovery-v4/status/baseline-lock-status.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
      - name: Publish v4 diagnostics before enforcement
        if: always()
        run: |
          mkdir -p v2/audit-data/semantic-recovery-v4
          find semantic-recovery-v4 -name '*index.json' -o -name '*evaluation.json' -o -name '*status.json' -o -name '*packet.json' | while read f; do cp "$f" "v2/audit-data/semantic-recovery-v4/$(basename "$f")"; done
      - name: Upload full v4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-semantic-recovery-v4-${{ github.sha }}
          path: semantic-recovery-v4/
          retention-days: 90
      - name: Commit v4 diagnostics
        if: always()
        run: |
          git config user.name 'multiversal-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/audit-data/semantic-recovery-v4
          if git diff --cached --quiet; then echo 'No v4 diagnostics changed.'; exit 0; fi
          git commit -m 'Publish Semantic Recovery v4 convergence diagnostics [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce pipeline and convergence gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('semantic-recovery-v4/status/stage-status.json').read_text())
          assert all(v=='success' for v in s['stages'].values()),s
          lock=json.loads(Path('semantic-recovery-v4/status/baseline-lock-status.json').read_text())
          assert lock['engineeringConvergencePassed'] is True,lock
          assert lock['ownerCertified'] is True,lock
          assert lock['baselineLocked'] is True,lock
          PY
