name: Validate PPIA-11 Completion Contract

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-11_*'
      - 'governance/application-planning/parallel-preimplementation/PPIA_PROGRAM_BACKLOG.json'
      - 'governance/application-planning/parallel-preimplementation/validate_ppia_program.py'
      - 'governance/ai/work-state/PPIA-11-attempt-001.json'
      - 'governance/ai/runtime/CURRENT_WORK_POINTER.json'
      - 'governance/ai/runtime/CURRENT_IMPLEMENTATION_STATUS.json'
      - 'scripts/validate-ppia11-*.py'
      - 'scripts/validate-ppia10-to-ppia11-transition.py'
      - 'tools/continuity_state.py'
      - '.github/workflows/validate-ppia-11-*.yml'
  workflow_dispatch:

jobs:
  validate-ppia11-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA-11 Completion Contract
        run: python scripts/validate-ppia11-completion-contracts.py
      - name: Validate PPIA-11 Encounter Lab Workflow regression
        run: python scripts/validate-ppia11-encounter-lab-workflows.py
      - name: Validate PPIA-11 Inspector Action and Reference regression
        run: python scripts/validate-ppia11-inspector-action-reference.py
      - name: Validate PPIA-11 Methodology and Benchmark regression
        run: python scripts/validate-ppia11-methodology-benchmarks.py
      - name: Validate PPIA-11 Foundation regression
        run: python scripts/validate-ppia11-foundation.py
      - name: Validate PPIA-10 to PPIA-11 Transition regression
        run: python scripts/validate-ppia10-to-ppia11-transition.py
      - name: Validate generalized PPIA continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program.py
      - name: Validate conversation continuity
        run: python tools/continuity_state.py validate
