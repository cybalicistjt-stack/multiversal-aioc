name: Validate PPIA-12 Completion Contract

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-12_*'
      - 'governance/ai/work-state/PPIA-12-attempt-001.json'
      - 'scripts/validate-ppia12-*.py'
      - '.github/workflows/validate-ppia-12-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-completion-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA-12 foundation
        run: python scripts/validate-ppia12-foundation.py
      - name: Validate PPIA-12 Inspector and reference cases
        run: python scripts/validate-ppia12-inspector-reference-cases.py
      - name: Validate PPIA-12 workflow contracts
        run: python scripts/validate-ppia12-workflow-contracts.py
      - name: Validate PPIA-12 completion contract
        run: python scripts/validate-ppia12-completion-contracts.py
      - name: Validate generalized PPIA program continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program.py
      - name: Validate PPIA-05 to PPIA-12 transition regression
        run: python scripts/validate-ppia05-to-ppia12-transition.py
