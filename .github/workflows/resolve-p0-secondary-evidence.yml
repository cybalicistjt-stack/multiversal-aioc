name: Resolve P0 Secondary Evidence

on:
  pull_request:
    paths:
      - 'governance/object-system/csv-intake/P0_SECONDARY_EVIDENCE_RESOLUTION_CONTRACT.json'
      - 'governance/object-system/csv-intake/P0_LOCATOR_DISAMBIGUATION_QUEUE.json'
      - 'scripts/extract-p0-secondary-source-rows.py'
      - 'scripts/resolve-p0-secondary-evidence.py'
      - 'scripts/validate-p0-secondary-evidence-resolution.py'
      - 'Csv.zip'
      - '.github/workflows/resolve-p0-secondary-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-source-rows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract governed unresolved source rows
        run: python scripts/extract-p0-secondary-source-rows.py
      - uses: actions/upload-artifact@v4
        with:
          name: csv-p0-secondary-source-rows-53
          path: build/csv-p0-secondary-evidence-resolution-l40/P0_SECONDARY_SOURCE_ROWS.json
          if-no-files-found: error
