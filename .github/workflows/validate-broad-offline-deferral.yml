name: Validate Broad Offline Deferral

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/IA-D08-004_*'
      - 'governance/application-planning/internal-alpha/validate_broad_offline_deferral.py'
      - '.github/workflows/validate-broad-offline-deferral.yml'

concurrency:
  group: validate-broad-offline-deferral-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python governance/application-planning/internal-alpha/validate_broad_offline_deferral.py
