name: Day Work 05 - Consolidate Unattended Workday

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 2 8 *'

permissions:
  contents: write

jobs:
  consolidate:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 2 8 *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax preflight
        run: python -m py_compile audit/build_unattended_day_summary.py
      - name: Build consolidated readiness report
        run: python audit/build_unattended_day_summary.py
      - name: Upload final workday bundle
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-unattended-workday-summary-${{ github.run_id }}
          path: unattended-day-summary/
          retention-days: 90
      - name: Publish final summary
        run: |
          mkdir -p v2/audit-data/unattended-workday
          cp unattended-day-summary/unattended-workday-summary.json v2/audit-data/unattended-workday/
          cp unattended-day-summary/README.md v2/audit-data/unattended-workday/
          git config user.name 'multiversal-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/audit-data/unattended-workday
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish unattended workday consolidation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
