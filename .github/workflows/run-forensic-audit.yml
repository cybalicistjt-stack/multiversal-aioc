name: Run Forensic Audit

on:
  workflow_dispatch:
    inputs:
      reset:
        description: Rebuild all audit outputs from scratch
        required: false
        default: true
        type: boolean
      batch_size:
        description: Pages per resumable batch
        required: false
        default: '50'
        type: string
  push:
    branches: [main]
    paths:
      - 'Part 1.zip'
      - 'Part 2.zip'
      - 'Part 3.zip'
      - 'Creatures.zip'
      - 'audit/**'
      - '.github/workflows/run-forensic-audit.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install audit dependencies
        run: python -m pip install --upgrade pip pypdf

      - name: Materialize canonical source when needed
        run: |
          if [ ! -f content-source/phase-1-8-canonical-objects.json ] && [ -f scripts/materialize-content-source.mjs ]; then
            node scripts/materialize-content-source.mjs
          fi

      - name: Verify authoritative archives
        run: |
          test -f 'Part 1.zip'
          test -f 'Part 2.zip'
          test -f 'Part 3.zip'
          test -f 'Creatures.zip'

      - name: Run complete forensic audit
        run: |
          RESET=''
          if [ '${{ github.event_name }}' = 'push' ] || [ '${{ inputs.reset }}' = 'true' ]; then RESET='--reset'; fi
          python audit/run_archive_audit.py \
            --repo-root . \
            --batch-size '${{ inputs.batch_size || '50' }}' \
            $RESET

      - name: Validate corpus status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('audit-output/corpus-status.json')
          if not p.exists():
              raise SystemExit('corpus-status.json was not produced')
          s = json.loads(p.read_text())
          assert s['archiveCount'] == 4, s
          assert s['corpusComplete'] is True, s
          assert s['completedPages'] == s['totalPages'], s
          print(json.dumps(s, indent=2))
          PY

      - name: Package full audit outputs
        run: |
          tar -czf multiversal-forensic-audit-output.tar.gz audit-output audit-work/documents || true

      - name: Upload full audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-forensic-audit-${{ github.sha }}
          path: |
            audit-output/
            multiversal-forensic-audit-output.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Upload compact status artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-audit-status-${{ github.sha }}
          path: |
            audit-output/corpus-status.json
            audit-output/archive-inventory.json
            audit-output/document-batch-schedule.json
            audit-output/reconciliation-report.json
            audit-output/csv-schema-registry.json
          if-no-files-found: warn
          retention-days: 90
