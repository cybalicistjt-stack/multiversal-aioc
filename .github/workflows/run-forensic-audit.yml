name: Run Forensic Audit

on:
  workflow_dispatch:
    inputs:
      reset:
        description: Rebuild all audit outputs from scratch
        required: false
        default: true
        type: boolean
      batch_size:
        description: Pages per resumable batch
        required: false
        default: '50'
        type: string
  push:
    branches: [main]
    paths:
      - 'Part 1.zip'
      - 'Part 2.zip'
      - 'Part 3.zip'
      - 'Creatures.zip'
      - 'audit/**'
      - '.github/workflows/run-forensic-audit.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: multiversal-forensic-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: audit/requirements.txt

      - name: Install audit dependencies
        run: python -m pip install --upgrade pip -r audit/requirements.txt

      - name: Materialize canonical source when needed
        run: |
          if [ ! -f content-source/phase-1-8-canonical-objects.json ] && [ -f scripts/materialize-content-source.mjs ]; then
            node scripts/materialize-content-source.mjs
          fi

      - name: Verify authoritative archives
        run: |
          test -f 'Part 1.zip'
          test -f 'Part 2.zip'
          test -f 'Part 3.zip'
          test -f 'Creatures.zip'

      - name: Run complete forensic audit
        run: |
          RESET=''
          BATCH_SIZE='50'
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            BATCH_SIZE='${{ inputs.batch_size }}'
            if [ '${{ inputs.reset }}' = 'true' ]; then RESET='--reset'; fi
          else
            RESET='--reset'
          fi
          python audit/run_archive_audit.py \
            --repo-root . \
            --batch-size "$BATCH_SIZE" \
            $RESET

      - name: Validate corpus status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('audit-output/corpus-status.json')
          if not p.exists():
              raise SystemExit('corpus-status.json was not produced')
          s = json.loads(p.read_text())
          assert s['archiveCount'] == 4, s
          assert s['corpusComplete'] is True, s
          assert s['completedPages'] == s['totalPages'], s
          print(json.dumps(s, indent=2))
          PY

      - name: Refine findings and canonical matches
        run: |
          CANONICAL=''
          if [ -f content-source/phase-1-8-canonical-objects.json ]; then
            CANONICAL='--canonical content-source/phase-1-8-canonical-objects.json'
          fi
          python audit/refine_findings.py \
            --input audit-output \
            --out audit-output/refined \
            $CANONICAL

      - name: Validate refined reconciliation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('audit-output/refined/refinement-summary.json')
          if not p.exists():
              raise SystemExit('refinement-summary.json was not produced')
          s = json.loads(p.read_text())
          assert s['rawFindingCount'] > 0, s
          assert s['reviewCandidateCount'] > 0, s
          assert s['reviewCandidateCount'] <= s['rawFindingCount'], s
          print(json.dumps(s, indent=2))
          PY

      - name: Publish compact dashboard data
        run: |
          python audit/publish_compact_audit.py \
            --source audit-output \
            --destination v2/audit-data \
            --source-sha '${{ github.sha }}'

      - name: Package full audit outputs
        run: |
          tar -czf multiversal-forensic-audit-output.tar.gz audit-output audit-work/documents

      - name: Upload full audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-forensic-audit-${{ github.sha }}
          path: |
            audit-output/
            multiversal-forensic-audit-output.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Upload compact status artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-audit-status-${{ github.sha }}
          path: |
            v2/audit-data/
          if-no-files-found: error
          retention-days: 90

      - name: Commit compact audit results
        run: |
          git config user.name 'multiversal-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A v2/audit-data
          if git diff --cached --quiet; then
            echo 'No compact audit changes to publish.'
            exit 0
          fi
          git commit -m 'Publish refined forensic audit status [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
