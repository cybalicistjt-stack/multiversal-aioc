name: Run Forensic Audit

on:
  workflow_dispatch:
    inputs:
      reset:
        description: Rebuild all audit outputs from scratch
        required: false
        default: true
        type: boolean
      batch_size:
        description: Pages per resumable batch
        required: false
        default: '50'
        type: string
  push:
    branches: [main]
    paths:
      - 'Part 1.zip'
      - 'Part 2.zip'
      - 'Part 3.zip'
      - 'Creatures.zip'
      - 'audit/run_archive_audit.py'
      - 'audit/forensic_audit.py'
      - 'audit/requirements.txt'
      - 'content-source/phase-1-8-canonical-objects.json'
      - 'scripts/materialize-content-source.mjs'
      - '.github/workflows/run-forensic-audit.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: multiversal-forensic-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: audit/requirements.txt
      - name: Install audit dependencies
        run: python -m pip install --upgrade pip -r audit/requirements.txt
      - name: Materialize canonical source when needed
        run: |
          if [ ! -f content-source/phase-1-8-canonical-objects.json ] && [ -f scripts/materialize-content-source.mjs ]; then node scripts/materialize-content-source.mjs; fi
      - name: Verify authoritative archives
        run: |
          test -f 'Part 1.zip'; test -f 'Part 2.zip'; test -f 'Part 3.zip'; test -f 'Creatures.zip'
      - name: Run complete forensic audit
        run: |
          RESET=''; BATCH_SIZE='50'
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then BATCH_SIZE='${{ inputs.batch_size }}'; if [ '${{ inputs.reset }}' = 'true' ]; then RESET='--reset'; fi; else RESET='--reset'; fi
          python audit/run_archive_audit.py --repo-root . --batch-size "$BATCH_SIZE" $RESET
      - name: Validate corpus status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('audit-output/corpus-status.json').read_text())
          assert s['archiveCount']==4 and s['corpusComplete'] is True and s['completedPages']==s['totalPages'],s
          print(json.dumps(s,indent=2))
          PY
      - name: Build document structure engine
        run: python audit/build_document_structure.py --input audit-output --out audit-output/document-structure
      - name: Run family-specific parsers
        run: python audit/build_family_parsers.py --structure audit-output/document-structure --out audit-output/family-parsers
      - name: Build canonical knowledge graph
        run: |
          CANONICAL=''; if [ -f content-source/phase-1-8-canonical-objects.json ]; then CANONICAL='--canonical content-source/phase-1-8-canonical-objects.json'; fi
          python audit/build_canonical_knowledge_graph.py --parsed audit-output/family-parsers --out audit-output/knowledge-graph $CANONICAL
      - name: Validate semantic recovery outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('audit-output/document-structure/document-structure-index.json').read_text())
          f=json.loads(Path('audit-output/family-parsers/family-parser-index.json').read_text())
          g=json.loads(Path('audit-output/knowledge-graph/knowledge-graph-index.json').read_text())
          assert d['blockCount']>0 and d['provenanceCompleteCount']>0,d
          assert f['candidateCount']>0 and len(f['familyCounts'])>=3,f
          assert g['nodeCount']>=f['candidateCount'] and g['evidenceEdgeCount']>0,g
          print(json.dumps({'structureBlocks':d['blockCount'],'parsedCandidates':f['candidateCount'],'families':f['familyCounts'],'graphNodes':g['nodeCount'],'graphEdges':g['edgeCount'],'unresolvedEdges':g['unresolvedRelationshipCount']},indent=2))
          PY
      - name: Refine findings and canonical matches
        run: |
          CANONICAL=''; if [ -f content-source/phase-1-8-canonical-objects.json ]; then CANONICAL='--canonical content-source/phase-1-8-canonical-objects.json'; fi
          python audit/refine_findings.py --input audit-output --out audit-output/refined $CANONICAL
      - name: Build governed promotion batches
        run: python audit/build_promotion_batches.py --source audit-output/refined --out audit-output/promotion --batch-size 100 --publish-limit 500
      - name: Build canonical object factory candidates
        run: python audit/build_object_factory.py --promotion audit-output/promotion --out audit-output/object-factory --batch-size 50
      - name: Build specialized recovery and coverage maps
        run: python audit/build_recovery_engine.py --factory audit-output/object-factory --out audit-output/recovery --batch-size 50
      - name: Build recovery handoffs and relationship queues
        run: python audit/build_recovery_handoffs.py --recovery audit-output/recovery --out audit-output/handoffs --batch-size 50
      - name: Compile production staging packets
        run: python audit/build_production_staging.py --handoffs audit-output/handoffs --out audit-output/production-staging --batch-size 50
      - name: Compile canonical acceptance manifests
        run: python audit/build_canonical_acceptance.py --staging audit-output/production-staging --out audit-output/canonical-acceptance --batch-size 50
      - name: Compile branch import and merge readiness
        run: python audit/build_merge_readiness.py --acceptance audit-output/canonical-acceptance --out audit-output/merge-readiness --batch-size 50
      - name: Compile owner review and source closure packets
        run: python audit/build_owner_review.py --merge-readiness audit-output/merge-readiness --out audit-output/owner-review --batch-size 50
      - name: Validate owner review outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('audit-output/owner-review/owner-review-index.json').read_text())
          assert s['releaseGate']['automaticMainCanonMerge'] is False,s
          assert s['reviewPacketCount'] >= 0 and s['reviewBatchCount'] >= 0,s
          print(json.dumps({k:s[k] for k in ('reviewPacketCount','reviewBatchCount','sourceClosureCertificateCount','openBlockerCount')},indent=2))
          PY
      - name: Publish compact dashboard data
        run: python audit/publish_compact_audit.py --source audit-output --destination v2/audit-data --source-sha '${{ github.sha }}'
      - name: Package full audit outputs
        run: tar -czf multiversal-forensic-audit-output.tar.gz audit-output audit-work/documents
      - name: Upload full audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-forensic-audit-${{ github.sha }}
          path: |
            audit-output/
            multiversal-forensic-audit-output.tar.gz
          if-no-files-found: error
          retention-days: 90
      - name: Upload compact status artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-audit-status-${{ github.sha }}
          path: v2/audit-data/
          if-no-files-found: error
          retention-days: 90
      - name: Commit compact audit results
        run: |
          git config user.name 'multiversal-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A v2/audit-data
          if git diff --cached --quiet; then echo 'No compact audit changes to publish.'; exit 0; fi
          git commit -m 'Publish document structure parsers and knowledge graph [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
