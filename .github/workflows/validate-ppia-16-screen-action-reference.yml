name: Validate PPIA-16 Screen Action Reference Contracts

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-16_SCREEN_*'
      - 'governance/application-planning/parallel-preimplementation/PPIA-16_ACTION_CONTRACTS_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-16_COMPONENT_INTERACTION_CONTRACTS_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-16_FOUNDATION_*'
      - 'governance/application-planning/parallel-preimplementation/PPIA_PROGRAM_BACKLOG.json'
      - 'governance/ai/work-state/PPIA-16-attempt-001.json'
      - 'scripts/validate-ppia16-screen-action-reference.py'
      - 'scripts/validate-ppia16-historical-predecessor.py'
      - 'governance/application-planning/parallel-preimplementation/validate_ppia_program_state.py'
      - '.github/workflows/validate-ppia-16-screen-action-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ppia16-screen-action-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA-16 Screen States / Action Contracts / Reference Cases current or historical evidence
        run: python scripts/validate-ppia16-historical-predecessor.py screen
      - name: Validate PPIA-15 completion regression
        run: python scripts/validate-ppia15-completion-contracts.py
      - name: Validate generalized PPIA continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program_state.py
      - name: Validate conversation continuity
        run: python tools/continuity_state.py validate
      - name: Run conversation continuity regression tests
        run: python -m unittest discover -s tests/continuity -v
