name: VTI-10 RED Unlock Projection
on:
  push:
    branches:
      - governance/vti-10-seal-red-unlock-production
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/vti-10-seal-red-unlock-production
          fetch-depth: 0
      - name: Project matching RED and bounded production authority
        run: python3 governance/ai/interaction-system/live/project_vti10_red_unlock.py
      - name: Remove temporary helpers
        run: |
          rm governance/ai/interaction-system/live/project_vti10_red_unlock.py
          rm .github/workflows/vti10-red-unlock-projection.yml
      - name: Run VTI-10 lifecycle regressions
        run: python3 -m unittest tests.control_plane.test_vti10_red_unlock tests.control_plane.test_vti10_additional_adapters_compatibility_registration
      - name: Run full control plane
        run: python3 -m unittest discover -s tests/control_plane -p 'test_*.py'
      - name: Run repository health
        run: python3 scripts/validate_repository_health.py --root . --expected-head "$(git rev-parse HEAD)" --output /tmp/vti10-red-unlock-health.json
      - name: Commit validated RED unlock
        run: |
          git config user.name "cybalicistjt-stack"
          git config user.email "cybalicist.jt@gmail.com"
          git add -A
          git commit -m "VTI-10: seal matching RED and unlock bounded production"
          git push origin HEAD:governance/vti-10-seal-red-unlock-production
