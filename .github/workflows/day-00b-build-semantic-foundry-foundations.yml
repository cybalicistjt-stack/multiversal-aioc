name: Day Work 00B - Build Semantic Foundry Foundations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit/build_semantic_foundry_foundations.py'
      - '.github/workflows/day-00b-build-semantic-foundry-foundations.yml'
  schedule:
    - cron: '20 11 2 8 *'

permissions:
  actions: read
  contents: write

concurrency:
  group: multiversal-semantic-foundry-foundations
  cancel-in-progress: false

jobs:
  foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Initialize receipts
        run: mkdir -p foundry-foundations/status foundry-foundations/output
      - name: Syntax preflight
        id: syntax
        continue-on-error: true
        run: python -m py_compile audit/build_semantic_foundry_foundations.py
      - name: Acquire latest usable v4 candidates
        id: source
        continue-on-error: true
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          RUN_ID=$(gh run list --workflow='Run Semantic Recovery v4' --status=success --limit=1 --json databaseId --jq='.[0].databaseId')
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --dir downloaded
          CANDIDATES=$(find downloaded -name canonical-candidates-v4.jsonl -print -quit)
          test -n "$CANDIDATES"
          mkdir -p foundry-foundations/input
          cp "$CANDIDATES" foundry-foundations/input/canonical-candidates-v4.jsonl
      - name: Fallback to repository-published candidate sample
        if: steps.source.outcome != 'success'
        continue-on-error: true
        run: |
          mkdir -p foundry-foundations/input
          find v2/audit-data -name 'canonical-candidates-v4.jsonl' -exec cp {} foundry-foundations/input/canonical-candidates-v4.jsonl \; -quit
      - name: Build foundation artifacts
        id: build
        continue-on-error: true
        if: steps.syntax.outcome == 'success'
        run: |
          test -f foundry-foundations/input/canonical-candidates-v4.jsonl
          python audit/build_semantic_foundry_foundations.py --candidates foundry-foundations/input --out foundry-foundations/output
      - name: Always create status report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('foundry-foundations/output/semantic-foundry-foundation-index.json')
          status={'format':'semantic-foundry-foundation-stage-status','syntax':'${{ steps.syntax.outcome }}','source':'${{ steps.source.outcome }}','build':'${{ steps.build.outcome }}','usableOutput':p.exists()}
          Path('foundry-foundations/status/stage-status.json').write_text(json.dumps(status,indent=2)+'\n')
          PY
      - name: Upload artifact before validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-semantic-foundry-foundations-${{ github.run_id }}
          path: foundry-foundations/
          retention-days: 90
      - name: Publish available diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p v2/audit-data/semantic-foundry-foundations
          cp -f foundry-foundations/output/*.json v2/audit-data/semantic-foundry-foundations/ 2>/dev/null || true
          cp foundry-foundations/status/stage-status.json v2/audit-data/semantic-foundry-foundations/
          git config user.name multiversal-audit-bot
          git config user.email actions@users.noreply.github.com
          git add v2/audit-data/semantic-foundry-foundations
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Semantic Foundry foundation diagnostics [skip ci]'
          git pull --rebase origin main || true
          git push origin HEAD:main || true
      - name: Report, never block workday
        if: always()
        run: cat foundry-foundations/status/stage-status.json
