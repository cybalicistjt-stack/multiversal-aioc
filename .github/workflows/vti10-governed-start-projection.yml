name: VTI-10 Governed Start Projection
on:
  push:
    branches:
      - governance/vti-10-governed-start
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/vti-10-governed-start
          fetch-depth: 0
      - name: Project governed start
        run: python3 governance/ai/interaction-system/live/project_vti10_governed_start.py
      - name: Remove temporary helpers
        run: |
          rm governance/ai/interaction-system/live/project_vti10_governed_start.py
          rm .github/workflows/vti10-governed-start-projection.yml
      - name: Run VTI-10 lifecycle regression
        run: python3 -m unittest tests.control_plane.test_vti10_additional_adapters_compatibility_registration
      - name: Run repository health
        run: python3 scripts/validate_repository_health.py --root . --expected-head "$(git rev-parse HEAD)" --output /tmp/vti10-governed-start-health.json
      - name: Commit governed start
        run: |
          git config user.name "cybalicistjt-stack"
          git config user.email "cybalicist.jt@gmail.com"
          git add -A
          git commit -m "VTI-10: project governed-start acceptance authority"
          git push origin HEAD:governance/vti-10-governed-start
