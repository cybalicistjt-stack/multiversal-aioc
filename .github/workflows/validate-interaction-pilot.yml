name: Validate Interaction Operational Pilot

on:
  pull_request:
    paths:
      - 'governance/ai/interaction-system/pilot/**'
      - 'governance/ai/runtime/INTERACTION_OPERATIONAL_SCORECARD.json'
      - 'governance/ai/MULTIVERSAL_NEW_CONVERSATION_BOOTSTRAP.md'
      - 'governance/ai/MULTIVERSAL_CHECKPOINT_AND_VALIDATION_EFFICIENCY_POLICY.md'
      - 'governance/development-bible/amendments/MV-CONT-005_OWNER_AI_INTERACTION_OPERATING_AMENDMENT.md'
      - 'governance/ai/interaction-system/README.md'
      - 'tools/interaction_pilot.py'
      - 'tests/interaction_pilot/**'
      - '.github/workflows/validate-interaction-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run current deterministic pilot without requiring a committed live mirror
        run: |
          python tools/interaction_pilot.py run --generated-at 2026-08-06T08:40:00Z
          python tools/interaction_pilot.py validate
      - name: Run interaction pilot regression tests
        run: python -m unittest discover -s tests/interaction_pilot -v
      - name: Verify repeat execution is deterministic
        run: |
          cp governance/ai/interaction-system/pilot/OPERATIONAL_PILOT_SCORECARD.json "$RUNNER_TEMP/scorecard.json"
          cp governance/ai/runtime/INTERACTION_OPERATIONAL_SCORECARD.json "$RUNNER_TEMP/runtime-scorecard.json"
          python tools/interaction_pilot.py run --generated-at 2026-08-06T08:40:00Z
          python - "$RUNNER_TEMP/scorecard.json" governance/ai/interaction-system/pilot/OPERATIONAL_PILOT_SCORECARD.json "$RUNNER_TEMP/runtime-scorecard.json" governance/ai/runtime/INTERACTION_OPERATIONAL_SCORECARD.json <<'PY'
          import json
          import sys

          for before_path, after_path in ((sys.argv[1], sys.argv[2]), (sys.argv[3], sys.argv[4])):
              with open(before_path, encoding='utf-8') as before, open(after_path, encoding='utf-8') as after:
                  if json.load(before) != json.load(after):
                      raise SystemExit(f'semantic JSON mismatch: {before_path} != {after_path}')
          PY
