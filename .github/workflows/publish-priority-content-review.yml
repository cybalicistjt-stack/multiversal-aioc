name: Publish Priority Content Review

on:
  workflow_run:
    workflows: ["Run Forensic Audit"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: multiversal-priority-content-review
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download full forensic artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            RUN_ID=$(gh run list --workflow='Run Forensic Audit' --status=success --limit=1 --json databaseId --jq='.[0].databaseId')
          fi
          gh run download "$RUN_ID" --name "multiversal-forensic-audit-*" --dir downloaded || gh run download "$RUN_ID" --dir downloaded
          find downloaded -name 'multiversal-forensic-audit-output.tar.gz' -print -quit | xargs -r tar -xzf
          test -f audit-output/recovery/recovery-index.json
      - name: Build first substantive review queue
        run: python audit/build_priority_content_review.py --recovery audit-output/recovery --out audit-output/priority-content --limit 200 --batch-size 50
      - name: Validate substantive review queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('audit-output/priority-content/priority-content-review-index.json')
          s=json.loads(p.read_text())
          rows=s.get('publishedSample') or []
          assert s['candidateCount'] > 0, s
          assert s['batchCount'] > 0, s
          assert sum(s['objectTypeCounts'].values()) == s['candidateCount'], s
          assert s.get('selectionPolicy',{}).get('usableProvenanceRequired') is True, s
          assert len(s['objectTypeCounts']) >= 3, s
          assert all(any((x.get('sourcePath') or x.get('findingId') or x.get('locator')) for x in r.get('provenance',[])) for r in rows), 'published sample contains unusable provenance'
          print(json.dumps({k:s[k] for k in ('candidateCount','batchCount','objectTypeCounts','rejectedCounts')},indent=2))
          PY
      - name: Publish compact review data
        run: |
          mkdir -p v2/audit-data/priority-content
          cp audit-output/priority-content/priority-content-review-index.json v2/audit-data/priority-content/
      - name: Upload full priority review batches
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-priority-content-review-${{ github.sha }}
          path: audit-output/priority-content/
          retention-days: 90
      - name: Commit priority review index
        run: |
          git config user.name 'multiversal-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/audit-data/priority-content
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish balanced substantive content review queue [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
