name: Validate P0 Mecha Recommendation Adoption

on:
  pull_request:
    paths:
      - "governance/object-system/csv-intake/P0_MECHA_RECOMMENDATION_ADOPTION_CONTRACT.json"
      - "governance/object-system/csv-intake/OWNER_RECOMMENDATION_DELEGATION.json"
      - "governance/object-system/csv-intake/P0_MECHA_VERIFICATION_CONSOLIDATION.json"
      - "scripts/adopt-p0-mecha-recommendations.py"
      - "scripts/validate-p0-mecha-recommendation-adoption.py"
      - ".github/workflows/validate-p0-mecha-recommendation-adoption.yml"
      - "Csv.zip"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate owner-delegated recommendations
        run: python scripts/adopt-p0-mecha-recommendations.py
      - name: Validate recommendation adoption evidence
        run: python scripts/validate-p0-mecha-recommendation-adoption.py
      - uses: actions/upload-artifact@v4
        with:
          name: csv-p0-mecha-recommendation-adoption-6542
          path: build/csv-p0-mecha-recommendation-adoption-l45/P0_MECHA_RECOMMENDATION_ADOPTION.json
