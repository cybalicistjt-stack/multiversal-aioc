name: developer-workbench

on:
  push:
    branches:
      - governance/session-bootstrap-v1
    paths:
      - 'implementation/developer-workbench/**'
      - '.github/workflows/developer-workbench.yml'
  pull_request:
    paths:
      - 'implementation/developer-workbench/**'
      - '.github/workflows/developer-workbench.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check module syntax
        run: node --check implementation/developer-workbench/developer-workbench.mjs
      - name: Run developer workbench acceptance tests
        run: node implementation/developer-workbench/developer-workbench.test.mjs
