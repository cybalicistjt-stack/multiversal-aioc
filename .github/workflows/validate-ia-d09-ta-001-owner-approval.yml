name: Validate IA-D09-TA-001 Owner Approval

on:
  pull_request:
    branches: [main]
    paths:
      - 'governance/application-planning/internal-alpha/tester-access/**'
      - 'governance/ai/work-state/IA-D09-TA-001-attempt-001.json'
      - 'governance/ai/runtime/CURRENT_WORK_POINTER.json'
      - 'governance/ai/runtime/CURRENT_IMPLEMENTATION_STATUS.json'
      - 'governance/ai/runtime/ROADMAP_INDEX_STAGE_A_A12_SUPPLEMENT.json'
      - 'governance/ai/runtime/BOOTSTRAP_CURRENT_STATE_AMENDMENT_IA_D09_TA_001_OWNER_APPROVED.md'
      - 'tools/validate_ia_d09_ta_001_owner_approval.py'
      - 'tools/validate_ia_d09_ta_001_successor_packet.py'
      - '.github/workflows/validate-ia-d09-ta-001-owner-approval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_ia_d09_ta_001_successor_packet.py
      - run: python tools/validate_ia_d09_ta_001_owner_approval.py
      - run: python tools/continuity_state.py validate
