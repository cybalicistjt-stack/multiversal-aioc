name: Deploy Unified AIOC Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'operational/**'
      - 'content-db/**'
      - 'governance/current-state/**'
      - 'governance/dispatches/**'
      - 'governance/legacy/**'
      - 'aioc-core.html'
      - 'content-library.html'
      - 'content-library.js'
      - 'content-library.css'
      - 'content-database.js'
      - 'studio.html'
      - 'balance.html'
      - 'testing-suite.html'
      - 'feature-modules.html'
      - 'development-os.html'
      - 'diagnostics.html'
      - 'refresh.html'
      - '*.js'
      - '*.css'
      - '*.webmanifest'
      - '*.svg'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.webp'
      - '*.ico'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/record-pages-result.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: unified-aioc-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build public artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/operational _site/governance/current-state _site/governance/dispatches _site/governance/legacy

          cp index.html _site/index.html
          cp operational/index.html operational/operational.css operational/operational.js _site/operational/
          cp -R content-db _site/content-db
          cp governance/current-state/AIOC_CURRENT_STATE.md _site/governance/current-state/
          cp governance/current-state/AIOC_OPERATIONAL_HANDOFF.md _site/governance/current-state/
          cp governance/legacy/LEGACY_COS_QUARANTINE.md _site/governance/legacy/

          if [ -d implementation ]; then
            cp -R implementation _site/implementation
          fi
          if [ -f governance/dispatches/AIOC-DISPATCH-MS02-WP011.md ]; then
            cp governance/dispatches/AIOC-DISPATCH-MS02-WP011.md _site/governance/dispatches/
          fi

          for page in aioc-core.html content-library.html studio.html balance.html testing-suite.html feature-modules.html development-os.html diagnostics.html refresh.html; do
            cp "$page" _site/
          done

          find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' -o -name '*.webmanifest' -o -name '*.svg' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.ico' \) -exec cp {} _site/ \;

          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > _site/deployment-manifest.json <<EOF
          {"format":"multiversal-aioc-pages-deployment","version":"1.3.0","build":"operational-aioc-1.7","commit":"${GITHUB_SHA}","generatedAt":"${generated_at}","defaultSurface":"operational","contentRecords":487,"recentCosWork":"preserved-and-exposed","capabilityCount":9,"contentLibrary":"integrated"}
          EOF
          cp _site/deployment-manifest.json _site/deployed-build.json
          cat > _site/operational/health.json <<EOF
          {"status":"operational","application":"Multiversal AIOC","build":"operational-aioc-1.7","commit":"${GITHUB_SHA}","generatedAt":"${generated_at}","contentRecords":487,"recentCosWork":"preserved-and-exposed","capabilityCount":9,"contentLibrary":"integrated"}
          EOF
          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/operational/index.html
          test -s _site/content-library.html
          test -s _site/operational/health.json
          test -s _site/deployment-manifest.json
          test -s _site/content-db/index.json
          grep -q 'Capability Workbench' _site/operational/index.html
          grep -q 'Operational AIOC' _site/content-library.html
          node --check _site/operational/operational.js
          node --check _site/content-library.js
          node --check _site/content-database.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
