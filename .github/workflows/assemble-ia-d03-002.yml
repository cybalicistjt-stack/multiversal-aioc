name: Assemble IA-D03-002 Campaign Scene Session Design

on:
  pull_request:
    branches:
      - main
    paths:
      - "governance/application-planning/internal-alpha/**"
      - ".github/workflows/assemble-ia-d03-002.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble IA-D03-002 indexes
        run: python governance/application-planning/internal-alpha/assemble_ia_d03_002.py

      - name: Validate MV-IA-001
        run: python governance/application-planning/internal-alpha/validate_internal_alpha_design.py

      - name: Validate implementation-ready feature packets
        run: python governance/application-planning/internal-alpha/validate_feature_packets.py

      - name: Validate shared-foundations integration
        run: python governance/application-planning/internal-alpha/validate_shared_foundations_integration.py

      - name: Validate Character creation and advancement
        run: python governance/application-planning/internal-alpha/validate_character_creation_design.py

      - name: Validate Campaign Scene Session design
        run: python governance/application-planning/internal-alpha/validate_campaign_scene_session_design.py

      - name: Verify JSON artifacts
        run: |
          python -m json.tool governance/application-planning/internal-alpha/INTERNAL_ALPHA_FEATURE_REGISTRY.json > /dev/null
          python -m json.tool governance/application-planning/internal-alpha/feature-packets/MV-IA-F005_CAMPAIGN_SCENE_SESSION_MATRIX.json > /dev/null
          python -m json.tool governance/application-planning/internal-alpha/feature-packets/MV-IA-F005_IMPLEMENTATION_TRACEABILITY.json > /dev/null
          python -m json.tool governance/application-planning/internal-alpha/feature-packets/MV-IA-F005_COMPLETION_RECORD.json > /dev/null

      - name: Commit assembled design package
        shell: bash
        run: |
          git config user.name "multiversal-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add governance/application-planning/internal-alpha
          if git diff --cached --quiet; then
            echo "No assembly changes to commit."
          else
            git commit -m "Finalize IA-D03-002 Campaign Scene Session design package"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
