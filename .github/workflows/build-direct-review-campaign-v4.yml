name: Build Direct Review Campaign v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit/build_direct_review_campaign_v4.py'
      - '.github/workflows/build-direct-review-campaign-v4.yml'

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Syntax preflight
        run: python -m py_compile audit/build_direct_review_campaign_v4.py
      - name: Download latest successful v4 candidates
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          RUN_ID=$(gh run list --workflow='Run Semantic Recovery v4' --status=success --limit=1 --json databaseId --jq='.[0].databaseId')
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --dir downloaded
          C=$(find downloaded -path '*/canonical/canonical-candidates-v4.jsonl' -print -quit)
          test -n "$C"
          mkdir -p input
          cp "$C" input/canonical-candidates-v4.jsonl
      - name: Build direct review campaign
        run: python audit/build_direct_review_campaign_v4.py --candidates input --out direct-review-v4 --batch-size 30
      - name: Upload complete campaign
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-direct-review-campaign-v4-${{ github.run_id }}
          path: direct-review-v4/
          retention-days: 90
      - name: Publish compact index and priority review tranche
        run: |
          DEST=v2/audit-data/semantic-recovery-v4/direct-review-priority
          mkdir -p "$DEST"
          cp direct-review-v4/direct-review-campaign-index.json v2/audit-data/semantic-recovery-v4/
          for f in \
            creature-batch-01.json \
            npc-batch-01.json \
            adventure-batch-01.json \
            faction-batch-01.json \
            vehicle-batch-01.json; do
            test -f "direct-review-v4/$f" && cp "direct-review-v4/$f" "$DEST/$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('v2/audit-data/semantic-recovery-v4/direct-review-priority')
          files=[]
          total=0
          for p in sorted(d.glob('*.json')):
              data=json.loads(p.read_text())
              count=len(data.get('records', data.get('candidates', [])))
              files.append({'file':p.name,'count':count})
              total+=count
          (d/'priority-review-index.json').write_text(json.dumps({'format':'multiversal-direct-review-priority-index','version':'1.0.0','files':files,'recordCount':total,'authority':'Review evidence only; no decision changes canon.'},indent=2)+'\n')
          PY
          git config user.name 'multiversal-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/audit-data/semantic-recovery-v4/direct-review-campaign-index.json "$DEST"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish direct semantic review priority tranche [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
