name: Validate Relationship Tracker Design

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F009_*'
      - 'governance/application-planning/internal-alpha/validate_relationship_tracker.py'
      - 'governance/application-planning/internal-alpha/INTERNAL_ALPHA_DESIGN_BACKLOG.md'
      - 'governance/application-planning/internal-alpha/README.md'
      - 'governance/application-planning/internal-alpha/feature-packets/README.md'
      - '.github/workflows/relationship-tracker-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python governance/application-planning/internal-alpha/validate_relationship_tracker.py
