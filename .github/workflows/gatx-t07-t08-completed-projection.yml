name: Promote GATX T07/T08 Completed State

on:
  push:
    branches:
      - governance/gatx-t07-t08-live-completion

permissions:
  contents: write

jobs:
  promote-completed-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/gatx-t07-t08-live-completion
          fetch-depth: 0
      - name: Promote verified live work to completed state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          NOW = "2026-08-17T11:15:00Z"
          PRE_CONTINUITY = 32023786174
          APP_VALIDATED_HEAD = "b204fb91797e226d297c75884056bde085e17c0e"
          APP_RUNTIME_MERGE = "d41a245d72f10d6027c4606cd429abba7028bfab"
          APP_EVIDENCE_MERGE = "bff19db1d24205c0886df48f04f2febe09e05b65"
          LIVE_DEPLOY_ID = "dep-da1eepu417fc73ac4fpg"
          LIVE_PUBLIC_RUN = 32023337155
          EVIDENCE_PATH = "artifacts/gatx-t08/GATX_T07_T08_LIVE_CROSS_LOCATION_EVIDENCE_20260817.json"
          FINAL_NEXT = "GATX-T07-REMOTE and GATX-T08 are completed_verified. Stop this GATX operation and recover the canonical roadmap before any later work; do not automatically start another tranche."

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, value):
              Path(path).write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")

          def mark_required_pass(cp, continuity_command="governance continuity validation"):
              required = set(cp["completion_gate"]["required_validation_commands"])
              found = set()
              for item in cp["validation"]:
                  if item["command"] in required:
                      item["status"] = "passed"
                      if item["command"] == continuity_command:
                          item["evidence"] = f"ready-state continuity run {PRE_CONTINUITY} PASS all continuity checks"
                      found.add(item["command"])
              missing = required - found
              if missing:
                  raise SystemExit(f"missing validation records for {cp['work_item_id']}: {sorted(missing)}")

          def add_scoped_evidence(cp, kind, value):
              if not any(x.get("kind") == kind and x.get("value") == value for x in cp["evidence"]):
                  cp["evidence"].append({"kind": kind, "value": value})

          p07 = "governance/ai/work-state/GATX-T07-REMOTE-attempt-001.json"
          t07 = load(p07)
          t07["revision"] = int(t07["revision"]) + 1
          t07["status"] = "completed_verified"
          t07["updated_at"] = NOW
          t07["completed_at"] = NOW
          t07["active_substep"] = None
          t07["next_action"] = FINAL_NEXT
          t07["last_verified_action"] = f"Ready-state governance continuity run {PRE_CONTINUITY} passed after verified live Render deployment, repaired-head CI, live public probe {LIVE_PUBLIC_RUN}, and owner cross-location evidence. GATX-T07-REMOTE completion gate is satisfied."
          t07["unresolved_failures"] = []
          t07["owner_decision_required"] = False
          t07["roadmap_projection_pending"] = False
          mark_required_pass(t07)
          for kind, value in [
              ("commit", f"GATX-T07-REMOTE repaired validated candidate {APP_VALIDATED_HEAD}"),
              ("pull_request", "GATX-T07-REMOTE live repair/evidence PRs #182 and #183"),
              ("ci_run", f"GATX-T07-REMOTE ready-state continuity run {PRE_CONTINUITY} PASS"),
              ("artifact", f"GATX-T07-REMOTE live Render deployment {LIVE_DEPLOY_ID} and evidence {EVIDENCE_PATH}"),
              ("merge", f"GATX-T07-REMOTE canonical application evidence merge {APP_EVIDENCE_MERGE}"),
          ]:
              add_scoped_evidence(t07, kind, value)
          save(p07, t07)

          p08 = "governance/ai/work-state/GATX-T08-attempt-001.json"
          t08 = load(p08)
          t08["revision"] = int(t08["revision"]) + 1
          t08["status"] = "completed_verified"
          t08["updated_at"] = NOW
          t08["completed_at"] = NOW
          t08["active_substep"] = None
          t08["next_action"] = FINAL_NEXT
          t08["last_verified_action"] = f"Ready-state governance continuity run {PRE_CONTINUITY} passed after all ten deterministic T08 charters, verified live Render operation, and genuine geographic evidence for R01/R02/R03/R06/R09. GATX-T08 completion gate is satisfied; physical R10 was not required by the governed geographic gate."
          t08["unresolved_failures"] = []
          t08["owner_decision_required"] = False
          t08["roadmap_projection_pending"] = False
          dep = t08.setdefault("dependency", {}).setdefault("GATX-T07-REMOTE", {})
          dep["status"] = "completed_verified"
          dep["deployed_runtime_verified"] = True
          mark_required_pass(t08)
          for kind, value in [
              ("commit", f"GATX-T08 repaired validated candidate {APP_VALIDATED_HEAD}"),
              ("pull_request", "GATX-T08 live repair/evidence PRs #182 and #183"),
              ("ci_run", f"GATX-T08 ready-state continuity run {PRE_CONTINUITY} PASS"),
              ("artifact", f"GATX-T08 owner cross-location evidence {EVIDENCE_PATH}"),
              ("merge", f"GATX-T08 canonical application evidence merge {APP_EVIDENCE_MERGE}"),
          ]:
              add_scoped_evidence(t08, kind, value)
          save(p08, t08)

          pp = "governance/ai/runtime/CURRENT_WORK_POINTER.json"
          pointer = load(pp)
          pointer["updated_at"] = NOW
          pointer["primary_attempt_id"] = "GATX-T08-attempt-001"
          pointer["selection_reason"] = "GATX-T07-REMOTE and GATX-T08 are completed_verified after live Render deployment, repaired exact-head validation, public health/credential-denial verification, genuine cross-location GM/Player evidence, and ready-state continuity. No later GATX tranche is activated."
          for item in pointer["active_attempts"]:
              if item["attempt_id"] == "GATX-T07-REMOTE-attempt-001":
                  item.update({"owner_selected": False, "status":"completed_verified", "active_substep":None, "latest_pushed_commit":APP_EVIDENCE_MERGE, "validated_candidate_sha":APP_VALIDATED_HEAD, "application_merge_commit":APP_EVIDENCE_MERGE, "pull_request":183, "updated_at":NOW, "roadmap_projection_pending":False})
              if item["attempt_id"] == "GATX-T08-attempt-001":
                  item.update({"owner_selected": True, "status":"completed_verified", "active_substep":None, "latest_pushed_commit":APP_EVIDENCE_MERGE, "validated_candidate_sha":APP_VALIDATED_HEAD, "application_merge_commit":APP_EVIDENCE_MERGE, "pull_request":183, "updated_at":NOW, "roadmap_projection_pending":False})
          save(pp, pointer)

          pr = "governance/ai/runtime/ROADMAP_INDEX_GATX_SUPPLEMENT.json"
          roadmap = load(pr)
          for entry in roadmap["entries"]:
              if entry["work_item_id"] == "GATX-T07-REMOTE":
                  entry.update({"current_status":"completed_verified", "deployed_runtime_verified":True, "completed_at":NOW, "application_merge_commit":APP_EVIDENCE_MERGE, "live_public_probe_run":LIVE_PUBLIC_RUN, "completion_gate":"Completed: governed access-gated remote-session runtime is live and verified for authority, hidden information, reconnect, latency, health, and credential denial."})
              if entry["work_item_id"] == "GATX-T08":
                  entry.update({"current_status":"completed_verified", "deployed_runtime_verified":True, "geographic_evidence_verified":True, "completed_at":NOW, "application_merge_commit":APP_EVIDENCE_MERGE, "completion_gate":"Completed: all ten permanent regression charters pass and genuine geographic evidence satisfies R01/R02/R03/R06/R09."})
          save(pr, roadmap)

          pa = "governance/application-planning/internal-alpha/guided-alpha/GATX_REMOTE_T08_CURRENT_STATE_20260816.json"
          amendment = load(pa)
          amendment["recorded_at"] = NOW
          amendment["authority"] = "Final current-state record for GATX-T07-REMOTE and GATX-T08. Both are completed_verified. Render Free remains the synthetic Internal Alpha host; Railway remains superseded."
          a07 = amendment["GATX-T07-REMOTE"]
          a07.update({"status":"completed_verified", "validated_candidate_sha":APP_VALIDATED_HEAD, "hosting_application_merge_commit":APP_RUNTIME_MERGE, "remote_first_deployment_verified":True, "completion_blocker":None, "completion_claim_allowed":True, "completed_at":NOW})
          a08 = amendment["GATX-T08"]
          a08.update({"status":"completed_verified", "validated_candidate_sha":APP_VALIDATED_HEAD, "application_merge_commit":APP_EVIDENCE_MERGE, "deployed_regression_verified":True, "geographic_evidence_verified":True, "completion_claim_allowed":True, "completed_at":NOW})
          save(pa, amendment)

          pb = "governance/application-planning/internal-alpha/guided-alpha/GATX_BACKLOG.json"
          backlog = load(pb)
          pos = backlog["current_position"]
          pos.update({
              "highest_completed":"GATX-T08",
              "active_item":None,
              "active_item_title":None,
              "next_tranche_after_active_item":None,
              "next_tranche_title":None,
              "next_tranche_state":None,
              "t07_remote_dependency_gated":False,
              "t07_remote_started":True,
              "t07_remote_live_verified":True,
              "t07_remote_completed":True,
              "t08_started":True,
              "t08_geographic_evidence_verified":True,
              "t08_completed":True,
              "stop_before_t07_remote":False
          })
          for item in backlog["items"]:
              if item["id"] == "GATX-T07-REMOTE":
                  item.update({"status":"completed_verified", "validated_candidate_sha":APP_VALIDATED_HEAD, "application_pull_request":183, "application_merge_commit":APP_EVIDENCE_MERGE, "deployed_runtime_commit":APP_RUNTIME_MERGE, "live_deployment_id":LIVE_DEPLOY_ID, "live_public_probe_run":LIVE_PUBLIC_RUN, "completed_at":NOW, "acceptance_summary":"Completed verified: the no-cost access-gated Render Free synthetic Internal Alpha runtime is live; GM/Player authority, privacy, reconnect, latency, health, credential denial, and repaired live-state UX are evidenced."})
              if item["id"] == "GATX-T08":
                  item.update({"status":"completed_verified", "validated_candidate_sha":APP_VALIDATED_HEAD, "application_pull_request":183, "application_merge_commit":APP_EVIDENCE_MERGE, "geographic_evidence_verified":True, "geographic_evidence_artifact":EVIDENCE_PATH, "completed_at":NOW, "acceptance_summary":"Completed verified: all ten remote regression charters pass; owner-observed geographically separated GM/Player clients satisfy the designated physical charters R01/R02/R03/R06/R09."})
          save(pb, backlog)

          # Validate completed checkpoint rules and regenerate compact status from the canonical tool.
          PY
          python tools/continuity_state.py refresh-status
          python tools/continuity_state.py validate

          git config user.name "multiversal-aioc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add governance/ai/work-state/GATX-T07-REMOTE-attempt-001.json \
                  governance/ai/work-state/GATX-T08-attempt-001.json \
                  governance/ai/runtime/CURRENT_WORK_POINTER.json \
                  governance/ai/runtime/CURRENT_IMPLEMENTATION_STATUS.json \
                  governance/ai/runtime/ROADMAP_INDEX_GATX_SUPPLEMENT.json \
                  governance/application-planning/internal-alpha/guided-alpha/GATX_REMOTE_T08_CURRENT_STATE_20260816.json \
                  governance/application-planning/internal-alpha/guided-alpha/GATX_BACKLOG.json
          if git diff --cached --quiet; then
            echo "Completed projection already current."
          else
            git commit -m "Complete GATX T07 remote and T08 cross-location"
            git push origin HEAD:governance/gatx-t07-t08-live-completion
          fi
