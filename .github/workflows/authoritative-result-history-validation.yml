name: Validate Authoritative Result and History Presentation

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/feature-packets/IA-D04-004_*'
      - 'governance/application-planning/internal-alpha/validate_authoritative_result_history.py'
      - 'governance/application-planning/internal-alpha/INTERNAL_ALPHA_DESIGN_BACKLOG.md'
      - 'governance/application-planning/internal-alpha/README.md'
      - 'governance/application-planning/internal-alpha/feature-packets/README.md'
      - 'governance/ai/runtime/ROADMAP_INDEX.json'
      - '.github/workflows/authoritative-result-history-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python governance/application-planning/internal-alpha/validate_authoritative_result_history.py
