name: Validate Combat Asset Integrity Matrix

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/IA-D06-005_COMBAT_ASSET_INTEGRITY_MATRIX.json'
      - 'governance/application-planning/internal-alpha/IA-D06-005_COMBAT_ASSET_INTEGRITY_MATRIX_SPEC.md'
      - 'governance/application-planning/internal-alpha/IA-D06-005_COMPLETION_RECORD.json'
      - 'governance/application-planning/internal-alpha/IA-D06-005_IMPLEMENTATION_TRACEABILITY.json'
      - 'governance/application-planning/internal-alpha/IA-D06-005_READINESS_RECORD.md'
      - 'governance/application-planning/internal-alpha/IA-D06-005_REVIEW_RECEIPT.md'
      - 'governance/application-planning/internal-alpha/validate_combat_asset_integrity_matrix.py'
      - '.github/workflows/validate-ia-d06-005-combat-asset-integrity.yml'
  push:
    branches:
      - main
    paths:
      - 'governance/application-planning/internal-alpha/IA-D06-005_COMBAT_ASSET_INTEGRITY_MATRIX.json'
      - 'governance/application-planning/internal-alpha/IA-D06-005_COMBAT_ASSET_INTEGRITY_MATRIX_SPEC.md'
      - 'governance/application-planning/internal-alpha/IA-D06-005_COMPLETION_RECORD.json'
      - 'governance/application-planning/internal-alpha/IA-D06-005_IMPLEMENTATION_TRACEABILITY.json'
      - 'governance/application-planning/internal-alpha/IA-D06-005_READINESS_RECORD.md'
      - 'governance/application-planning/internal-alpha/IA-D06-005_REVIEW_RECEIPT.md'
      - 'governance/application-planning/internal-alpha/validate_combat_asset_integrity_matrix.py'
      - '.github/workflows/validate-ia-d06-005-combat-asset-integrity.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run IA-D06-005 validator
        run: python governance/application-planning/internal-alpha/validate_combat_asset_integrity_matrix.py
