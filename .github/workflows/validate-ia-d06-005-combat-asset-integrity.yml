name: Validate Combat Asset Integrity Matrix

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/**'
      - '.github/workflows/validate-ia-d06-005-combat-asset-integrity.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run IA-D06-005 validator
        run: python governance/application-planning/internal-alpha/validate_combat_asset_integrity_matrix.py
