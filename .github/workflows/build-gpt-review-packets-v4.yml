name: Build GPT Review Packets v4

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Run Semantic Recovery v4']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'audit/build_gpt_review_packets_v4.py'
      - '.github/workflows/build-gpt-review-packets-v4.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: multiversal-gpt-review-packets-v4
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax preflight
        run: python -m py_compile audit/build_gpt_review_packets_v4.py
      - name: Download latest Semantic Recovery v4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow='Run Semantic Recovery v4' --status=success --limit=1 --json databaseId --jq='.[0].databaseId')
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --dir downloaded
          CANDIDATES=$(find downloaded -path '*/canonical/canonical-candidates-v4.jsonl' -print -quit)
          test -n "$CANDIDATES"
          mkdir -p semantic-recovery-v4/canonical
          cp "$CANDIDATES" semantic-recovery-v4/canonical/canonical-candidates-v4.jsonl
      - name: Build bounded review packets
        run: python audit/build_gpt_review_packets_v4.py --candidates semantic-recovery-v4/canonical --out gpt-review-v4 --diagnostic-limit 40
      - name: Validate packet sizes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          i=json.loads(Path('gpt-review-v4/gpt-review-packets-v4-index.json').read_text())
          assert i['strictCount'] <= 50, i
          assert 0 < i['diagnosticCount'] <= 40, i
          assert len(i['diagnosticFamilyCounts']) >= 3, i
          PY
      - name: Publish compact packet index
        run: |
          mkdir -p v2/audit-data/semantic-recovery-v4
          cp gpt-review-v4/gpt-review-packets-v4-index.json v2/audit-data/semantic-recovery-v4/
      - name: Upload complete review packets
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-gpt-review-packets-v4-${{ github.sha }}
          path: gpt-review-v4/
          retention-days: 90
      - name: Commit packet index
        run: |
          git config user.name 'multiversal-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/audit-data/semantic-recovery-v4/gpt-review-packets-v4-index.json
          if git diff --cached --quiet; then echo 'No packet index changes.'; exit 0; fi
          git commit -m 'Publish GPT review packet index [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
