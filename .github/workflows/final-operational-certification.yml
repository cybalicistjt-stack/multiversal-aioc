name: final-operational-certification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: node --check implementation/release-hardening/final-operational-certification.mjs
      - name: Run final operational certification tests
        run: node implementation/release-hardening/final-operational-certification.test.mjs
