name: Day Work 04 - Mine Regression Corpus

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 2 8 *'

permissions:
  actions: read
  contents: write

jobs:
  mine:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 19 2 8 *'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax preflight
        run: python -m py_compile audit/build_regression_mining_v4.py
      - name: Download latest successful Semantic Recovery v4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow='Run Semantic Recovery v4' --status=success --limit=1 --json databaseId --jq='.[0].databaseId')
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --dir downloaded
          CANDIDATES=$(find downloaded -name 'canonical-candidates-v4.jsonl' -print -quit)
          test -n "$CANDIDATES"
          mkdir -p regression-input/canonical
          cp "$CANDIDATES" regression-input/canonical/canonical-candidates-v4.jsonl
      - name: Mine positive and negative regression examples
        run: python audit/build_regression_mining_v4.py --candidates regression-input/canonical --out regression-mining-v4 --per-family 12
      - name: Validate mining output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('regression-mining-v4/regression-mining-v4-index.json').read_text())
          assert x['candidateCount'] > 0, x
          assert x['familyCount'] >= 5, x
          assert x['boundaryChallengeCount'] > 0, x
          PY
      - name: Upload complete mining artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-regression-mining-v4-${{ github.run_id }}
          path: regression-mining-v4/
          retention-days: 90
      - name: Publish compact mining index
        run: |
          mkdir -p v2/audit-data/semantic-recovery-v4
          cp regression-mining-v4/regression-mining-v4-index.json v2/audit-data/semantic-recovery-v4/
          git config user.name 'multiversal-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/audit-data/semantic-recovery-v4/regression-mining-v4-index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish unattended regression-mining index [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
