name: VTI-07 RED Unlock Supplement Repair
on:
  push:
    branches: [governance/vti-07-seal-red-unlock-production]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/vti-07-seal-red-unlock-production
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          start='governance/application-planning/APPLICATION_IMPLEMENTATION_ROADMAP_VTI07_GOVERNED_START_2026-09-06.md'
          p=Path('governance/ai/runtime/CURRENT_WORK_POINTER.json')
          d=json.loads(p.read_text())
          d['roadmap_supplements']=[start]
          p.write_text(json.dumps(d,separators=(',',':'))+'\n')
          p=Path('governance/ai/runtime/ACTIVE_AUTHORITY_REGISTRY.json')
          d=json.loads(p.read_text())
          for row in d['current']:
              if row.get('kind')=='roadmap_supplement': row['path']=start
          p.write_text(json.dumps(d,separators=(',',':'))+'\n')
          PY
          rm .github/workflows/vti07-red-unlock-supplement-fix.yml
          git config user.name multiversal-governance-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "VTI-07 RED unlock: retain governed-start active supplement"
          git push origin HEAD:governance/vti-07-seal-red-unlock-production
