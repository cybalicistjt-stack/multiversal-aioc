name: Validate P1 Ranged Weapons Consolidated Tranche

on:
  pull_request:
    paths:
      - 'governance/object-system/csv-intake/P1_RANGED_WEAPONS_CONSOLIDATED_TRANCHE_CONTRACT.json'
      - 'scripts/run-p1-ranged-weapons-consolidated-tranche.py'
      - '.github/workflows/validate-p1-ranged-weapons-consolidated-tranche.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run consolidated ranged weapons tranche
        run: python scripts/run-p1-ranged-weapons-consolidated-tranche.py
      - uses: actions/upload-artifact@v4
        with:
          name: csv-p1-ranged-weapons-consolidated-tranche-230
          path: build/csv-p1-ranged-weapons-consolidated-tranche-l60/
