name: VTI-08 Terminal Closeout Repair
on:
  push:
    branches:
      - governance/vti-08-terminal-closeout-vti-09-selection
    paths:
      - '.github/workflows/vti08-terminal-closeout-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/vti-08-terminal-closeout-vti-09-selection
          fetch-depth: 0
      - name: Reproject closeout and repair named lifecycle failures
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vti08_terminal_closeout_repair_temp.py
      - name: Run complete current control-plane and repository-health gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/control_plane -p 'test_*.py'
          python3 scripts/validate_repository_health.py --root .
      - name: Commit tested closeout and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name cybalicistjt-stack
          git config user.email cybalicist.jt@gmail.com
          git rm .github/workflows/vti08-terminal-closeout-projection.yml
          git rm .github/workflows/vti08-terminal-closeout-repair.yml
          git rm tools/vti08_terminal_closeout_repair_temp.py
          git add governance tests/control_plane
          git commit -m 'VTI-08: terminal closeout and VTI-09 selection'
          git push origin HEAD:governance/vti-08-terminal-closeout-vti-09-selection
