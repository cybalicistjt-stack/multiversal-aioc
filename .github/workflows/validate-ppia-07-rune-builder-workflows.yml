name: Validate PPIA-07 Rune Builder Workflows

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_RUNE_BUILDER_WORKFLOW_AUTHORING_CONTRACT_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_RUNE_BUILDER_WORKFLOW_TRACEABILITY_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_RUNE_BUILDER_WORKFLOW_CANDIDATE.md'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_RUNE_COMPOSITION_TAXONOMY_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_DETERMINISTIC_GRAMMAR_CANDIDATE_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_RUNE_REFERENCE_CORPUS_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_COST_COMPLEXITY_STABILITY_PROGRESSION_CONTRACT_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_COST_STABILITY_PROGRESSION_BENCHMARKS_v0.1.0.json'
      - 'governance/ai/work-state/PPIA-07-attempt-001.json'
      - 'governance/ai/runtime/CURRENT_WORK_POINTER.json'
      - 'governance/ai/runtime/CURRENT_IMPLEMENTATION_STATUS.json'
      - 'scripts/validate-ppia07-rune-builder-workflows.py'
      - '.github/workflows/validate-ppia-07-rune-builder-workflows.yml'
  push:
    branches:
      - governance/ppia-07-rune-construction-rpg-system
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_RUNE_BUILDER_WORKFLOW_AUTHORING_CONTRACT_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_RUNE_BUILDER_WORKFLOW_TRACEABILITY_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_RUNE_BUILDER_WORKFLOW_CANDIDATE.md'
      - 'governance/ai/work-state/PPIA-07-attempt-001.json'
      - 'governance/ai/runtime/CURRENT_WORK_POINTER.json'
      - 'governance/ai/runtime/CURRENT_IMPLEMENTATION_STATUS.json'
      - 'scripts/validate-ppia07-rune-builder-workflows.py'
      - '.github/workflows/validate-ppia-07-rune-builder-workflows.yml'

permissions:
  contents: read

jobs:
  validate-rune-builder-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA-07 Rune Builder workflow contracts
        run: python scripts/validate-ppia07-rune-builder-workflows.py
      - name: Validate PPIA-07 cost/stability/progression regression
        run: python scripts/validate-ppia07-cost-stability-progression.py
      - name: Validate PPIA-07 grammar/reference regression
        run: python scripts/validate-ppia07-grammar-reference.py
      - name: Validate PPIA-07 foundation regression
        run: python scripts/validate-ppia07-foundation.py
      - name: Validate PPIA-12 to PPIA-07 transition regression
        run: python scripts/validate-ppia12-to-ppia07-transition.py
      - name: Validate generalized PPIA program continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program.py
