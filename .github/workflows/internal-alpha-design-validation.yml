name: Validate Internal Alpha Feature Design

on:
  pull_request:
    paths:
      - "governance/application-planning/internal-alpha/**"
      - ".github/workflows/internal-alpha-design-validation.yml"
  push:
    branches:
      - main
    paths:
      - "governance/application-planning/internal-alpha/**"
      - ".github/workflows/internal-alpha-design-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate MV-IA-001
        run: >-
          python
          governance/application-planning/internal-alpha/validate_internal_alpha_design.py

      - name: Verify registry JSON
        run: >-
          python -m json.tool
          governance/application-planning/internal-alpha/INTERNAL_ALPHA_FEATURE_REGISTRY.json
          > /dev/null
