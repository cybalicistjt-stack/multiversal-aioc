name: continuity-snapshot

on:
  push:
    branches:
      - governance/session-bootstrap-v1
    paths:
      - 'implementation/repository-intelligence/continuity/**'
      - '.github/workflows/continuity-snapshot.yml'
  pull_request:
    paths:
      - 'implementation/repository-intelligence/continuity/**'
      - '.github/workflows/continuity-snapshot.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check continuity module syntax
        run: node --check implementation/repository-intelligence/continuity/continuity-snapshot.mjs
      - name: Run continuity snapshot acceptance tests
        run: node implementation/repository-intelligence/continuity/continuity-snapshot.test.mjs
