name: recovery-services

on:
  push:
    branches:
      - governance/session-bootstrap-v1
    paths:
      - 'implementation/operational-core/recovery/**'
      - 'implementation/operational-core/project-state/canonical-project-state.seed.json'
      - '.github/workflows/recovery-services.yml'
  pull_request:
    paths:
      - 'implementation/operational-core/recovery/**'
      - 'implementation/operational-core/project-state/canonical-project-state.seed.json'
      - '.github/workflows/recovery-services.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check module syntax
        run: node --check implementation/operational-core/recovery/recovery-services.mjs
      - name: Run recovery acceptance tests
        run: node implementation/operational-core/recovery/recovery-services.test.mjs
