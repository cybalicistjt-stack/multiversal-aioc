name: Validate PPIA-03 Completion Contract

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-03_ITEMS_EQUIPMENT_INVENTORY_EXPERIENCE_SPEC_v1.0.0.md'
      - 'governance/application-planning/parallel-preimplementation/PPIA-03_ACCEPTANCE_TRACEABILITY_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-03_COMPLETION_CANDIDATE.md'
      - 'scripts/validate-ppia03-completion-contracts.py'
      - '.github/workflows/validate-ppia-03-completion-contracts.yml'
  push:
    branches:
      - governance/ppia-03-items-equipment-inventory
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-03_ITEMS_EQUIPMENT_INVENTORY_EXPERIENCE_SPEC_v1.0.0.md'
      - 'governance/application-planning/parallel-preimplementation/PPIA-03_ACCEPTANCE_TRACEABILITY_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-03_COMPLETION_CANDIDATE.md'
      - 'scripts/validate-ppia03-completion-contracts.py'
      - '.github/workflows/validate-ppia-03-completion-contracts.yml'

permissions:
  contents: read

jobs:
  validate-ppia03-completion-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PPIA-03 completion candidate contracts
        run: python scripts/validate-ppia03-completion-contracts.py
