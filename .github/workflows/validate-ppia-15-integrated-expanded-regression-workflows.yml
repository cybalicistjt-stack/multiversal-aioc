name: Validate PPIA-15 Integrated Expanded Regression Workflows

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-15_*'
      - 'governance/application-planning/parallel-preimplementation/PPIA_PROGRAM_BACKLOG.json'
      - 'governance/ai/work-state/PPIA-15-attempt-001.json'
      - 'governance/ai/runtime/CURRENT_WORK_POINTER.json'
      - 'governance/ai/runtime/CURRENT_IMPLEMENTATION_STATUS.json'
      - 'scripts/validate-ppia15-integrated-expanded-regression-workflows.py'
      - 'scripts/validate-ppia15-expanded-regression-iar.py'
      - 'scripts/validate-ppia15-foundation.py'
      - 'scripts/validate-ppia15-completion-contracts.py'
      - 'scripts/validate-ppia14-to-ppia15-transition.py'
      - 'scripts/validate-ppia14-to-ppia15-transition-historical-safe.py'
      - 'scripts/validate-ppia14-completion-contracts.py'
      - 'scripts/validate-ppia11-completion-contracts.py'
      - 'scripts/validate-ppia11-completion-historical-safe.py'
      - 'scripts/validate-ppia10-completion-contracts.py'
      - 'scripts/validate-ppia10-completion-historical-safe.py'
      - 'scripts/validate-ppia09-completion-contracts.py'
      - '.github/workflows/validate-ppia-15-integrated-expanded-regression-workflows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ppia15-integrated-expanded-regression-workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA-15 Integrated Expanded Regression Workflows
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          backlog = json.loads(Path('governance/application-planning/parallel-preimplementation/PPIA_PROGRAM_BACKLOG.json').read_text())
          if backlog.get('current_work_item_id') == 'PPIA-15':
              cmd = ['python', 'scripts/validate-ppia15-integrated-expanded-regression-workflows.py']
          else:
              cmd = ['python', 'scripts/validate-ppia15-completion-contracts.py']
          raise SystemExit(subprocess.call(cmd))
          PY
      - name: Validate PPIA-15 Expanded Regression IAR regression
        run: python scripts/validate-ppia15-expanded-regression-iar.py
      - name: Validate PPIA-15 Foundation regression
        run: python scripts/validate-ppia15-foundation.py
      - name: Validate PPIA-14 to PPIA-15 transition current or historical evidence
        run: python scripts/validate-ppia14-to-ppia15-transition-historical-safe.py
      - name: Validate PPIA-14 completion dependency regression
        run: python scripts/validate-ppia14-completion-contracts.py
      - name: Validate PPIA-11 completion dependency current or historical evidence
        run: python scripts/validate-ppia11-completion-historical-safe.py
      - name: Validate PPIA-10 completion dependency historical regression
        run: python scripts/validate-ppia10-completion-historical-safe.py
      - name: Validate PPIA-09 completion dependency regression
        run: python scripts/validate-ppia09-completion-contracts.py
      - name: Validate generalized PPIA continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program.py
      - name: Validate conversation continuity
        run: python tools/continuity_state.py validate
      - name: Run conversation continuity regression tests
        run: python -m unittest discover -s tests/continuity -v
