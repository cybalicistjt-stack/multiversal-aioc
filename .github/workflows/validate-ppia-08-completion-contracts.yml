name: Validate PPIA-08 Completion Contract

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-08_*'
      - 'governance/application-planning/parallel-preimplementation/PPIA_PROGRAM_BACKLOG.json'
      - 'governance/ai/work-state/PPIA-08-attempt-001.json'
      - 'scripts/validate-ppia08-completion-contracts.py'
      - 'scripts/validate-ppia08-workflow-contracts.py'
      - 'scripts/validate-ppia08-inspector-reference-cases.py'
      - 'scripts/validate-ppia08-foundation.py'
      - 'scripts/validate-ppia07-to-ppia08-transition.py'
      - 'governance/application-planning/parallel-preimplementation/validate_ppia_program.py'
      - '.github/workflows/validate-ppia-08-completion-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ppia08-completion-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA-08 final completion contract
        run: python scripts/validate-ppia08-completion-contracts.py
      - name: Validate PPIA-08 workflow regression
        run: python scripts/validate-ppia08-workflow-contracts.py
      - name: Validate PPIA-08 inspector/reference regression
        run: python scripts/validate-ppia08-inspector-reference-cases.py
      - name: Validate PPIA-08 foundation regression
        run: python scripts/validate-ppia08-foundation.py
      - name: Validate PPIA-07 to PPIA-08 transition regression
        run: python scripts/validate-ppia07-to-ppia08-transition.py
      - name: Validate generalized PPIA program continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program.py
