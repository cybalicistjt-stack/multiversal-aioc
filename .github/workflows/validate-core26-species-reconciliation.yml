name: Validate Core 26 Species Reconciliation

on:
  pull_request:
    paths:
      - 'governance/application-planning/species-reconciliation/**'
      - 'governance/development-bible/amendments/MV-SPECIES-001_CORE_26_PLAYER_SPECIES_AUTHORITY_AMENDMENT.md'
      - 'governance/development-bible/README.md'
      - 'tools/validate-core26-species-reconciliation.py'
      - '.github/workflows/validate-core26-species-reconciliation.yml'
  push:
    branches:
      - governance/core26-species-reconciliation
    paths:
      - 'governance/application-planning/species-reconciliation/**'
      - 'governance/development-bible/amendments/MV-SPECIES-001_CORE_26_PLAYER_SPECIES_AUTHORITY_AMENDMENT.md'
      - 'governance/development-bible/README.md'
      - 'tools/validate-core26-species-reconciliation.py'
      - '.github/workflows/validate-core26-species-reconciliation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate-core26-species-reconciliation.py
