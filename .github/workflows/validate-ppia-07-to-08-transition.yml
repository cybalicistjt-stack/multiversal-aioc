name: Validate PPIA-07 to PPIA-08 Transition

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA_PROGRAM_BACKLOG.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_COMPLETION_REPORT.md'
      - 'governance/ai/work-state/PPIA-07-attempt-001.json'
      - 'governance/ai/work-state/PPIA-08-attempt-001.json'
      - 'governance/application-planning/parallel-preimplementation/validate_ppia_program.py'
      - 'scripts/validate-ppia07-completion-contracts.py'
      - 'scripts/validate-ppia07-to-ppia08-transition.py'
      - '.github/workflows/validate-ppia-07-to-08-transition.yml'
  push:
    branches:
      - governance/ppia-07-to-ppia-08-transition
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA_PROGRAM_BACKLOG.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-07_COMPLETION_REPORT.md'
      - 'governance/ai/work-state/PPIA-07-attempt-001.json'
      - 'governance/ai/work-state/PPIA-08-attempt-001.json'
      - 'governance/application-planning/parallel-preimplementation/validate_ppia_program.py'
      - 'scripts/validate-ppia07-completion-contracts.py'
      - 'scripts/validate-ppia07-to-ppia08-transition.py'
      - '.github/workflows/validate-ppia-07-to-08-transition.yml'

permissions:
  contents: read

jobs:
  validate-transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA-07 completion and PPIA-08 transition
        run: python scripts/validate-ppia07-to-ppia08-transition.py
      - name: Validate PPIA-07 completion regression
        run: python scripts/validate-ppia07-completion-contracts.py
      - name: Validate preserved PPIA-12 to PPIA-07 transition
        run: python scripts/validate-ppia12-to-ppia07-transition.py
      - name: Validate generalized PPIA program continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program.py
