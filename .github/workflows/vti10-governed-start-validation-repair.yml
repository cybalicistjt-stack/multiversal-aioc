name: VTI-10 Governed Start Validation Repair
on:
  push:
    branches:
      - governance/vti-10-governed-start
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/vti-10-governed-start
          fetch-depth: 0
      - name: Apply exact validation-contract repair
        run: python3 governance/ai/interaction-system/live/repair_vti10_governed_start_validation.py
      - name: Remove temporary helpers
        run: |
          rm governance/ai/interaction-system/live/repair_vti10_governed_start_validation.py
          rm .github/workflows/vti10-governed-start-validation-repair.yml
      - name: Run full control plane
        run: python3 -m unittest discover -s tests/control_plane -p 'test_*.py'
      - name: Run repository health
        run: python3 scripts/validate_repository_health.py --root . --expected-head "$(git rev-parse HEAD)" --output /tmp/vti10-governed-start-repair-health.json
      - name: Commit validated repair
        run: |
          git config user.name "cybalicistjt-stack"
          git config user.email "cybalicist.jt@gmail.com"
          git add -A
          git commit -m "VTI-10: repair governed-start lifecycle validation"
          git push origin HEAD:governance/vti-10-governed-start
