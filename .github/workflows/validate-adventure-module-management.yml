name: Validate Adventure and Module Management Design
on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/IA-D07-002_*'
      - 'governance/application-planning/internal-alpha/validate_adventure_module_management.py'
      - '.github/workflows/validate-adventure-module-management.yml'
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run IA-D07-002 validator
        run: python governance/application-planning/internal-alpha/validate_adventure_module_management.py