name: Build Semantic Engineering Registries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit/build_semantic_registries.py'
      - 'schemas/semantic-foundry/**'
      - 'v2/audit-data/**'
      - '.github/workflows/build-semantic-registries.yml'

permissions:
  contents: write

concurrency:
  group: multiversal-semantic-registries
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax preflight
        continue-on-error: true
        run: python -m py_compile audit/build_semantic_registries.py
      - name: Build registries
        id: build
        continue-on-error: true
        run: python audit/build_semantic_registries.py
      - name: Ensure partial index exists
        if: always()
        run: |
          mkdir -p semantic-registries
          if [ ! -f semantic-registries/semantic-registry-index.json ]; then
            cat > semantic-registries/semantic-registry-index.json <<JSON
          {"format":"multiversal-semantic-registry-index","version":"1.0.0","status":"partial-failure","authority":"Diagnostics only; no canonical content modified."}
          JSON
          fi
      - name: Upload registry artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-semantic-registries-${{ github.run_id }}
          path: semantic-registries/
          retention-days: 90
      - name: Publish compact registry outputs
        if: always()
        continue-on-error: true
        run: |
          mkdir -p v2/audit-data/semantic-registries
          cp semantic-registries/*.json v2/audit-data/semantic-registries/ 2>/dev/null || true
          git config user.name 'multiversal-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/audit-data/semantic-registries
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish semantic engineering registries [skip ci]'
          git pull --rebase origin main || true
          git push origin HEAD:main || true
