name: Validate Interaction Audit

on:
  pull_request:
    paths:
      - 'governance/ai/interaction-system/analysis/**'
      - 'governance/ai/interaction-system/evaluation/**'
      - 'tools/interaction_audit.py'
      - 'tests/interaction_audit/**'
      - '.github/workflows/validate-interaction-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'governance/ai/interaction-system/analysis/**'
      - 'governance/ai/interaction-system/evaluation/**'
      - 'tools/interaction_audit.py'
      - 'tests/interaction_audit/**'
      - '.github/workflows/validate-interaction-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate redacted interaction audit
        run: python tools/interaction_audit.py validate
      - name: Run interaction-audit regression tests
        run: python -m unittest discover -s tests/interaction_audit -v
