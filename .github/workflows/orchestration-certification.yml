name: orchestration-certification

on:
  push:
    branches: [governance/session-bootstrap-v1]
    paths:
      - 'implementation/executive-dashboard/orchestration/**'
      - '.github/workflows/orchestration-certification.yml'
  pull_request:
    paths:
      - 'implementation/executive-dashboard/orchestration/**'
      - '.github/workflows/orchestration-certification.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check module syntax
        run: node --check implementation/executive-dashboard/orchestration/orchestration-certification.mjs
      - name: Run orchestration certification tests
        run: node implementation/executive-dashboard/orchestration/orchestration-certification.test.mjs
