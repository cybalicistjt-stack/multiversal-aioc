name: Validate Social Interaction Mode Design

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F010_*'
      - 'governance/application-planning/internal-alpha/validate_social_interaction_mode.py'
      - '.github/workflows/social-interaction-mode-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python governance/application-planning/internal-alpha/validate_social_interaction_mode.py
