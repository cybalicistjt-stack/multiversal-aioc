name: Validate PPIA-12 Foundation

on:
  pull_request:
    paths:
      - "governance/application-planning/parallel-preimplementation/PPIA-12_*"
      - "governance/ai/work-state/PPIA-12-attempt-001.json"
      - "governance/ai/runtime/CURRENT_WORK_POINTER.json"
      - "governance/ai/runtime/CURRENT_IMPLEMENTATION_STATUS.json"
      - "scripts/validate-ppia12-foundation.py"
      - ".github/workflows/validate-ppia-12-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate PPIA-12 World and Setting foundation
        run: python scripts/validate-ppia12-foundation.py
      - name: Validate generalized PPIA program continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program.py
      - name: Validate PPIA-05 to PPIA-12 transition
        run: python scripts/validate-ppia05-to-ppia12-transition.py
