name: Validate PPIA-09 Investigation Mystery Workflows

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-09_*'
      - 'governance/ai/work-state/PPIA-09-attempt-001.json'
      - 'scripts/validate-ppia09-*.py'
      - 'scripts/validate-ppia08-to-ppia09-transition.py'
      - 'scripts/validate-ppia08-completion-contracts.py'
      - 'governance/application-planning/parallel-preimplementation/validate_ppia_program.py'
      - '.github/workflows/validate-ppia-09-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ppia09-investigation-mystery-workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA-09 Investigation Mystery workflows
        run: python scripts/validate-ppia09-workflow-contracts.py
      - name: Validate PPIA-09 inspector/reference regression
        run: python scripts/validate-ppia09-inspector-reference-cases.py
      - name: Validate PPIA-09 foundation regression
        run: python scripts/validate-ppia09-foundation.py
      - name: Validate PPIA-08 to PPIA-09 transition regression
        run: python scripts/validate-ppia08-to-ppia09-transition.py
      - name: Validate PPIA-08 completion regression
        run: python scripts/validate-ppia08-completion-contracts.py
      - name: Validate generalized PPIA continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program.py
