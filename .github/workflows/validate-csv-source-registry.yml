name: Validate CSV Source Registry

on:
  pull_request:
    paths:
      - 'governance/object-system/csv-intake/**'
      - 'scripts/validate-csv-source-registry.py'
      - '.github/workflows/validate-csv-source-registry.yml'

jobs:
  validate-csv-source-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-csv-source-registry.py
