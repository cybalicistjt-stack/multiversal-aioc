name: Record Pages Deployment Result

on:
  workflow_run:
    workflows: ['Deploy Unified AIOC Pages']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v4
        with:
          ref: ci/failure-records
          fetch-depth: 0

      - name: Record Pages result
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set +e
          mkdir -p governance/ci-failures/pages

          run_id="$EVENT_RUN_ID"
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] || [ -z "$run_id" ]; then
            run_id="$(gh api "/repos/$REPOSITORY/actions/workflows/deploy-pages.yml/runs?per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null)"
          fi

          run_json="$(gh api "/repos/$REPOSITORY/actions/runs/$run_id" 2>/dev/null)"
          conclusion="$(jq -r '.conclusion // "unknown"' <<<"$run_json" 2>/dev/null)"
          head_sha="$(jq -r '.head_sha // "unknown"' <<<"$run_json" 2>/dev/null)"
          created_at="$(jq -r '.created_at // "unknown"' <<<"$run_json" 2>/dev/null)"
          updated_at="$(jq -r '.updated_at // "unknown"' <<<"$run_json" 2>/dev/null)"

          jobs_json="$(gh api "/repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100" 2>/dev/null)"
          failed_steps="$(jq -r '.jobs[]? as $job | $job.steps[]? | select(.conclusion == "failure") | "- **\($job.name) / \(.name)** — failure"' <<<"$jobs_json" 2>/dev/null)"
          [ -n "$failed_steps" ] || failed_steps='- None recorded.'

          cat > governance/ci-failures/pages/LATEST.md <<EOF
          # Pages Deployment — Run $run_id

          **Result:** $conclusion  
          **Commit:** $head_sha  
          **Created:** $created_at  
          **Updated:** $updated_at

          ## Failed steps

          $failed_steps
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/ci-failures/pages/LATEST.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Pages deployment result $run_id"
            git push origin HEAD:ci/failure-records
          fi
          exit 0
