name: Validate PPIA-06 Foundation

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-06_*'
      - 'governance/ai/work-state/PPIA-06-attempt-001.json'
      - 'scripts/validate-ppia06-foundation.py'
      - '.github/workflows/validate-ppia-06-foundation.yml'
      - 'scripts/validate-ppia11-to-ppia06-transition.py'
      - 'scripts/validate-ppia11-completion-historical-safe.py'
      - 'scripts/validate-ppia05-completion-contracts.py'
      - 'scripts/validate-ppia03-completion-contracts.py'
  workflow_dispatch:

jobs:
  validate-ppia06-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA-06 foundation
        run: python scripts/validate-ppia06-foundation.py
      - name: Validate PPIA-11 to PPIA-06 transition regression
        run: python scripts/validate-ppia11-to-ppia06-transition.py
      - name: Validate PPIA-11 completion current or historical evidence
        run: python scripts/validate-ppia11-completion-historical-safe.py
      - name: Validate PPIA-05 completion dependency
        run: python scripts/validate-ppia05-completion-contracts.py
      - name: Validate PPIA-03 completion dependency
        run: python scripts/validate-ppia03-completion-contracts.py
      - name: Validate generalized PPIA continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program.py
      - name: Validate conversation continuity
        run: python tools/continuity_state.py validate
