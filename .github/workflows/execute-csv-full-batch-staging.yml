name: Execute CSV Full Batch Staging

on:
  pull_request:
    paths:
      - 'Csv.zip'
      - 'governance/object-system/csv-intake/CSV_BATCH_STAGING_CONTRACT.json'
      - 'governance/object-system/csv-intake/CSV_FULL_BATCH_STAGING_EXECUTION.json'
      - 'scripts/convert-csv-batch-to-staging.py'
      - 'scripts/validate-csv-batch-staging.py'
      - '.github/workflows/execute-csv-full-batch-staging.yml'
  workflow_dispatch:

jobs:
  execute-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert all CSV rows to governed staging
        run: python scripts/convert-csv-batch-to-staging.py
      - name: Validate full staging output
        run: python scripts/validate-csv-batch-staging.py
      - name: Verify execution assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          execution = json.loads(Path('governance/object-system/csv-intake/CSV_FULL_BATCH_STAGING_EXECUTION.json').read_text())
          summary = json.loads(Path('build/csv-batch-staging/SUMMARY.json').read_text())
          assert summary['totalRows'] == execution['scope']['rows'] == 19199
          assert len(summary['datasets']) == execution['scope']['datasets'] == 20
          assert summary['canonicalIdsAssigned'] == 0
          assert summary['promotionReadyRows'] == 0
          print(json.dumps({'datasets':20,'rows':19199,'canonicalIdsAssigned':0,'promotionReadyRows':0}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: csv-full-batch-staging-19199
          path: build/csv-batch-staging/
          if-no-files-found: error
          retention-days: 30
