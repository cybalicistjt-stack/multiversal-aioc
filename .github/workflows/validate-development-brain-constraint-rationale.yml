name: Validate Development Brain Constraint Rationale

on:
  pull_request:
    paths:
      - 'governance/development-brain/**'
      - 'scripts/development-brain/**'
      - '.github/workflows/validate-development-brain-constraint-rationale.yml'
  workflow_dispatch:

concurrency:
  group: development-brain-constraint-rationale-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate Design Intent input
        run: node scripts/development-brain/generate-design-intent.mjs governance/development-brain/memory/AIOC_PROJECT_MEMORY.json tmp/AIOC_UNIFIED_INVENTORY.json tmp/AIOC_DESIGN_INTENT.json
      - name: Generate Decision History input
        run: node scripts/development-brain/generate-decision-history.mjs governance/development-brain/memory/AIOC_PROJECT_MEMORY.json tmp/AIOC_DESIGN_INTENT.json tmp/AIOC_DECISION_HISTORY.json
      - name: Generate Constraint Rationale artifact
        run: node scripts/development-brain/generate-constraint-rationale.mjs governance/development-brain/memory/AIOC_PROJECT_MEMORY.json tmp/AIOC_DESIGN_INTENT.json tmp/AIOC_DECISION_HISTORY.json tmp/AIOC_CONSTRAINT_RATIONALE.json
      - name: Validate Constraint Rationale artifact
        run: node scripts/development-brain/validate-constraint-rationale.mjs tmp/AIOC_CONSTRAINT_RATIONALE.json
      - name: Require Constraint Rationale artifact
        run: test -s tmp/AIOC_CONSTRAINT_RATIONALE.json
      - name: Publish Constraint Rationale artifact
        uses: actions/upload-artifact@v4
        with:
          name: aioc-constraint-rationale
          path: tmp/AIOC_CONSTRAINT_RATIONALE.json
          if-no-files-found: error
