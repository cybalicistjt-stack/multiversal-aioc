name: Validate PPIA-05 Workflow Contracts

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-05_WORKFLOW_AUTHORING_CONTRACT_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-05_SPECIES_FORM_INSPECTOR_PROJECTION_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-05_REFERENCE_CASES_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-05_SPECIES_FORMS_BIOLOGY_TAXONOMY_v0.1.0.json'
      - 'scripts/validate-ppia05-workflow-contracts.py'
      - '.github/workflows/validate-ppia-05-workflow-contracts.yml'
  push:
    branches:
      - governance/ppia-05-species-forms-biology
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-05_WORKFLOW_AUTHORING_CONTRACT_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-05_SPECIES_FORM_INSPECTOR_PROJECTION_MATRIX_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-05_REFERENCE_CASES_v0.1.0.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-05_SPECIES_FORMS_BIOLOGY_TAXONOMY_v0.1.0.json'
      - 'scripts/validate-ppia05-workflow-contracts.py'
      - '.github/workflows/validate-ppia-05-workflow-contracts.yml'

permissions:
  contents: read

jobs:
  validate-ppia05-workflow-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PPIA-05 workflow and authoring contracts
        run: python scripts/validate-ppia05-workflow-contracts.py
