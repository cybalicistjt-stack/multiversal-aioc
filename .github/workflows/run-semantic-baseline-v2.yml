name: Run Semantic Baseline v2

on:
  workflow_run:
    workflows: ["Run Semantic Recovery"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit/build_semantic_baseline_v2.py'
      - 'audit/test_semantic_baseline_v2.py'
      - 'docs/SEMANTIC-BASELINE-V2.md'
      - '.github/workflows/run-semantic-baseline-v2.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: multiversal-semantic-baseline-v2
  cancel-in-progress: true

jobs:
  baseline:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download authoritative semantic recovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          RUN_ID="$EVENT_RUN_ID"
          if [ '${{ github.event_name }}' != 'workflow_run' ]; then
            RUN_ID=$(gh run list --workflow='Run Semantic Recovery' --status=success --limit=1 --json databaseId --jq='.[0].databaseId')
          fi
          test -n "$RUN_ID"
          echo "Using semantic recovery run $RUN_ID"
          gh run download "$RUN_ID" --dir downloaded
          PARSED=$(find downloaded -path '*/family-parsers/family-parser-candidates.jsonl' -print -quit)
          GRAPH=$(find downloaded -path '*/knowledge-graph/canonical-knowledge-graph.json' -print -quit)
          test -n "$PARSED"
          test -n "$GRAPH"
          mkdir -p baseline-input/family-parsers baseline-input/knowledge-graph
          cp "$PARSED" baseline-input/family-parsers/family-parser-candidates.jsonl
          cp "$GRAPH" baseline-input/knowledge-graph/canonical-knowledge-graph.json

      - name: Run known-regression test suite
        id: regression
        continue-on-error: true
        run: python -m unittest -v audit/test_semantic_baseline_v2.py

      - name: Record regression result
        if: always()
        run: |
          mkdir -p semantic-baseline-v2
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
            'format':'multiversal-semantic-baseline-v2-regression-status',
            'version':'2.2.0',
            'outcome':os.environ.get('REGRESSION_OUTCOME','unknown'),
            'passed':os.environ.get('REGRESSION_OUTCOME')=='success'
          }
          Path('semantic-baseline-v2/regression-status.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}

      - name: Compile precision-first semantic baseline
        if: always()
        run: |
          python audit/build_semantic_baseline_v2.py \
            --parsed baseline-input/family-parsers \
            --graph baseline-input/knowledge-graph \
            --out semantic-baseline-v2 \
            --ready-limit 500

      - name: Build stratified owner acceptance packet
        if: always()
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          ready=Path('semantic-baseline-v2/semantic-baseline-v2-ready.jsonl')
          rows=[json.loads(x) for x in ready.read_text().splitlines() if x.strip()] if ready.exists() else []
          by=defaultdict(list)
          for row in rows: by[row['objectType']].append(row)
          packet=[]
          for family in sorted(by):
            packet.extend(by[family][:min(10,len(by[family]))])
          payload={
            'format':'multiversal-semantic-baseline-v2-owner-acceptance-packet',
            'version':'2.2.0',
            'candidateCount':len(packet),
            'familyCounts':{k:min(10,len(v)) for k,v in sorted(by.items())},
            'reviewInstructions':[
              'Confirm this is a distinct game object or rule identity.',
              'Confirm the proposed family is correct.',
              'Confirm the source excerpt contains the complete relevant definition.',
              'Mark false positives, merged objects, partial objects, and missing context.',
              'Do not approve canonical import from this packet; it validates extraction quality only.'
            ],
            'candidates':packet,
            'authorityNote':'Owner/expert acceptance sample; no canonical write is authorized.'
          }
          Path('semantic-baseline-v2/owner-acceptance-packet.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Publish compact baseline diagnostics
        if: always()
        run: |
          mkdir -p v2/audit-data/semantic-baseline-v2
          for file in semantic-baseline-v2-index.json semantic-baseline-v2-error-report.json owner-acceptance-packet.json regression-status.json; do
            test -f "semantic-baseline-v2/$file" && cp "semantic-baseline-v2/$file" v2/audit-data/semantic-baseline-v2/
          done
          test -f v2/audit-data/semantic-baseline-v2/semantic-baseline-v2-index.json

      - name: Upload full baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-semantic-baseline-v2-${{ github.sha }}
          path: semantic-baseline-v2/
          if-no-files-found: error
          retention-days: 90

      - name: Commit baseline diagnostics
        if: always()
        run: |
          git config user.name 'multiversal-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/audit-data/semantic-baseline-v2
          if git diff --cached --quiet; then echo 'No baseline diagnostic changes to publish.'; exit 0; fi
          git commit -m 'Publish measured Semantic Baseline v2 diagnostics [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce engineering baseline gates
        if: always()
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads(Path('semantic-baseline-v2/semantic-baseline-v2-index.json').read_text())
          assert os.environ.get('REGRESSION_OUTCOME') == 'success', {'regressionOutcome':os.environ.get('REGRESSION_OUTCOME')}
          assert s['inputCandidateCount'] > 0, s
          assert s['readyCount'] > 0, s
          assert all(s['gates'].values()), s
          assert s['engineeringBaselinePassed'] is True, s
          assert not s['knownBadReady'], s
          assert len(s['readyFamilyCounts']) >= 5, s
          assert sum(s['readyFamilyCounts'].values()) == s['readyCount'], s
          print(json.dumps({
            'ready': s['readyCount'],
            'needsReview': s['needsReviewCount'],
            'rejected': s['rejectedCount'],
            'families': s['readyFamilyCounts'],
            'connectedReady': s['connectedReadyCount'],
            'duplicateRate': s['duplicateRate'],
            'gates': s['gates'],
          }, indent=2))
          PY
