name: Validate Character Campaign Integration

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/feature-packets/IA-D03-005_*'
      - 'governance/application-planning/internal-alpha/validate_character_campaign_integration.py'
      - 'governance/application-planning/internal-alpha/INTERNAL_ALPHA_DESIGN_BACKLOG.md'
      - 'governance/application-planning/internal-alpha/README.md'
      - 'governance/application-planning/internal-alpha/feature-packets/README.md'
      - 'governance/ai/runtime/ROADMAP_INDEX.json'
      - '.github/workflows/character-campaign-integration-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Character Campaign integration
        run: python governance/application-planning/internal-alpha/validate_character_campaign_integration.py
