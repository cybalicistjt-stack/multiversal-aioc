name: Validate PPIA-13 Foundation

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-13_*'
      - 'governance/application-planning/parallel-preimplementation/PPIA_PROGRAM_BACKLOG.json'
      - 'governance/ai/work-state/PPIA-13-attempt-001.json'
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F003_*'
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F004_*'
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F006_*'
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F020_*'
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F021_*'
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F025_*'
      - 'scripts/validate-ppia13-foundation.py'
      - 'scripts/validate-ppia06-to-ppia13-transition.py'
      - 'scripts/validate-ppia06-completion-historical-safe.py'
      - '.github/workflows/validate-ppia-13-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ppia13-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA-13 Foundation
        run: python scripts/validate-ppia13-foundation.py
      - name: Validate PPIA-06 to PPIA-13 transition regression
        run: python scripts/validate-ppia06-to-ppia13-transition.py
      - name: Validate PPIA-06 completion dependency regression
        run: python scripts/validate-ppia06-completion-historical-safe.py
      - name: Validate PPIA-08 completion dependency regression
        run: python scripts/validate-ppia08-completion-contracts.py
      - name: Validate generalized PPIA continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program.py
      - name: Validate conversation continuity
        run: python tools/continuity_state.py validate
      - name: Run conversation continuity regression tests
        run: python -m unittest discover -s tests/continuity -v
