name: Validate Stage A A5 Current Revalidation

on:
  pull_request:
    branches: [main]
    paths:
      - 'governance/application-planning/stage-a-a5/**'
      - 'tools/validate_stage_a_a5_current_revalidation_v0.3.0.py'
      - '.github/workflows/validate-stage-a-a5-current-revalidation.yml'

permissions:
  contents: read

jobs:
  validate-a5-revalidation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current A5 activation authority
        run: python tools/validate_stage_a_a5_current_revalidation_v0.3.0.py
