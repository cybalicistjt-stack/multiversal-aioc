name: Apply CAPP-01 Canonical Regeneration

on:
  push:
    branches: [governance/capp-01-appearance-choice-registry]
    paths: ['.github/workflows/apply-capp01-canonical-regeneration.yml']

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/capp-01-appearance-choice-registry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate from canonical PPIA-06 authority
        run: python scripts/generate-capp01-registry.py
      - name: Validate regenerated foundation
        run: python scripts/validate-capp01-foundation.py
      - name: Commit corrected canonical foundation
        run: |
          rm .github/workflows/apply-capp01-canonical-regeneration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Regenerate CAPP-01 from canonical PPIA-06 profiles'
          git push origin HEAD:governance/capp-01-appearance-choice-registry
