name: Validate Proposal and Approval Shared Component

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/feature-packets/IA-D04-002_*'
      - 'governance/application-planning/internal-alpha/validate_proposal_approval_shared_component.py'
      - '.github/workflows/proposal-approval-shared-component-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'governance/application-planning/internal-alpha/feature-packets/IA-D04-002_*'
      - 'governance/application-planning/internal-alpha/validate_proposal_approval_shared_component.py'
      - '.github/workflows/proposal-approval-shared-component-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate proposal and approval shared component
        run: python governance/application-planning/internal-alpha/validate_proposal_approval_shared_component.py
