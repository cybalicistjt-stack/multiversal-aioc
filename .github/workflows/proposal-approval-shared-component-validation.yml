name: Validate Proposal and Approval Shared Component

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/feature-packets/IA-D04-002_*'
      - 'governance/application-planning/internal-alpha/validate_proposal_approval_shared_component.py'
      - 'governance/application-planning/internal-alpha/INTERNAL_ALPHA_DESIGN_BACKLOG.md'
      - 'governance/application-planning/internal-alpha/README.md'
      - 'governance/application-planning/internal-alpha/feature-packets/README.md'
      - 'governance/ai/runtime/ROADMAP_INDEX.json'
      - '.github/workflows/proposal-approval-shared-component-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate proposal and approval shared component
        run: python governance/application-planning/internal-alpha/validate_proposal_approval_shared_component.py
