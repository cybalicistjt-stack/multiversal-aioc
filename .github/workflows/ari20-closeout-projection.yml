name: ARI-20 closeout projection

on:
  push:
    branches:
      - governance/ari-20-closeout-ari-21-selection

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/ari-20-closeout-ari-21-selection
          fetch-depth: 0
      - name: Project ARI-20 closeout to ARI-21 selected
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def save(path, data, compact=False):
              text = json.dumps(data, separators=(',', ':') if compact else None, indent=None if compact else 2)
              Path(path).write_text(text + '\n', encoding='utf-8')

          evidence = {
              'work_item_id': 'ARI-20',
              'status': 'completed_verified',
              'application_pr': 465,
              'validated_head': '9d2bfc5c104d7694f9323a799c2b179c21a00ae3',
              'validation_run': 34754694363,
              'deterministic_receipt_sha256': '148a97c214d057431ff3f535c2e160dda5b406f4b08a95df1e3b62f5205dd4b2',
              'merge_sha': '4b5b1e75f2993545537bcab9f101f38e1a0822b3',
          }

          cp20 = load('governance/ai/work-state/ARI-20-attempt-001.json')
          cp21 = load('governance/ai/work-state/ARI-21-attempt-001.json')
          assert cp20['status'] == 'completed_verified'
          assert cp20['completion_evidence']['application_validation_run'] == 34754694363
          assert cp20['completion_evidence']['application_merge_sha'] == evidence['merge_sha']
          assert cp21['status'] == 'selected_not_started'
          assert cp21['implementation_branch'] is None and cp21['implementation_authority'] is False

          p = load('governance/ai/runtime/CURRENT_WORK_POINTER.json')
          p['schema_version'] = '20.9.0'
          p['primary_attempt_id'] = 'ARI-21-attempt-001'
          p['selection_reason'] = 'ARI-20 is completed_verified from application PR 465 with exact-head cross-platform Validation Core evidence. ARI-21 is the strict selected_not_started successor with no implementation branch or authority.'
          p['active_attempt'] = {'work_item_id':'ARI-21','attempt_id':'ARI-21-attempt-001','track':'asset-resource-ingestion-reuse','source_program':'ARI','priority':1,'owner_selected':True,'repository':'cybalicistjt-stack/multiversal-aioc','checkpoint_path':'governance/ai/work-state/ARI-21-attempt-001.json','status':'selected_not_started','implementation_branch':None,'implementation_authority':False,'active_item':'ARI-21 — Missing Source, Relink & Derivative-Rebuild Recovery'}
          p['active_program'].update({'completed_through':'ARI-20','current':'ARI-21','strict_next':'ARI-22A'})
          p['bounded_authority'].update({'selected_ari_unit':'ARI-21','ari_implementation':False,'implementation_branch':None,'rule':'ARI-21 is selected_not_started only. No product implementation branch or authority exists until its governed start passes the execution transaction preflight; ARI-22A+ remain inactive.'})
          p['recently_completed_ari_work'] = [evidence]
          p['recently_completed_implementation_work'] = [evidence]
          p['selection_invariants'] = ['SGC is completed_verified through SGC-08C and retired from active family execution.','ARI-01 through ARI-20 are completed_verified; ARI-20 is merged with exact-head Linux/Windows deterministic Validation Core evidence.','The live family preflight remains ARI with 24 execution units and ARI-22 pre-split into ARI-22A/B/C.','ARI-21 is selected_not_started with no implementation branch or implementation authority.','Before an ARI-21 product branch or PR mutation, the exact authorized branch/open-PR snapshot and atomic start projections must pass scripts/execution_transaction_preflight.py.','Execution-mode final response remains nonterminal while a governed PR is open, current exact-head validation is active, merge closeout is pending, or execution reconciliation is nonterminal.','Required external development tools must be verified current for the intended workflow; trial-expired or inaccessible services cannot be required dependencies.']
          p['exact_next_action'] = 'Record a governed ARI-21 start projection, run the execution transaction preflight against exact start projections and fresh branch/open-PR state, then create or resume only implementation/ari-21-missing-source-relink-derivative-rebuild-recovery.'
          save('governance/ai/runtime/CURRENT_WORK_POINTER.json', p, True)

          a = load('governance/ai/runtime/ACTIVE_AUTHORITY_REGISTRY.json')
          a['schema_version'] = '20.14.0'
          a['rule'] = 'Only registered CURRENT or CURRENT_COMPATIBLE surfaces may govern. ARI-20 is completed_verified. ARI-21 is selected_not_started with no product implementation branch or authority; ARI-22A+ remain inactive. The execution profile and executable transaction/termination controls govern future bounded starts and final responses.'
          for row in a['current']:
              if row.get('kind') == 'checkpoint': row['path'] = 'governance/ai/work-state/ARI-21-attempt-001.json'
          a['active_planning_work'] = {'work_item':'ARI-21','attempt_id':'ARI-21-attempt-001','repository':'cybalicistjt-stack/multiversal-aioc','state':'selected_not_started','implementation_branch':None,'implementation_authority':False,'implementation_scope':'ARI-21 remains selected only; its governed start must pass the execution transaction preflight before application branch/PR mutation.'}
          a['family_preflight']['implementation_authority'] = False
          a['roadmap_execution_authority']['implementation_authority'] = False
          a['recently_completed_ari_work'] = [{**evidence, 'work_item': evidence['work_item_id']}]
          a['recently_completed_ari_work'][0].pop('work_item_id')
          save('governance/ai/runtime/ACTIVE_AUTHORITY_REGISTRY.json', a, True)

          r = load('governance/repository-health/RUNTIME_STATE_LIFECYCLE_REGISTRY.json')
          r['schema_version'] = '16.11.0'
          r['active_work'] = {'work_item':'ARI-21','attempt_id':'ARI-21-attempt-001','repository':'cybalicistjt-stack/multiversal-aioc','state':'selected_not_started','role':'current_selection','implementation_branch':None,'implementation_authority':False,'execution_rule':'ARI-21 is selected_not_started only; no product mutation authority exists until its governed start passes execution_transaction_preflight.py. ARI-22A+ remain inactive.'}
          save('governance/repository-health/RUNTIME_STATE_LIFECYCLE_REGISTRY.json', r)

          c = load('governance/ai/runtime/ROADMAP_COMPILED_PROJECTION.json')
          c['schema_version'] = '1.4.0'
          c['current_selection'] = {'attempt_id':'ARI-21-attempt-001','implementation_authority':False,'status':'selected_not_started','work_item_id':'ARI-21'}
          save('governance/ai/runtime/ROADMAP_COMPILED_PROJECTION.json', c)

          lanes = load('governance/ai/runtime/PRODUCT_EXECUTION_LANES.json')
          lanes['schema_version'] = '1.0.5'
          lanes['legacy_primary_selection'] = {'work_item_id':'ARI-21','attempt_id':'ARI-21-attempt-001','status':'selected_not_started','implementation_authority':False}
          save('governance/ai/runtime/PRODUCT_EXECUTION_LANES.json', lanes, True)

          b = load('governance/application-planning/asset-resource-ingestion-reuse/ARI_PROGRAM_BACKLOG.json')
          b['schema_version'] = '0.4.0'
          b['current_attempt'] = 'ARI-21-attempt-001'
          b['current_item'] = 'ARI-21'
          b['completed_through'] = 'ARI-20'
          for row in b['tranches']:
              if row['id'] == 'ARI-20':
                  row.update({'status':'completed_verified','implementation_authority':False,'application_pr':465,'application_validated_head':evidence['validated_head'],'validation_run':evidence['validation_run'],'deterministic_receipt_sha256':evidence['deterministic_receipt_sha256'],'application_merge':evidence['merge_sha']})
              elif row['id'] == 'ARI-21':
                  row.update({'status':'selected_not_started','implementation_authority':False})
          save('governance/application-planning/asset-resource-ingestion-reuse/ARI_PROGRAM_BACKLOG.json', b)
          PY
          git rm .github/workflows/ari20-closeout-projection.yml
          git config user.name "multiversal-closeout"
          git config user.email "actions@users.noreply.github.com"
          git add governance/ai/runtime/CURRENT_WORK_POINTER.json governance/ai/runtime/ACTIVE_AUTHORITY_REGISTRY.json governance/repository-health/RUNTIME_STATE_LIFECYCLE_REGISTRY.json governance/ai/runtime/ROADMAP_COMPILED_PROJECTION.json governance/ai/runtime/PRODUCT_EXECUTION_LANES.json governance/application-planning/asset-resource-ingestion-reuse/ARI_PROGRAM_BACKLOG.json
          git commit -m "ARI-20: complete closeout and select ARI-21"
          git push origin HEAD:governance/ari-20-closeout-ari-21-selection
