name: Run Unattended Long-Form Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 2 8 *'

permissions:
  actions: read
  contents: write

concurrency:
  group: multiversal-unattended-longform
  cancel-in-progress: false

jobs:
  longform:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 13 2 8 *'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax preflight
        run: python -m py_compile audit/build_unattended_longform_reports.py

      - name: Download latest successful Semantic Recovery v4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow='Run Semantic Recovery v4' --status=success --limit=1 --json databaseId --jq='.[0].databaseId')
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --dir downloaded
          CANDIDATES=$(find downloaded -name 'canonical-candidates-v4.jsonl' -print -quit)
          test -n "$CANDIDATES"
          mkdir -p unattended-input/canonical
          cp "$CANDIDATES" unattended-input/canonical/canonical-candidates-v4.jsonl

      - name: Build long-form reports and review batches
        run: |
          python audit/build_unattended_longform_reports.py \
            --candidates unattended-input/canonical \
            --out unattended-longform \
            --batch-size 40

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('unattended-longform/unattended-longform-index.json')
          x=json.loads(p.read_text())
          assert x['candidateCount'] > 0, x
          assert x['familyPacketCount'] > 0, x
          assert len(x['familyCounts']) >= 5, x
          assert Path('unattended-longform/duplicate-clusters.json').exists()
          assert Path('unattended-longform/boundary-anomalies.json').exists()
          assert Path('unattended-longform/schema-gap-report.json').exists()
          assert Path('unattended-longform/relationship-diagnostics.json').exists()
          assert Path('unattended-longform/prioritized-review-backlog.json').exists()
          PY

      - name: Upload complete unattended artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiversal-unattended-longform-${{ github.run_id }}
          path: unattended-longform/
          retention-days: 90

      - name: Publish compact diagnostics
        run: |
          mkdir -p v2/audit-data/unattended-longform
          cp unattended-longform/unattended-longform-index.json v2/audit-data/unattended-longform/
          cp unattended-longform/duplicate-clusters.json v2/audit-data/unattended-longform/
          cp unattended-longform/schema-gap-report.json v2/audit-data/unattended-longform/
          cp unattended-longform/relationship-diagnostics.json v2/audit-data/unattended-longform/
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('unattended-longform/boundary-anomalies.json').read_text())
          src['records']=src.get('records',[])[:200]
          Path('v2/audit-data/unattended-longform/boundary-anomalies-sample.json').write_text(json.dumps(src,indent=2)+'\n')
          backlog=json.loads(Path('unattended-longform/prioritized-review-backlog.json').read_text())
          backlog['records']=backlog.get('records',[])[:200]
          Path('v2/audit-data/unattended-longform/prioritized-review-backlog-sample.json').write_text(json.dumps(backlog,indent=2)+'\n')
          PY

      - name: Commit diagnostics
        run: |
          git config user.name 'multiversal-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/audit-data/unattended-longform
          if git diff --cached --quiet; then echo 'No unattended diagnostics changed.'; exit 0; fi
          git commit -m 'Publish unattended long-form analysis diagnostics [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
