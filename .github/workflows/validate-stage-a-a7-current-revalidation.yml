name: Validate Stage A A7 Current Revalidation

on:
  pull_request:
    branches: [main]
    paths:
      - 'governance/application-planning/stage-a-a7/**'
      - 'tools/validate_stage_a_a7_current_revalidation_v0.3.0.py'
      - '.github/workflows/validate-stage-a-a7-current-revalidation.yml'

permissions:
  contents: read

jobs:
  validate-a7-revalidation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current A7 activation authority
        run: python tools/validate_stage_a_a7_current_revalidation_v0.3.0.py
