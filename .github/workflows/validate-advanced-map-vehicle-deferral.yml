name: Validate Advanced Map Vehicle Deferral
on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/IA-D08-003_*'
      - 'governance/application-planning/internal-alpha/validate_advanced_map_vehicle_deferral.py'
      - '.github/workflows/validate-advanced-map-vehicle-deferral.yml'
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python governance/application-planning/internal-alpha/validate_advanced_map_vehicle_deferral.py
