name: Validate P0 Mixed-Domain Consolidated Tranche

on:
  pull_request:
    paths:
      - 'governance/object-system/csv-intake/P0_MIXED_DOMAIN_CONSOLIDATED_TRANCHE_CONTRACT.json'
      - 'scripts/run-p0-mixed-domain-consolidated-tranche.py'
      - '.github/workflows/validate-p0-mixed-domain-consolidated-tranche.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run consolidated mixed-domain tranche
        run: python scripts/run-p0-mixed-domain-consolidated-tranche.py
      - uses: actions/upload-artifact@v4
        with:
          name: csv-p0-mixed-domain-consolidated-tranche-1080
          path: build/csv-p0-mixed-domain-consolidated-tranche-l52/
