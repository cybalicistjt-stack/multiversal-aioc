name: Validate Development Brain Semantic Ontology

on:
  push:
    branches: [main]
    paths:
      - 'governance/development-brain/**'
      - 'scripts/development-brain/**'
      - '.github/workflows/validate-development-brain-semantic-ontology.yml'
      - 'content-db/index.json'
      - 'governance/shared-state/AIOC_SHARED_STATE.json'
  pull_request:
    paths:
      - 'governance/development-brain/**'
      - 'scripts/development-brain/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate semantic ontology artifact
        run: |
          mkdir -p tmp
          node scripts/development-brain/generate-semantic-ontology.mjs tmp/AIOC_UNIFIED_INVENTORY.json tmp/AIOC_DEPENDENCY_GRAPH.json tmp/AIOC_SEMANTIC_ONTOLOGY.json
      - name: Validate semantic ontology artifact
        run: |
          test -s tmp/AIOC_SEMANTIC_ONTOLOGY.json
          node scripts/development-brain/validate-semantic-ontology.mjs tmp/AIOC_SEMANTIC_ONTOLOGY.json
      - name: Publish semantic ontology artifact
        uses: actions/upload-artifact@v4
        with:
          name: aioc-semantic-ontology
          path: tmp/AIOC_SEMANTIC_ONTOLOGY.json
          if-no-files-found: error
          retention-days: 14
