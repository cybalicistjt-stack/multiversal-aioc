name: Validate First Playable Loop Implementation Handoff

on:
  pull_request:
    paths:
      - 'governance/application-planning/internal-alpha/feature-packets/IA-D04-005_*'
      - 'governance/application-planning/internal-alpha/validate_first_playable_loop_handoff.py'
      - 'governance/application-planning/internal-alpha/INTERNAL_ALPHA_DESIGN_BACKLOG.md'
      - 'governance/application-planning/internal-alpha/README.md'
      - 'governance/application-planning/internal-alpha/feature-packets/README.md'
      - 'governance/ai/MULTIVERSAL_CHECKPOINT_AND_VALIDATION_EFFICIENCY_POLICY.md'
      - '.github/workflows/first-playable-loop-handoff-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python governance/application-planning/internal-alpha/validate_first_playable_loop_handoff.py
