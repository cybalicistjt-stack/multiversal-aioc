name: VTI-10 Terminal Projection

on:
  push:
    branches:
      - governance/vti-10-terminal-closeout-vti-11-selection
    paths:
      - .github/workflows/vti10-terminal-projection.yml

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/vti-10-terminal-closeout-vti-11-selection
          fetch-depth: 0
          persist-credentials: true
      - name: Project terminal closeout and successor selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, json
          from pathlib import Path

          ROOT = Path.cwd()
          NOW = "2026-09-07T22:31:00-05:00"
          APP_MERGE = "145eee04181b9ed66cae887ea6830da111918c25"
          FINAL_HEAD = "41df73d952bf106b65d260c980c07d8ad877bdab"
          FINAL_RUN = 34183387667
          FINAL_RECEIPT = "08f29cea5babcc93b3f388cb71d99465286b3f720b78d85f340df560c43792ac"
          TERMINAL_SUPPLEMENT = "governance/application-planning/APPLICATION_IMPLEMENTATION_ROADMAP_VTI10_CLOSEOUT_2026-09-07.md"

          def read(path):
              return json.loads((ROOT / path).read_text(encoding="utf-8"))

          def write(path, value):
              (ROOT / path).write_text(json.dumps(value, separators=(",", ":")) + "\n", encoding="utf-8")

          final_green = {
              "head_sha": FINAL_HEAD,
              "run_id": FINAL_RUN,
              "repository_health_job": 101926833023,
              "linux_job": 101926858489,
              "windows_job": 101926858451,
              "deterministic_compare_job": 101927123764,
              "deterministic_receipt_sha256": FINAL_RECEIPT,
              "historical_profile_fanout": 0,
              "linux_artifact_id": 10039680217,
              "windows_artifact_id": 10039697746,
              "comparison_artifact_id": 10039702410,
              "linux_artifact_digest_sha256": "93e04f9e8fa1ec2d9ca69403c252b2a3fc9079df1ad4982af2df81b9c673f8d8",
              "windows_artifact_digest_sha256": "212998c7941551670ae760fbd48c56ca483ea0395cdce43168695a4decd8d5cc",
              "comparison_artifact_digest_sha256": "597e538f418a174926054f8c846a74cc65c03d688cb425dce0bdd417a5c60219",
          }

          cp_path = "governance/ai/work-state/VTI-10-attempt-001.json"
          cp = read(cp_path)
          cp["schema_version"] = "0.5.0"
          cp["status"] = "completed_verified"
          cp["implementation_authority"] = False
          cp["branch_creation_authorized"] = False
          cp["acceptance_package_authorized"] = False
          cp["production_mutation_authorized"] = False
          cp["validation"]["final_green"] = final_green
          cc = cp["convergence_control"]
          cc.update({
              "owner_continue_count": 2,
              "execution_cycles": 2,
              "repair_cycles": 7,
              "application_feature_repair_cycles": 1,
              "validation_contract_repair_cycles": 4,
              "repository_state_repair_cycles": 2,
              "no_progress_cycles": 0,
              "diagnostic_mode": True,
              "same_cycle_completed": False,
              "completed_within_two_cycles": True,
              "unrelated_historical_validation_jobs_observed": 0,
              "reruns_without_changed_evidence": 0,
              "post_merge_stale_pointer_incidents": 0,
