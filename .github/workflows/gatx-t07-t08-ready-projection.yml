          upsert_validation(vals, "deployed remote T08 regression", "pass", f"live Render deployment {LIVE_DEPLOY_ID}; public probe {LIVE_PUBLIC_RUN}; {EVIDENCE_PATH}")
          upsert_validation(vals, "actual geographically separated GM/Player evidence for R01 R02 R03 R06 R09", "pass", EVIDENCE_PATH)
          upsert_validation(vals, "governance continuity validation", "not_run", None)
          t08["unresolved_failures"] = []
          t08["roadmap_projection_pending"] = True
          t08["physical_cross_location_evidence"] = {
              "artifact": EVIDENCE_PATH,
              "application_merge_commit": APP_EVIDENCE_MERGE,
              "current_repaired_session": "p906023-ec4296e5",
              "required_charters": ["T08-R01", "T08-R02", "T08-R03", "T08-R06", "T08-R09"],
              "status": "pass",
              "owner_location_strings": {"player": "jasper Alabama", "gm": "carbon bill Alabama"},
              "network_strings": {"player": "Verizon data", "gm": "home wifi"}
          }
          ev = t08.setdefault("evidence", [])
          for kind, value in [
