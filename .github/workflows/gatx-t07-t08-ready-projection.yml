    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/gatx-t07-t08-live-completion
          fetch-depth: 0
      - name: Project live completion evidence into governed state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          NOW = "2026-08-17T11:12:00Z"
          APP_VALIDATED_HEAD = "b204fb91797e226d297c75884056bde085e17c0e"
          APP_RUNTIME_MERGE = "d41a245d72f10d6027c4606cd429abba7028bfab"
          APP_EVIDENCE_MERGE = "bff19db1d24205c0886df48f04f2febe09e05b65"
          LIVE_DEPLOY_ID = "dep-da1eepu417fc73ac4fpg"
          LIVE_SERVICE_ID = "srv-da1730jl550s73f065j0"
          LIVE_URL = "https://multiversal-gatx-remote.onrender.com"
          LIVE_PUBLIC_RUN = 32023337155
          REPAIR_RENDER_RUN = 32021864270
          REPAIR_REMOTE_RUN = 32021864363
          EVIDENCE_PATH = "artifacts/gatx-t08/GATX_T07_T08_LIVE_CROSS_LOCATION_EVIDENCE_20260817.json"

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, value):
              Path(path).write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")

          def upsert_validation(items, command, status, evidence):
              for item in items:
                  if item.get("command") == command:
                      item["status"] = status
                      item["evidence"] = evidence
                      return
              items.append({"command": command, "status": status, "evidence": evidence})

          def add_evidence(items, kind, value):
              if not any(x.get("kind") == kind and x.get("value") == value for x in items):
                  items.append({"kind": kind, "value": value})

          # T07 checkpoint
          p07 = "governance/ai/work-state/GATX-T07-REMOTE-attempt-001.json"
          t07 = load(p07)
          t07["revision"] = int(t07.get("revision", 0)) + 1
          t07["governance_branch"] = "governance/gatx-t07-t08-live-completion"
          t07["status"] = "ready_for_review"
          t07["updated_at"] = NOW
          t07["completed_at"] = None
          t07["validated_candidate_sha"] = APP_VALIDATED_HEAD
          t07["latest_pushed_commit"] = APP_EVIDENCE_MERGE
          t07["expected_remote_head"] = APP_RUNTIME_MERGE
          t07["pull_request"] = 183
          t07["application_merge_commit"] = APP_EVIDENCE_MERGE
          t07["last_verified_action"] = (
              "The free Render service was created through the connected Render integration, deployed from canonical app commit "
              + APP_RUNTIME_MERGE + ", and redeployed after the validated live-refresh repair. Deployment " + LIVE_DEPLOY_ID
              + " reached live status. Owner-observed geographically separated GM/Player execution satisfied T08-R01/R02/R03/R06, "
              + "with prior same-service 350 ms physical latency evidence satisfying R09; repaired-head CI revalidated unchanged latency semantics. "
              + "App PR #183 merged the durable evidence receipt as " + APP_EVIDENCE_MERGE + ", and live public run " + str(LIVE_PUBLIC_RUN)
              + " passed /health, unauthenticated denial, and deployed repaired-UI checks."
          )
          t07["active_substep"] = "governance-continuity-closure"
          completed = t07.setdefault("completed_substeps", [])
          for value in ["render-live-deployment", "live-refresh-repair", "live-public-probe", "owner-cross-location-run", "application-evidence-closure"]:
              if value not in completed:
                  completed.append(value)
          t07["next_action"] = "Run governance continuity on this ready-for-review projection; if it passes, promote GATX-T07-REMOTE and GATX-T08 together to completed_verified without starting another tranche."
          remote = t07.setdefault("remote_deployment", {})
          remote.update({
              "provider": "Render",
              "plan": "free",
              "service_name": "multiversal-gatx-remote",
              "service_id": LIVE_SERVICE_ID,
              "url": LIVE_URL,
              "deployed_runtime_commit": APP_RUNTIME_MERGE,
              "deployment_id": LIVE_DEPLOY_ID,
              "deployment_status": "live",
              "first_deployment_receipt_present": True,
              "health_verified": True,
              "unauthenticated_api_denial_verified": True,
              "role_secrets_configured_outside_repository": True,
              "railway_status": "superseded_no_cost_requirement"
