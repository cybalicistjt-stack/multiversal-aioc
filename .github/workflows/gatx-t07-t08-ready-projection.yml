              if entry.get("work_item_id") == "GATX-T08":
                  entry.update({"current_status":"ready_for_review","software_implementation_merged":True,"deterministic_regression_complete":True,"deployed_runtime_verified":True,"geographic_evidence_verified":True,"geographic_evidence_artifact":EVIDENCE_PATH,"completion_gate":"All ten permanent regression charters pass deterministically and the five required physical charters R01/R02/R03/R06/R09 have genuine geographic evidence; ready-for-review now awaits only governance continuity."})
          save(pr, roadmap)

          # Current-state amendment
          pa = "governance/application-planning/internal-alpha/guided-alpha/GATX_REMOTE_T08_CURRENT_STATE_20260816.json"
          amendment = load(pa)
          amendment["recorded_at"] = NOW
          amendment["authority"] = "Current-state amendment for GATX-T07-REMOTE and GATX-T08. Render Free is the verified live synthetic Internal Alpha host; Railway remains superseded. This ready-for-review projection awaits governance continuity before completion is claimed."
          a07 = amendment["GATX-T07-REMOTE"]
          a07.update({"status":"ready_for_review","validated_candidate_sha":APP_VALIDATED_HEAD,"hosting_validation_runs":[REPAIR_RENDER_RUN,REPAIR_REMOTE_RUN],"hosting_application_pull_request":182,"hosting_application_merge_commit":APP_RUNTIME_MERGE,"remote_first_deployment_verified":True,"live_service_url":LIVE_URL,"live_deployment_id":LIVE_DEPLOY_ID,"live_public_probe_run":LIVE_PUBLIC_RUN,"completion_blocker":"Governance continuity closure only.","completion_claim_allowed":False})
          a08 = amendment["GATX-T08"]
          a08.update({"status":"ready_for_review","validated_candidate_sha":APP_VALIDATED_HEAD,"validation_runs":[REPAIR_RENDER_RUN,REPAIR_REMOTE_RUN,LIVE_PUBLIC_RUN],"application_merge_commit":APP_EVIDENCE_MERGE,"deployed_regression_verified":True,"geographic_evidence_verified":True,"geographic_evidence_artifact":EVIDENCE_PATH,"completion_claim_allowed":False})
          save(pa, amendment)

          # Program backlog
          pb = "governance/application-planning/internal-alpha/guided-alpha/GATX_BACKLOG.json"
          backlog = load(pb)
          pos = backlog.setdefault("current_position", {})
          pos.update({
