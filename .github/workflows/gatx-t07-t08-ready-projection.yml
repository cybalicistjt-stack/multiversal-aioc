              ("ci_run", f"GATX repaired Render validation run {REPAIR_RENDER_RUN} PASS"),
              ("ci_run", f"GATX repaired remote/client validation run {REPAIR_REMOTE_RUN} PASS"),
              ("merge", f"GATX live-refresh application squash merge {APP_RUNTIME_MERGE}"),
              ("artifact", f"Owner cross-location evidence {EVIDENCE_PATH}"),
