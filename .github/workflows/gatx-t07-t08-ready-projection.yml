          vals = t07.setdefault("validation", [])
          upsert_validation(vals, "T07 remote access/auth/privacy and authoritative-session reuse verifier", "pass", f"repaired exact-head run {REPAIR_REMOTE_RUN} remote-contract-regression")
          upsert_validation(vals, "T07-ARCH T06 T05 T04 T03 DIAG-F01 preservation", "pass", f"repaired exact-head run {REPAIR_REMOTE_RUN} remote-contract-regression")
          upsert_validation(vals, "client regression typecheck accessibility and build", "pass", f"repaired exact-head run {REPAIR_REMOTE_RUN} client-preservation")
          upsert_validation(vals, "Render free Blueprint and exact container smoke", "pass", f"repaired exact-head Render run {REPAIR_RENDER_RUN}")
          upsert_validation(vals, "deployed remote health and unauthorized-access denial", "pass", f"live public deployment run {LIVE_PUBLIC_RUN}")
          upsert_validation(vals, "deployed GM/player same-session authority hidden-information and reconnect smoke", "pass", f"{EVIDENCE_PATH} at application merge {APP_EVIDENCE_MERGE}")
          upsert_validation(vals, "governance continuity validation", "not_run", None)
          t07["unresolved_failures"] = []
          t07["roadmap_projection_pending"] = True
          ev = t07.setdefault("evidence", [])
          for kind, value in [
              ("commit", f"GATX live-refresh validated candidate {APP_VALIDATED_HEAD}"),
              ("pull_request", "GATX live-refresh application PR #182"),
              ("ci_run", f"GATX repaired Render validation run {REPAIR_RENDER_RUN} PASS"),
              ("ci_run", f"GATX repaired remote/client validation run {REPAIR_REMOTE_RUN} PASS"),
              ("merge", f"GATX live-refresh application squash merge {APP_RUNTIME_MERGE}"),
