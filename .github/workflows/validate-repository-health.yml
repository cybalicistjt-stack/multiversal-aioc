name: Validate Repository Health

on:
  pull_request:
    paths:
      - 'governance/ai/**'
      - 'governance/repository-health/**'
      - 'governance/application-planning/**'
      - 'scripts/validate_repository_health.py'
      - '.github/workflows/validate-repository-health.yml'
  push:
    branches: [main]
    paths:
      - 'governance/ai/**'
      - 'governance/repository-health/**'
      - 'governance/application-planning/**'
      - 'scripts/validate_repository_health.py'
      - '.github/workflows/validate-repository-health.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-state:
    name: Current AIOC authority and execution-surface health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact AIOC candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Validate exact current state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          python3 scripts/validate_repository_health.py \
            --root . \
            --expected-head "$CANDIDATE_HEAD" \
            --output "${RUNNER_TEMP}/canonical-state-audit-generated.json"

      - name: Upload compact current-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-health-${{ env.CANDIDATE_HEAD }}
          path: '${{ runner.temp }}/canonical-state-audit-generated.json'
          if-no-files-found: warn
          retention-days: 14
