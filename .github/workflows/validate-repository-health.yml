name: Validate Operations V3

on:
  pull_request:
    paths:
      - 'operations/**'
      - 'AGENTS.md'
      - 'governance/ai/**'
      - 'governance/current-state/**'
      - 'governance/project-memory/**'
      - 'governance/application-planning/APPLICATION_IMPLEMENTATION_ROADMAP.md'
      - 'governance/application-planning/dwc-speech/**'
      - 'bridge/**'
      - 'operational/**'
      - 'scripts/**'
      - 'tools/**'
      - 'tests/**'
      - 'content-source/**'
      - 'content-db/**'
      - 'content-database.js'
      - 'content-library-collections.js'
      - '.github/workflows/validate-repository-health.yml'
  push:
    branches: [main]
    paths:
      - 'operations/**'
      - 'AGENTS.md'
      - 'governance/ai/**'
      - 'governance/current-state/**'
      - 'governance/project-memory/**'
      - 'governance/application-planning/APPLICATION_IMPLEMENTATION_ROADMAP.md'
      - 'governance/application-planning/dwc-speech/**'
      - 'bridge/**'
      - 'operational/**'
      - 'scripts/**'
      - 'tools/**'
      - 'tests/**'
      - 'content-source/**'
      - 'content-db/**'
      - 'content-database.js'
      - 'content-library-collections.js'
      - '.github/workflows/validate-repository-health.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operations-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  single-door:
    name: Operations V3 single-door authority audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Verify exact head and stock toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          python3 --version
          node --version
          git --version

      - name: Validate the canonical single door
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_operations_v3.py \
            --root . \
            --expected-head "$CANDIDATE_HEAD" \
            --output "${RUNNER_TEMP}/operations-v3-audit.json"

      - name: Validate semantic retirement surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_ops3_semantic_surfaces.py

      - name: Run Operations V3 regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/control_plane/test_operations_v3_single_door.py

      - name: Run OPS3 execution/concurrency regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/control_plane/test_ops3_execution_concurrency.py

      - name: Run dynamic certified-content consumer regression
        shell: bash
        run: |
          set -euo pipefail
          node tests/control_plane/test_dynamic_certified_content_consumers.mjs

      - name: Run canonical content pipeline reconciliation regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/control_plane/test_canonical_content_pipeline_reconciliation.py

      - name: Run canonical content replacement compatibility regression
        shell: bash
        run: |
          set -euo pipefail
          node tests/control_plane/test_canonical_content_replacement.mjs

      - name: Run Beacon Debt golden-test and Item-readiness diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-canonical-version-index.mjs
          python3 tests/control_plane/test_beacon_debt_golden_diagnostics.py

      - name: Build Beacon Debt A5 runtime fixture and immutable snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_beacon_debt_runtime_fixture.py

      - name: Validate Beacon Debt runtime fixture and immutable snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/control_plane/test_beacon_debt_runtime_fixture.py

      - name: Run Content Library collection regression
        shell: bash
        run: |
          set -euo pipefail
          node tests/validate-content-library-staging.mjs

      - name: Publish certified generated content DB and runtime evidence on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A content-db \
            evidence/content-pipeline/latest-certificate.json \
            evidence/content-pipeline/beacon-debt-golden-diagnostics.json \
            evidence/content-pipeline/beacon-debt-runtime-instantiated.json
          if git diff --cached --quiet; then
            echo 'Generated canonical content DB and runtime evidence already match certified output.'
            exit 0
          fi
          git commit -m 'chore: publish certified generated content and Beacon Debt runtime snapshot [skip ci]'
          git push origin HEAD:main

      - name: Upload certified canonical content evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-content-pipeline-${{ env.CANDIDATE_HEAD }}
          path: |
            content-db/**
            evidence/content-pipeline/latest-certificate.json
            evidence/content-pipeline/beacon-debt-golden-diagnostics.json
            evidence/content-pipeline/beacon-debt-runtime-fixture-candidate.json
            evidence/content-pipeline/beacon-debt-runtime-instantiated.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload compact Operations V3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-v3-${{ env.CANDIDATE_HEAD }}
          path: ${{ runner.temp }}/operations-v3-audit.json
          if-no-files-found: warn
          retention-days: 14
