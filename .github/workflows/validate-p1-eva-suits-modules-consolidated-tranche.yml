name: Validate P1 EVA Suits Modules Consolidated Tranche

on:
  pull_request:
    paths:
      - 'governance/object-system/csv-intake/P1_EVA_SUITS_MODULES_CONSOLIDATED_TRANCHE_CONTRACT.json'
      - 'scripts/run-p1-eva-suits-modules-consolidated-tranche.py'
      - '.github/workflows/validate-p1-eva-suits-modules-consolidated-tranche.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run consolidated EVA suits and modules tranche
        run: python scripts/run-p1-eva-suits-modules-consolidated-tranche.py
      - uses: actions/upload-artifact@v4
        with:
          name: csv-p1-eva-suits-modules-consolidated-tranche-430
          path: build/csv-p1-eva-suits-modules-consolidated-tranche-l56/
