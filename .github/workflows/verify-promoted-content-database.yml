name: Verify Promoted Content Database

on:
  push:
    branches: [main]
    paths:
      - 'content-db/**'
      - '.github/workflows/verify-promoted-content-database.yml'
  pull_request:
    paths:
      - 'content-db/**'
      - '.github/workflows/verify-promoted-content-database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-promoted-content-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify promoted canonical database evidence
        run: |
          set -euo pipefail
          test -f content-db/index.json
          test -f content-db/manifest.json
          test -f content-db/certification.json
          test -f content-db/promotion.json
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const index = JSON.parse(fs.readFileSync('content-db/index.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('content-db/manifest.json', 'utf8'));
          const certificate = JSON.parse(fs.readFileSync('content-db/certification.json', 'utf8'));
          const promotion = JSON.parse(fs.readFileSync('content-db/promotion.json', 'utf8'));
          const fail = message => { throw new Error(message); };

          if (index.format !== 'multiversal-content-database') fail('Unexpected database format');
          if (index.databaseVersion !== '3.0.0') fail(`Unexpected database version: ${index.databaseVersion}`);
          if (!Array.isArray(index.records) || index.records.length !== 487) fail('Canonical database must contain exactly 487 records');
          if (index.recordCount !== index.records.length) fail('Index record count mismatch');
          if (manifest.recordCount !== index.recordCount) fail('Manifest record count mismatch');
          if (manifest.fullObjectBodies !== 487 || index.summary?.fullObjectBodies !== 487) fail('Full-object count mismatch');
          if (index.summary?.legacyInventoryStatus !== 'QUARANTINED_CORRUPTED_SOURCE') fail('Index legacy inventory quarantine is missing');

          if (certificate.result !== 'PASS') fail('Certification result is not PASS');
          if (certificate.pipelineMode !== 'CANONICAL_OBJECTS_ONLY') fail('Unexpected certificate pipeline mode');
          if (certificate.recordCount !== index.recordCount) fail('Certificate record count mismatch');
          if (certificate.legacyInventory?.status !== 'QUARANTINED_CORRUPTED_SOURCE') fail('Certificate legacy inventory quarantine is missing');

          if (promotion.pipelineMode !== 'CANONICAL_OBJECTS_ONLY') fail('Unexpected promotion pipeline mode');
          if (promotion.legacyInventoryStatus !== 'QUARANTINED_CORRUPTED_SOURCE') fail('Promotion legacy inventory quarantine is missing');
          if (!promotion.validationRunId || !promotion.validatedCommit || !promotion.promotedByRun) fail('Promotion receipt is incomplete');

          const semantic = index.records.map(r => [r.databaseId, r.stableId, r.objectType, r.name]);
          const fingerprint = `sha256:${crypto.createHash('sha256').update(JSON.stringify(semantic)).digest('hex')}`;
          if (certificate.semanticFingerprint !== fingerprint) fail('Certificate semantic fingerprint mismatch');
          if (index.semanticFingerprint !== fingerprint || manifest.semanticFingerprint !== fingerprint) fail('Database semantic fingerprint mismatch');

          const databaseIds = new Set();
          const stableIds = new Set();
          for (const record of index.records) {
            if (!record.databaseId) fail('Record missing databaseId');
            if (!record.stableId) fail('Record missing stableId');
            if (!record.gameObject) fail(`Record ${record.stableId} missing full game object`);
            if (databaseIds.has(record.databaseId)) fail(`Duplicate databaseId: ${record.databaseId}`);
            if (stableIds.has(record.stableId)) fail(`Duplicate stableId: ${record.stableId}`);
            databaseIds.add(record.databaseId);
            stableIds.add(record.stableId);
          }

          console.log(`Promoted canonical database PASS: ${index.recordCount} governed objects; ${fingerprint}`);
          console.log(`Validated by run ${promotion.validationRunId}; promoted by run ${promotion.promotedByRun}.`);
          NODE
