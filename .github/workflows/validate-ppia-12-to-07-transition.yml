name: Validate PPIA-12 to PPIA-07 Transition

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA_PROGRAM_BACKLOG.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-12_COMPLETION_REPORT.md'
      - 'governance/ai/work-state/PPIA-12-attempt-001.json'
      - 'governance/ai/work-state/PPIA-07-attempt-001.json'
      - 'governance/application-planning/parallel-preimplementation/validate_ppia_program.py'
      - 'scripts/validate-ppia05-to-ppia12-transition.py'
      - 'scripts/validate-ppia12-to-ppia07-transition.py'
      - '.github/workflows/validate-ppia-12-to-07-transition.yml'
  push:
    branches:
      - governance/ppia-12-to-ppia-07-transition
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA_PROGRAM_BACKLOG.json'
      - 'governance/application-planning/parallel-preimplementation/PPIA-12_COMPLETION_REPORT.md'
      - 'governance/ai/work-state/PPIA-12-attempt-001.json'
      - 'governance/ai/work-state/PPIA-07-attempt-001.json'
      - 'governance/application-planning/parallel-preimplementation/validate_ppia_program.py'
      - 'scripts/validate-ppia05-to-ppia12-transition.py'
      - 'scripts/validate-ppia12-to-ppia07-transition.py'
      - '.github/workflows/validate-ppia-12-to-07-transition.yml'

permissions:
  contents: read

jobs:
  validate-transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PPIA-12 completion and PPIA-07 transition
        run: python scripts/validate-ppia12-to-ppia07-transition.py
      - name: Validate preserved PPIA-05 to PPIA-12 transition
        run: python scripts/validate-ppia05-to-ppia12-transition.py
      - name: Validate generalized PPIA program continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program.py
