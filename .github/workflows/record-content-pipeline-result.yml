name: Record Content Pipeline Result

on:
  workflow_run:
    workflows: ['Certify Content Database Pipeline']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: record-content-pipeline-result
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CI evidence branch
        uses: actions/checkout@v4
        with:
          ref: ci/failure-records
          fetch-depth: 0

      - name: Capture certification result
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id || '' }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number || '' }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          RUN_URL: ${{ github.event.workflow_run.html_url || '' }}
          CREATED_AT: ${{ github.event.workflow_run.created_at || '' }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at || '' }}
        run: |
          set -u

          mkdir -p governance/ci-failures/content-pipeline governance/ci-failures/records
          jobs_json="$(mktemp)"
          trap 'rm -f "$jobs_json"' EXIT

          if [ "$EVENT_NAME" = 'workflow_dispatch' ] || [ -z "${RUN_ID:-}" ]; then
            RUN_ID="manual-${GITHUB_RUN_ID}"
            RUN_NUMBER="${GITHUB_RUN_NUMBER}"
            CONCLUSION="manual-recorder-check"
            HEAD_SHA="${GITHUB_SHA}"
            HEAD_BRANCH="${GITHUB_REF_NAME}"
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            UPDATED_AT="$CREATED_AT"
            printf '{"jobs":[]}' > "$jobs_json"
          elif ! gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" > "$jobs_json" 2>/tmp/content-recorder-api-error; then
            api_error="$(cat /tmp/content-recorder-api-error 2>/dev/null || true)"
            jq -n --arg error "$api_error" '{jobs:[], recorderApiError:$error}' > "$jobs_json"
          fi

          failed_steps="$(jq -r '.jobs[]? | .name as $job | .steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | "- **" + $job + " / " + .name + "** — " + (.conclusion // "unknown")' "$jobs_json" 2>/dev/null || true)"
          [ -n "$failed_steps" ] || failed_steps='- None reported.'

          jobs_summary="$(jq -r '.jobs[]? | "- **" + .name + "** — " + (.conclusion // .status // "unknown") + " (`" + (.id|tostring) + "`)"' "$jobs_json" 2>/dev/null || true)"
          [ -n "$jobs_summary" ] || jobs_summary='- No job metadata returned.'

          recorder_error="$(jq -r '.recorderApiError // empty' "$jobs_json" 2>/dev/null || true)"
          [ -n "$recorder_error" ] || recorder_error='None.'

          record="governance/ci-failures/content-pipeline/run-${RUN_ID}.md"
          {
            printf '# Content Pipeline Certification — Run %s\n\n' "$RUN_ID"
            printf '**Result:** %s  \n' "${CONCLUSION:-unknown}"
            printf '**Run number:** %s  \n' "${RUN_NUMBER:-unknown}"
            printf '**Branch:** `%s`  \n' "${HEAD_BRANCH:-unknown}"
            printf '**Commit:** `%s`  \n' "${HEAD_SHA:-unknown}"
            printf '**Created:** %s  \n' "${CREATED_AT:-unknown}"
            printf '**Updated:** %s  \n' "${UPDATED_AT:-unknown}"
            printf '**GitHub run:** %s\n\n' "${RUN_URL:-unavailable}"
            printf '## Jobs\n\n%s\n\n' "$jobs_summary"
            printf '## Failed steps\n\n%s\n\n' "$failed_steps"
            printf '## Recorder API error\n\n```text\n%s\n```\n' "$recorder_error"
          } > "$record"

          cp "$record" governance/ci-failures/content-pipeline/LATEST.md
          {
            printf '# GitHub Actions Failure Index\n\n'
            printf '**Status:** operational  \n'
            printf '**Repository:** `%s`  \n' "$REPOSITORY"
            printf '**Evidence branch:** `ci/failure-records`  \n'
            printf '**Last content certification result:** %s  \n' "${CONCLUSION:-unknown}"
            printf '**Last content certification run:** %s\n\n' "$RUN_ID"
            printf 'Before every governed operation, read this file first and inspect the newest unresolved failure record.\n\n'
            printf '## Content pipeline\n\n'
            printf -- '- [Latest content pipeline result](./content-pipeline/LATEST.md)\n\n'
            printf '## Recorded failures\n\n'
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              title="$(sed -n '1s/^# //p' "$file")"
              printf -- '- [%s](./records/%s)\n' "$title" "$(basename "$file")"
            done < <(find governance/ci-failures/records -type f -name 'run-*.md' 2>/dev/null | sort -r)
          } > governance/ci-failures/INDEX.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/ci-failures
          if git diff --cached --quiet; then
            echo 'Recorder completed; evidence is already current.'
            exit 0
          fi

          git commit -m "Record content certification run $RUN_ID (${CONCLUSION:-unknown})"
          git push origin HEAD:ci/failure-records
