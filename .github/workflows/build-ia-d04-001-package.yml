name: Build IA-D04-001 Package

on:
  push:
    branches:
      - governance/ia-d04-001-first-playable-action-approval-loop

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/ia-d04-001-first-playable-action-approval-loop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construct and validate package
        run: python .tmp/ia-d04-001/build_package.py
      - name: Remove construction files and commit
        run: |
          rm -rf .tmp/ia-d04-001 .github/workflows/build-ia-d04-001-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/application-planning/internal-alpha .github/workflows/first-playable-action-approval-validation.yml governance/ai/runtime/ROADMAP_INDEX.json .tmp/ia-d04-001 .github/workflows/build-ia-d04-001-package.yml
          git commit -m "Complete IA-D04-001 design package construction"
          git push origin HEAD:governance/ia-d04-001-first-playable-action-approval-loop

# Existing workflow revision triggers the one-shot constructor.
