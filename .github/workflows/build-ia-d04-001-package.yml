name: Build IA-D04-001 Package

on:
  pull_request:
    paths:
      - '.github/workflows/build-ia-d04-001-package.yml'
      - '.tmp/ia-d04-001/**'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/ia-d04-001-first-playable-action-approval-loop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construct and validate package
        run: python .tmp/ia-d04-001/build_package.py
      - name: Commit validated non-workflow artifacts
        run: |
          rm -rf .tmp/ia-d04-001 governance/application-planning/internal-alpha/__pycache__
          rm -f .github/workflows/first-playable-action-approval-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/application-planning/internal-alpha governance/ai/runtime/ROADMAP_INDEX.json .tmp/ia-d04-001
          git commit -m "Complete IA-D04-001 design package construction"
          git push origin HEAD:governance/ia-d04-001-first-playable-action-approval-loop
