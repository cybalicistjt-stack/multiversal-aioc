name: Validate P0 Mecha Promotion Readiness

on:
  pull_request:
    paths:
      - 'governance/object-system/csv-intake/P0_MECHA_PROMOTION_READINESS_CONTRACT.json'
      - 'scripts/evaluate-p0-mecha-promotion-readiness.py'
      - '.github/workflows/validate-p0-mecha-promotion-readiness.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate promotion readiness
        run: python scripts/evaluate-p0-mecha-promotion-readiness.py
      - uses: actions/upload-artifact@v4
        with:
          name: csv-p0-mecha-promotion-readiness-107
          path: build/csv-p0-mecha-promotion-readiness-l49/
