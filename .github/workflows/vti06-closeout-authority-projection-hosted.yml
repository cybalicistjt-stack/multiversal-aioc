name: VTI-06 Closeout Authority Projection Hosted

on:
  push:
    branches:
      - governance/vti-06-terminal-closeout-vti-07-selection

permissions:
  contents: write

jobs:
  project-authority:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/vti-06-terminal-closeout-vti-07-selection
          fetch-depth: 0
          persist-credentials: true
      - name: Project terminal authority state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('governance/ai/runtime/ACTIVE_AUTHORITY_REGISTRY.json')
          v6_path = Path('governance/ai/work-state/VTI-06-attempt-001.json')
          closeout_path = 'governance/application-planning/APPLICATION_IMPLEMENTATION_ROADMAP_VTI06_CLOSEOUT_2026-09-06.md'

          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          v6 = json.loads(v6_path.read_text(encoding='utf-8'))
          red = v6['validation']['acceptance_red']
          green = v6['validation']['final_green']
          merge = v6['application_merge_sha']

          registry['schema_version'] = '15.70.0'
          registry['updated_at'] = '2026-09-06T16:52:00-05:00'
          for entry in registry.get('current', []):
              if entry.get('kind') == 'checkpoint':
                  entry['path'] = 'governance/ai/work-state/VTI-07-attempt-001.json'
              elif entry.get('kind') == 'roadmap_supplement':
                  entry['path'] = closeout_path

          registry['active_planning_work'] = {
              'work_item': 'VTI-07',
              'attempt_id': 'VTI-07-attempt-001',
              'repository': 'cybalicistjt-stack/Multiversal-app',
              'state': 'selected_not_started',
              'implementation_branch': None,
              'implementation_authority': False,
              'application_baseline_sha': merge,
              'implementation_scope': 'VTI-07 is the strict successor selected_not_started from exact application main 1e325045b2fc65d067a5e587f8cde78dcba9f766. No branch, acceptance package, permission behavior or production mutation is authorized until a separate governed start validates and merges. Canonical Multiversal authorization, visibility, hidden-information and GM-authority decisions remain authoritative.'
          }

          completed = {
              'work_item_id': 'VTI-06',
              'status': 'completed_verified',
              'application_pr': v6['application_pr'],
              'validated_head': green['head_sha'],
              'validation_run': green['run_id'],
              'repository_health_job': green['repository_health_job'],
              'linux_job': green['linux_job'],
              'windows_job': green['windows_job'],
              'deterministic_compare_job': green['deterministic_compare_job'],
              'deterministic_receipt_sha256': green['deterministic_receipt_sha256'],
              'acceptance_red_head': red['head_sha'],
              'acceptance_red_run': red['run_id'],
              'acceptance_red_receipt_sha256': red['deterministic_receipt_sha256'],
              'historical_profile_fanout': green.get('historical_profile_fanout', 0),
              'application_feature_repair_cycles': v6['convergence_control'].get('application_feature_repair_cycles', 0),
              'validation_contract_repair_cycles': v6['convergence_control'].get('validation_contract_repair_cycles', 0),
              'repository_state_repair_cycles': v6['convergence_control'].get('repository_state_repair_cycles', 0),
              'merge_sha': merge,
          }
          history = [item for item in registry.get('recently_completed_implementation_work', []) if item.get('work_item_id') != 'VTI-06']
          registry['recently_completed_implementation_work'] = [completed] + history

          for program in registry.get('planned_programs', []):
              if program.get('program') == 'VTI':
                  program.update({
                      'state': 'in_progress',
                      'completed_through': 'VTI-06',
                      'current': 'VTI-07',
                      'current_state': 'selected_not_started',
                      'implementation_authority': False,
                      'implementation_branch': None,
                      'application_baseline_sha': merge,
                  })

          registry['rule'] = 'Only registered CURRENT or CURRENT_COMPATIBLE surfaces may govern. VTI-06 is completed_verified and retired after application PR #435 merged as 1e325045b2fc65d067a5e587f8cde78dcba9f766 following exact-head final GREEN. VTI-07 is selected_not_started from that exact application main with no branch, acceptance-package, implementation or production authority; VTI-08+ and SGC-01+ remain unauthorized.'

          a6 = registry['vti_06_authority']
          a6.update({
              'selected_not_started': False,
              'implementation_authority': False,
              'retired': True,
              'application_merge_sha': merge,
              'branch_creation_authorized': False,
              'acceptance_package_authorized': False,
              'production_mutation_authorized': False,
              'scene_map_token_mai_bridge_authorized': False,
              'matching_red_observed': True,
              'matching_red_head': red['head_sha'],
              'matching_red_run': red['run_id'],
              'matching_red_receipt_sha256': red['deterministic_receipt_sha256'],
              'validated_head': green['head_sha'],
              'validation_run': green['run_id'],
              'deterministic_receipt_sha256': green['deterministic_receipt_sha256'],
              'vti07_plus_authorized': False,
          })

          registry['vti_07_authority'] = {
              'selected_not_started': True,
              'implementation_authority': False,
              'retired': False,
              'implementation_branch': None,
              'application_baseline_sha': merge,
              'branch_creation_authorized': False,
              'acceptance_package_authorized': False,
              'production_mutation_authorized': False,
              'permissions_hidden_information_gm_authority_authorized': False,
              'provider_specific_schema_authorized': False,
              'credential_use_authorized': False,
              'external_account_mutation_authorized': False,
              'adapter_implementation_authorized': False,
              'external_sync_mutation_authorized': False,
              'canonical_game_state_mutation_authorized': False,
              'hidden_information_bypass_authorized': False,
              'durable_vti_persistence_authorized': False,
              'new_migration_authorized': False,
              'provider_activation_authorized': False,
              'tester_distribution_authorized': False,
              'release_or_deployment_authorized': False,
              'vti08_plus_authorized': False,
              'sgc01_plus_authorized': False,
          }

          registry_path.write_text(json.dumps(registry, separators=(',', ':')), encoding='utf-8')
          PY

          git config user.name 'multiversal-governance-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/ai/runtime/ACTIVE_AUTHORITY_REGISTRY.json
          git rm .github/workflows/vti06-closeout-authority-projection-hosted.yml
          git commit -m 'VTI-06 closeout: retire authority and select VTI-07'
          git push origin HEAD:governance/vti-06-terminal-closeout-vti-07-selection
