name: Apply CAPP Roadmap Index
on:
  push:
    branches: [governance/capp-01-appearance-choice-registry]
    paths: ['.github/workflows/apply-capp-roadmap-index.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/capp-01-appearance-choice-registry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync-capp-roadmap-index.py
      - run: python scripts/sync-capp-roadmap-index.py --check
      - name: Commit index
        run: |
          rm .github/workflows/apply-capp-roadmap-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Index CAPP roadmap work items'
          git push origin HEAD:governance/capp-01-appearance-choice-registry
