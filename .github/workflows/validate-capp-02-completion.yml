name: Validate CAPP-02 Completion

on:
  pull_request:
    paths:
      - 'governance/application-planning/character-appearance-production/CAPP-02_*'
      - 'governance/application-planning/character-appearance-production/CAPP_PROGRAM_BACKLOG.json'
      - 'governance/ai/runtime/CURRENT_WORK_POINTER.json'
      - 'governance/ai/runtime/CURRENT_IMPLEMENTATION_STATUS.json'
      - 'governance/ai/work-state/CAPP-02-attempt-001.json'
      - 'tools/capp02_randomization_reference.py'
      - 'scripts/validate-capp02-completion.py'
      - '.github/workflows/validate-capp-02-completion.yml'
  push:
    branches:
      - governance/capp-02-preset-randomization-locks

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CAPP-02 completion candidate
        run: python scripts/validate-capp02-completion.py
