name: Validate P0 Mecha Concrete Records

on:
  pull_request:
    paths:
      - 'governance/object-system/csv-intake/P0_MECHA_CONCRETE_RECORD_CONTRACT.json'
      - 'scripts/generate-p0-mecha-concrete-records.py'
      - '.github/workflows/validate-p0-mecha-concrete-records.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate concrete representative records
        run: python scripts/generate-p0-mecha-concrete-records.py
      - uses: actions/upload-artifact@v4
        with:
          name: csv-p0-mecha-concrete-records-3
          path: build/csv-p0-mecha-concrete-records-l47/
