name: Validate P9-03 Technology Service Package
on:
  pull_request:
    paths:
      - 'governance/phase9/P9-03_*'
      - 'scripts/validate-p9-03-technology-service-package.py'
      - '.github/workflows/validate-p9-03-technology-service-package.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-p9-03-technology-service-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: p9-03-technology-service-validation
          path: out/p9-03-technology-service/P9-03_VALIDATION.json
