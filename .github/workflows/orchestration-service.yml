name: orchestration-service

on:
  push:
    branches:
      - governance/session-bootstrap-v1
    paths:
      - 'implementation/executive-dashboard/orchestration/**'
      - '.github/workflows/orchestration-service.yml'
  pull_request:
    paths:
      - 'implementation/executive-dashboard/orchestration/**'
      - '.github/workflows/orchestration-service.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check module syntax
        run: node --check implementation/executive-dashboard/orchestration/orchestration-service.mjs
      - name: Run orchestration acceptance tests
        run: node implementation/executive-dashboard/orchestration/orchestration-service.test.mjs
