name: Validate 8D-008 AI Team Operating Package

on:
  pull_request:
    paths:
      - 'governance/ai-team/**'
      - 'scripts/validate-8d-008-team-operating-package.py'
      - '.github/workflows/validate-8d-008-team-operating-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate governed operating package
        run: python scripts/validate-8d-008-team-operating-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: 8d-008-team-operating-package-validation
          path: out/8d-008-team-operating-package/validation-report.json
