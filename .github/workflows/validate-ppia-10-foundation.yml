name: Validate PPIA-10 Foundation

on:
  pull_request:
    paths:
      - 'governance/application-planning/parallel-preimplementation/PPIA-10_*'
      - 'governance/ai/work-state/PPIA-10-attempt-001.json'
      - 'governance/ai/runtime/CURRENT_WORK_POINTER.json'
      - 'governance/ai/runtime/CURRENT_IMPLEMENTATION_STATUS.json'
      - 'scripts/validate-ppia10-foundation.py'
      - '.github/workflows/validate-ppia-10-foundation.yml'
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F009_*'
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F010_*'
      - 'governance/application-planning/internal-alpha/feature-packets/MV-IA-F016_*'
  workflow_dispatch:

jobs:
  validate-ppia10-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PPIA-10 foundation
        run: python scripts/validate-ppia10-foundation.py
      - name: Validate F009 relationship regression
        run: python governance/application-planning/internal-alpha/validate_relationship_tracker.py
      - name: Validate F010 social regression
        run: python governance/application-planning/internal-alpha/validate_social_interaction_mode.py
      - name: Validate F016 faction regression
        run: python governance/application-planning/internal-alpha/validate_factions_reputation_organizations.py
      - name: Validate PPIA-09 to PPIA-10 transition regression
        run: python scripts/validate-ppia09-to-ppia10-transition.py
      - name: Validate generalized PPIA continuity
        run: python governance/application-planning/parallel-preimplementation/validate_ppia_program.py
      - name: Validate conversation continuity
        run: python tools/continuity_state.py validate
