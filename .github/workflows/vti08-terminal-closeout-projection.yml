          idx.update({'updated_at':NOW,'rule':'VTI-08 is completed_verified and retired; VTI-09 is selected_not_started with no implementation authority.'})
          idx['current']={'work_item_id':'VTI-09','attempt_id':'VTI-09-attempt-001','source_program':'VTI','status':'selected_not_started','repository':'cybalicistjt-stack/Multiversal-app','checkpoint':'governance/ai/work-state/VTI-09-attempt-001.json','implementation_branch':None,'implementation_authority':False,'acceptance_package_authorized':False,'production_mutation_authorized':False,'matching_red_observed':False,'application_baseline_sha':APP_MERGE}
          recent=idx.get('recently_completed',{}); idx['recently_completed']={'VTI-08':dict(completion),**{k:v for k,v in recent.items() if k in ('VTI-07','VTI-06')}}
          idx['selected_vti'].update({'completed_through':'VTI-08','current':'VTI-09','current_state':'selected_not_started','implementation_authority':False,'implementation_branch':None,'application_baseline_sha':APP_MERGE,'strict_next':'VTI-10'})
          idx['mib_sequence']['effective_successor']='VTI-09'; idx['effective_forward_order']='VTI-09..12 → SGC-01..08 → MIB-16 → MIB-17 → MIB-18 → SMB-01..16 → BRP-01..11 → SMB-17 → SMB-18'
          idx['boundaries']=b['boundaries']
