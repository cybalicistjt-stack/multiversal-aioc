            'work_item_id':'VTI-08','status':'completed_verified','application_pr':437,
            'acceptance_red_head':'420dced5ba3daf982d80a5b6cf141d2bdb4376bd','acceptance_red_run':34066821411,
            'acceptance_red_receipt_sha256':'45e107c94e4cf57ae3e360cf1e89b043c8dc79d60f95362afed9a52458fb0bc2',
            'validated_head':GREEN_HEAD,'validation_run':GREEN_RUN,'repository_health_job':HEALTH,
