          bpath=Path('governance/application-planning/virtual-tabletop-interoperability/VTI_PROGRAM_BACKLOG.json'); b=load(bpath)
          b.update({'completed_through':'VTI-08','current_item':'VTI-09','current_attempt':'VTI-09-attempt-001','application_baseline_sha':APP_MERGE})
          t8=next(x for x in b['tranches'] if x['id']=='VTI-08'); t8.update({'status':'completed_verified','implementation_authority':False,'branch_creation_authorized':False,'acceptance_package_authorized':False,'production_mutation_authorized':False,'matching_red_observed':True,'application_merge_sha':APP_MERGE})
          t9=next(x for x in b['tranches'] if x['id']=='VTI-09'); t9.update({'status':'selected_not_started','implementation_authority':False,'implementation_branch':None,'application_baseline_sha':APP_MERGE,'checkpoint':'governance/ai/work-state/VTI-09-attempt-001.json','branch_creation_authorized':False,'acceptance_package_authorized':False,'production_mutation_authorized':False,'matching_red_observed':False})
