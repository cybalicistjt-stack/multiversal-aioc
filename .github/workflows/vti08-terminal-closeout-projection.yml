          rt['application_repository'].update({'canonical_main':APP_MERGE,'active_validation_family_state':'VTI01_VTI02_VTI03_VTI04_VTI05_VTI06_VTI07_VTI08_completed_VTI09_selected_not_started','sealed_predecessor_baseline':APP_MERGE})
          rt['active_work']={'work_item':'VTI-09','attempt_id':'VTI-09-attempt-001','repository':'cybalicistjt-stack/Multiversal-app','state':'selected_not_started','role':'selected_successor','implementation_branch':None,'implementation_authority':False,'acceptance_package_authorized':False,'production_mutation_authorized':False,'matching_red_observed':False,'execution_rule':'On the next owner Continue, governed-start VTI-09 before application branch creation.'}
          rt['recently_completed_product_work']={**completion,'application_merge':APP_MERGE}
          rt['mib_sequence']['effective_successor']='VTI-09'; rt['effective_forward_order']='VTI-09..12 → SGC-01..08 → MIB-16 → MIB-17 → MIB-18 → SMB-01..16 → BRP-01..11 → SMB-17 → SMB-18'
          rt['boundaries']=b['boundaries']; rt['selected_vti'].update({'completed_through':'VTI-08','current':'VTI-09','current_state':'selected_not_started','implementation_authority':False,'implementation_branch':None,'application_baseline_sha':APP_MERGE,'strict_next':'VTI-10'})
          save(rpath,rt)

          apath=Path('governance/ai/runtime/ACTIVE_AUTHORITY_REGISTRY.json'); ar=load(apath)
          ar.update({'updated_at':NOW})
          for row in ar.get('current',[]):
            if row.get('kind')=='checkpoint': row['path']='governance/ai/work-state/VTI-09-attempt-001.json'
            if row.get('kind')=='roadmap_supplement': row['path']=CLOSEOUT
          ar['active_planning_work']={'work_item':'VTI-09','attempt_id':'VTI-09-attempt-001','repository':'cybalicjt-stack/Multiversal-app'.replace('cybalicjt','cybalicistjt'),'state':'selected_not_started','implementation_branch':None,'implementation_authority':False,'application_baseline_sha':APP_MERGE,'implementation_scope':'Successor selected only; governed start is required before provider selection, branch creation or implementation.'}
          ar['recently_completed_implementation_work']=[dict(completion)]+ar.get('recently_completed_implementation_work',[])[:6]
          a8=ar['vti_08_authority']; a8.update({'selected_not_started':False,'retired':True,'implementation_authority':False,'branch_creation_authorized':False,'acceptance_package_authorized':False,'production_mutation_authorized':False,'adapter_sdk_capability_manifest_reference_vtt_authorized':False,'matching_red_observed':True,'application_pr':437,'validated_head':GREEN_HEAD,'validation_run':GREEN_RUN,'repository_health_job':HEALTH,'linux_job':LINUX,'windows_job':WINDOWS,'deterministic_compare_job':COMPARE,'deterministic_receipt_sha256':RECEIPT,'application_merge_sha':APP_MERGE})
          ar['vti_09_authority']={'selected_not_started':True,'retired':False,'implementation_authority':False,'branch_creation_authorized':False,'acceptance_package_authorized':False,'production_mutation_authorized':False,'first_full_platform_integration_authorized':False,'matching_red_observed':False,'provider_selection_authorized':False,'provider_specific_schema_authorized':False,'credential_or_external_account_mutation_authorized':False,'live_external_or_canonical_mutation_authorized':False,'durable_persistence_or_migration_authorized':False,'provider_activation_authorized':False,'tester_distribution_authorized':False,'release_or_deployment_authorized':False,'vti10_plus_authorized':False,'sgc01_plus_authorized':False,'implementation_branch':None,'application_baseline_sha':APP_MERGE,'checkpoint':'governance/ai/work-state/VTI-09-attempt-001.json'}
          save(apath,ar)

          closeout=f'''# VTI-08 Terminal Closeout and VTI-09 Selection\n\n**VTI-08 state:** `completed_verified` and retired.  \n**Application PR:** #437  \n**Validated head:** `{GREEN_HEAD}`  \n**Validation run:** `{GREEN_RUN}`  \n**Repository health:** `{HEALTH}`  \n**Linux:** `{LINUX}`  \n**Windows:** `{WINDOWS}`  \n**Deterministic comparison:** `{COMPARE}`  \n**Deterministic receipt:** `{RECEIPT}`  \n**Historical profile fanout:** `0`  \n**Application merge:** `{APP_MERGE}`\n\nThe completed VTI-08 contract is the provider-neutral adapter SDK/capability manifest/deterministic reference-VTT seam. Multiversal remains canonical authority; provider selection, commercial provider schema, credentials/accounts, network/live mutation, durable persistence/migration, provider activation, tester distribution and release/deployment were not introduced.\n\n## Strict successor\n\nVTI-09 — First Full Platform Integration — is `selected_not_started` from exact application main `{APP_MERGE}`. No application branch or implementation authority is open. The next owner `Continue` must first perform and merge the VTI-09 governed-start transaction; only then may evidence-driven first-platform selection and bounded implementation begin. VTI-10+ and SGC-01+ remain unauthorized.\n'''
          (ROOT/CLOSEOUT).write_text(closeout,encoding='utf-8')

          prog_path=Path('governance/application-planning/virtual-tabletop-interoperability/VTI_VIRTUAL_TABLETOP_INTEROPERABILITY_PROGRAM.md'); prog=prog_path.read_text(encoding='utf-8')
          prog=prog.replace('**Status:** OWNER-APPROVED — VTI-01 THROUGH VTI-07 COMPLETED_VERIFIED; VTI-08 IN_PROGRESS — ACCEPTANCE-ONLY UNTIL MATCHING RED','**Status:** OWNER-APPROVED — VTI-01 THROUGH VTI-08 COMPLETED_VERIFIED; VTI-09 SELECTED_NOT_STARTED')
          prog=re.sub(r'VTI-08 — Adapter SDK, Capability Manifest & Deterministic Reference VTT — is `in_progress` acceptance-only.*?sealed\.', 'VTI-08 — Adapter SDK, Capability Manifest & Deterministic Reference VTT — is `completed_verified` and retired after application PR #437 merged as `'+APP_MERGE+'` from exact validated head `'+GREEN_HEAD+'` / run `'+str(GREEN_RUN)+'` with deterministic receipt `'+RECEIPT+'`. VTI-09 — First Full Platform Integration — is `selected_not_started` from that exact application main with no branch or implementation authority.', prog, count=1, flags=re.S)
          prog=prog.replace('8. **VTI-08 — Adapter SDK, Capability Manifest & Deterministic Reference VTT** — **IN_PROGRESS — ACCEPTANCE-ONLY UNTIL MATCHING RED**.', '8. **VTI-08 — Adapter SDK, Capability Manifest & Deterministic Reference VTT** — **COMPLETED_VERIFIED**.')
          prog=prog.replace('9. **VTI-09 — First Full Platform Integration**  ', '9. **VTI-09 — First Full Platform Integration** — **SELECTED_NOT_STARTED**  ')
          marker='## Invariants\n'
          completed='''## VTI-08 completed contract\n\nVTI-08 established a bounded provider-neutral adapter SDK, explicit supported/unsupported/conditional/unknown capability manifest and deterministic reference VTT that consumes completed VTI contracts as a derivative test client. Capability gaps fail closed; authoritative VTI-04 receipts are replayed without duplicate resolution; VTI-07 safe presentation is only passed through or further suppressed. No commercial provider was selected and no provider schema, credentials/accounts, provider network access, live mutation, durable persistence/migration, provider activation, tester distribution or release/deployment was introduced.\n\nSealed completion evidence:\n- acceptance RED head `420dced5ba3daf982d80a5b6cf141d2bdb4376bd`, run `34066821411`, receipt `45e107c94e4cf57ae3e360cf1e89b043c8dc79d60f95362afed9a52458fb0bc2`;\n- final GREEN head `'''+GREEN_HEAD+'`, run `'+str(GREEN_RUN)+''+'`, repository-health job `'''+str(HEALTH)+'`, Linux job `'+str(LINUX)+'`, Windows job `'+str(WINDOWS)+'`, comparator job `'+str(COMPARE)+'`, receipt `'+RECEIPT+''+'`;\n- application PR #437 merge `'''+APP_MERGE+'''`;\n- historical profile fanout `0` and application-feature repair cycles `0`.\n\n'''
          if '## VTI-08 completed contract' not in prog: prog=prog.replace(marker,completed+marker)
          prog_path.write_text(prog,encoding='utf-8')

          # Lifecycle-aware predecessor/current tests.
          path=Path('tests/control_plane/test_vti08_red_unlock.py'); s=path.read_text(encoding='utf-8')
          old='''        self.assertTrue(cp["production_mutation_authorized"])\n        self.assertTrue(backlog["active_contract"]["production_mutation_authorized"])\n        self.assertTrue(backlog["active_contract"]["matching_red_observed"])\n        self.assertTrue(pointer["bounded_authority"]["production_mutation_authorized"])\n        self.assertTrue(pointer["bounded_authority"]["matching_red_observed"])\n        self.assertTrue(index["current"]["production_mutation_authorized"])\n        self.assertTrue(index["current"]["matching_red_observed"])\n        self.assertTrue(runtime["active_work"]["production_mutation_authorized"])\n        self.assertTrue(runtime["active_work"]["matching_red_observed"])\n        auth=registry["vti_08_authority"]\n        self.assertTrue(auth["production_mutation_authorized"])\n        self.assertTrue(auth["adapter_sdk_capability_manifest_reference_vtt_authorized"])\n        self.assertTrue(auth["matching_red_observed"])'''
          new='''        auth=registry["vti_08_authority"]\n        self.assertTrue(auth["matching_red_observed"])\n        if cp["status"] == "completed_verified":\n            self.assertTrue(cp["authority_retired"])\n            self.assertFalse(cp["production_mutation_authorized"])\n            self.assertFalse(auth["production_mutation_authorized"])\n            self.assertFalse(auth["adapter_sdk_capability_manifest_reference_vtt_authorized"])\n            self.assertEqual(pointer["active_attempt"]["work_item_id"], "VTI-09")\n        else:\n            self.assertTrue(cp["production_mutation_authorized"])\n            self.assertTrue(backlog["active_contract"]["production_mutation_authorized"])\n            self.assertTrue(pointer["bounded_authority"]["production_mutation_authorized"])\n            self.assertTrue(index["current"]["production_mutation_authorized"])\n            self.assertTrue(runtime["active_work"]["production_mutation_authorized"])\n            self.assertTrue(auth["production_mutation_authorized"])\n            self.assertTrue(auth["adapter_sdk_capability_manifest_reference_vtt_authorized"])'''
          if old not in s: raise SystemExit('red unlock replacement marker missing')
          path.write_text(s.replace(old,new),encoding='utf-8')

          path=Path('tests/control_plane/test_vti08_adapter_sdk_capability_manifest_reference_vtt_registration.py'); s=path.read_text(encoding='utf-8')
          s=s.replace('        self.assertEqual(runtime["application_repository"]["canonical_main"], baseline)\n', '        expected_main = "69bc17bf5999e5cd704d7ec4d8aaa7b168db740c" if checkpoint["status"] == "completed_verified" else baseline\n        self.assertEqual(runtime["application_repository"]["canonical_main"], expected_main)\n')
          path.write_text(s,encoding='utf-8')

          for name in ['tests/control_plane/test_vti07_terminal_closeout.py','tests/control_plane/test_vti07_permissions_hidden_gm_registration.py']:
            path=Path(name); s=path.read_text(encoding='utf-8')
            s=s.replace('        self.assertEqual(runtime["application_repository"]["canonical_main"],"692da4f4792426b9c62f6be14db60fc63eb09d6b")\n','        expected_main = "69bc17bf5999e5cd704d7ec4d8aaa7b168db740c" if nxt["status"] == "completed_verified" else "692da4f4792426b9c62f6be14db60fc63eb09d6b"\n        self.assertEqual(runtime["application_repository"]["canonical_main"], expected_main)\n')
