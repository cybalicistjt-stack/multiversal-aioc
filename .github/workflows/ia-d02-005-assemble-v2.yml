name: Assemble IA-D02-005 Verified Payload

on:
  pull_request:
    branches:
      - main
    paths:
      - governance/application-planning/internal-alpha/.assembly/**
      - .github/workflows/ia-d02-005-assemble-v2.yml

permissions:
  contents: write

jobs:
  assemble:
    if: github.head_ref == 'governance/mv-ia-d02-005-onboarding-help-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/mv-ia-d02-005-onboarding-help-diagnostics
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble, validate, clean, and push IA-D02-005
        run: python governance/application-planning/internal-alpha/.assembly/assemble_ia_d02_005_v2.py
