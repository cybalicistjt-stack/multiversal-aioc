name: Validate Development Brain Safe Plan Proposals

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate-safe-plan-proposals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run populated behavioral acceptance corpus
        run: node scripts/development-brain/test-safe-plan-acceptance.mjs
      - name: Generate published safe plan artifact from acceptance corpus
        run: node scripts/development-brain/generate-safe-plan-proposals.mjs governance/development-brain/acceptance/fixtures/step19-review-corpus.json /tmp/safe-plans.json
      - name: Validate published safe plan artifact
        run: node scripts/development-brain/validate-safe-plan-proposals.mjs /tmp/safe-plans.json
      - name: Upload safe plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: aioc-safe-plan-proposals
          path: /tmp/safe-plans.json
