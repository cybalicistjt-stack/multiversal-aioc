name: content-pack-certification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check module syntax
        run: node --check implementation/content-studio/content-pack-certification.mjs
      - name: Run content pack certification tests
        run: node implementation/content-studio/content-pack-certification.test.mjs
