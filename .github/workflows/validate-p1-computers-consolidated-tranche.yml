name: Validate P1 Computers Consolidated Tranche

on:
  pull_request:
    paths:
      - "governance/object-system/csv-intake/P1_COMPUTERS_CONSOLIDATED_TRANCHE_CONTRACT.json"
      - "scripts/run-p1-computers-consolidated-tranche.py"
      - ".github/workflows/validate-p1-computers-consolidated-tranche.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run consolidated computers tranche
        run: python scripts/run-p1-computers-consolidated-tranche.py
      - uses: actions/upload-artifact@v4
        with:
          name: csv-p1-computers-consolidated-tranche-1000
          path: build/csv-p1-computers-consolidated-tranche-l54/
