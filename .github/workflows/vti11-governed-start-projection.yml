name: VTI-11 Governed Start Projection
on:
  push:
    branches:
      - governance/vti-11-governed-start
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/vti-11-governed-start
          fetch-depth: 0
      - name: Project bounded VTI-11 governed-start state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, json, pathlib, re
          ROOT = pathlib.Path('.')
          NOW = '2026-09-08T03:27:00-05:00'
          BASE = '145eee04181b9ed66cae887ea6830da111918c25'
          BRANCH = 'integration/vti-11-adventure-campaign-package-export'
          RED_HEAD = 'e07bb429d5279f4819223152d0d61a4bce1154ec'
          RED_RUN = 34204525189
          RED_JOB = 101990801135
          RED_ARTIFACT = 10047180291
          RED_ARTIFACT_SHA = '0891fe6a900d933f1045514d09c4b839e0bd966cd36c8edf1018703a615da628'
          SUP = 'governance/application-planning/APPLICATION_IMPLEMENTATION_ROADMAP_VTI11_GOVERNED_START_2026-09-08.md'

          def load(path):
              return json.loads((ROOT/path).read_text(encoding='utf-8'))
          def save(path, obj):
              (ROOT/path).write_text(json.dumps(obj, separators=(',', ':')) + '\n', encoding='utf-8')

          cp_path = pathlib.Path('governance/ai/work-state/VTI-11-attempt-001.json')
          cp = load(cp_path)
          cp.update({
              'schema_version':'0.2.0','status':'in_progress','started_at':NOW,
              'implementation_branch':BRANCH,'implementation_authority':True,
              'branch_creation_authorized':True,'acceptance_package_authorized':True,
              'production_mutation_authorized':False,'application_baseline_sha':BASE,
              'application_pr':None,'completed':False,
          })
          cp['selection_boundaries'] = [
              'VTI-10 is completed_verified and retired after exact application merge 145eee04181b9ed66cae887ea6830da111918c25.',
              f'VTI-11 is in_progress from that exact application main on the registered branch {BRANCH}.',
              'Only branch creation, bounded implementation scaffolding and acceptance-package authority are open until a genuine matching VTI-11 self-hosted Linux/Windows RED is sealed.',
              'Production package-export behavior remains unauthorized before matching RED.',
              'Provider credentials/accounts, live provider network access, live external/canonical mutation, durable VTI persistence/new migration, provider activation, tester distribution, package publication and release/deployment remain unauthorized.',
              'ARI/SAA remain owner-approved planning only, P3D remains deferred, and VTI-12+/SGC-01+ remain unauthorized.'
          ]
          cp['convergence_control']['owner_continue_count'] = 1
          cp['convergence_control']['execution_cycles'] = 1
          cp['convergence_control']['repair_cycles'] = 0
          cp['convergence_control']['application_feature_repair_cycles'] = 0
          cp['convergence_control']['validation_contract_repair_cycles'] = 0
          cp['convergence_control']['repository_state_repair_cycles'] = 0
          cp['convergence_control']['no_progress_cycles'] = 0
          cp['convergence_control']['diagnostic_mode'] = False
          cp['convergence_control']['last_failure_signature'] = 'Governed-start control-plane RED observed exactly because VTI-11 remained selected_not_started.'
          cp['convergence_control']['last_failure_class'] = 'expected_governed_start_red'
          cp['convergence_control']['diagnostic_hypotheses'] = []
          cp['convergence_control']['retry_basis'] = {'changed_since_previous':[
              f'Exact governed-start RED observed at {RED_HEAD} in run {RED_RUN}, job {RED_JOB}.',
              'Canonical authority/lifecycle/sealed-proof validation passed before the single expected VTI-11 lifecycle regression failed.',
              'Current state is now projected to acceptance-only in_progress authority; production remains locked.'
          ]}
          cp['authority_boundary'] = {
              'vti12_plus_authorized':False,'sgc01_plus_authorized':False,
              'provider_activation_authorized':False,'tester_distribution_authorized':False,
              'release_or_deployment_authorized':False
          }
          cp['implementation_scope'] = {
              'authorized':[
                  'acceptance scaffolding for deterministic adventure/campaign package manifests',
                  'acceptance scaffolding for maps/scenes, encounters, creatures/NPCs, tokens, journals/handouts, treasure/items, roll tables, environments and other explicitly permitted content',
                  'capability-ceiling and fidelity handling derived from completed VTI-08 through VTI-10 semantics',
                  'preservation of canonical source/version identity, visibility, ownership, consent, hidden-information filtering and GM authority from completed VTI-02 through VTI-07 contracts',
                  'deterministic package normalization, transcript and receipt evidence'
              ],
              'not_authorized':[
                  'production package-export implementation before sealed matching RED',
                  'provider credentials/accounts or live provider network access',
                  'live external synchronization mutation or canonical game-state mutation',
                  'durable VTI persistence or new migration',
                  'provider activation, tester distribution, actual package publication/upload/distribution, release or deployment',
                  'VTI-12+ or SGC-01+ implementation'
              ]
          }
          cp['next_action'] = 'Create the registered VTI-11 application branch from exact main and land acceptance-only tests/docs/profile/verifier. Production remains unauthorized until a genuine matching self-hosted Linux/Windows RED is sealed.'
          save(cp_path, cp)

          p_path = pathlib.Path('governance/ai/runtime/CURRENT_WORK_POINTER.json')
          p = load(p_path)
          p['schema_version'] = '15.93.0'; p['updated_at'] = NOW; p['roadmap_supplements'] = [SUP]
          p['selection_reason'] = 'VTI-11 governed-start RED was observed on exact AIOC state; acceptance-only authority is now opened from exact application main.'
          aa = p['active_attempt']
          aa.update({'work_item_id':'VTI-11','attempt_id':'VTI-11-attempt-001','status':'in_progress','implementation_branch':BRANCH,'implementation_authority':True,'application_baseline_sha':BASE,'application_pr':None})
          p['active_program'].update({'completed_through':'VTI-10','current':'VTI-11','strict_next':'VTI-12','last':'VTI-12'})
          ba = p['bounded_authority']
          ba.update({'repository_health_maintenance':False,'vti_implementation':True,'vti_work_item':'VTI-11','vti_branch':BRANCH,'acceptance_package_authorized':True,'production_mutation_authorized':False,'matching_red_observed':False,'tester_distribution':False,'release_or_deployment':False,'paid_provider_activation':False,'vti_scope':'VTI-11 acceptance-only governed start. Branch creation and acceptance scaffolding are open; production/provider/live/persistence/publication/release boundaries remain closed.'})
          p['selection_invariants'] = cp['selection_boundaries']
          p['exact_next_action'] = cp['next_action']
          save(p_path, p)

          r_path = pathlib.Path('governance/ai/runtime/ROADMAP_INDEX.json')
          r = load(r_path)
          r['schema_version'] = '15.63.0'; r['updated_at'] = NOW
          r['rule'] = 'VTI-10 is completed_verified and retired; VTI-11 is in_progress under acceptance-only governed-start authority. ARI/SAA remain planning only and P3D remains deferred.'
          r['current'].update({'work_item_id':'VTI-11','attempt_id':'VTI-11-attempt-001','status':'in_progress','implementation_branch':BRANCH,'implementation_authority':True,'acceptance_package_authorized':True,'production_mutation_authorized':False,'matching_red_observed':False,'application_baseline_sha':BASE,'application_pr':None})
          r['selected_vti'].update({'status':'in_progress','completed_through':'VTI-10','current':'VTI-11','current_state':'in_progress','implementation_authority':True,'implementation_branch':BRANCH,'application_baseline_sha':BASE,'strict_next':'VTI-12','last':'VTI-12'})
          r['boundaries'] = cp['selection_boundaries']
          save(r_path, r)

          a_path = pathlib.Path('governance/ai/runtime/ACTIVE_AUTHORITY_REGISTRY.json')
          a = load(a_path)
          a['schema_version'] = '15.78.0'; a['updated_at'] = NOW
          for entry in a.get('current', []):
              if entry.get('kind') == 'roadmap_supplement': entry['path'] = SUP
          apw = a['active_planning_work']
          apw.update({'work_item':'VTI-11','attempt_id':'VTI-11-attempt-001','repository':'cybalicjt-stack/Multiversal-app' if False else 'cybalicistjt-stack/Multiversal-app','state':'in_progress','implementation_branch':BRANCH,'implementation_authority':True,'application_baseline_sha':BASE,'implementation_scope':'Acceptance-only adventure/campaign package export scaffolding; production remains locked pending matching RED.'})
          auth = a.setdefault('vti_11_authority', {})
          auth.update({'work_item':'VTI-11','attempt_id':'VTI-11-attempt-001','selected_not_started':False,'in_progress':True,'retired':False,'implementation_branch':BRANCH,'implementation_authority':True,'branch_creation_authorized':True,'acceptance_package_authorized':True,'production_mutation_authorized':False,'matching_red_observed':False,'application_baseline_sha':BASE,'provider_activation_authorized':False,'tester_distribution_authorized':False,'release_or_deployment_authorized':False,'vti12_plus_authorized':False,'sgc01_plus_authorized':False})
          save(a_path, a)

          b_path = pathlib.Path('governance/application-planning/virtual-tabletop-interoperability/VTI_PROGRAM_BACKLOG.json')
          b = load(b_path)
          b['schema_version'] = '0.28.0'; b['completed_through'] = 'VTI-10'; b['current_item'] = 'VTI-11'; b['current_attempt'] = 'VTI-11-attempt-001'; b['application_baseline_sha'] = BASE
          for t in b['tranches']:
              if t['id'] == 'VTI-11':
                  t.update({'status':'in_progress','attempt_id':'VTI-11-attempt-001','implementation_branch':BRANCH,'implementation_authority':True,'branch_creation_authorized':True,'acceptance_package_authorized':True,'production_mutation_authorized':False,'matching_red_observed':False,'application_baseline_sha':BASE})
          b['active_contract'].update({'work_item':'VTI-11','attempt_id':'VTI-11-attempt-001','status':'in_progress','checkpoint_path':'governance/ai/work-state/VTI-11-attempt-001.json','implementation_branch':BRANCH,'implementation_authority':True,'branch_creation_authorized':True,'acceptance_package_authorized':True,'production_mutation_authorized':False,'matching_red_observed':False,'application_baseline_sha':BASE,'rule':'Acceptance-only governed start; production package-export behavior remains locked until genuine matching self-hosted Linux/Windows RED.'})
          b['boundaries'] = cp['selection_boundaries']
          save(b_path, b)

          rt_path = pathlib.Path('governance/repository-health/RUNTIME_STATE_LIFECYCLE_REGISTRY.json')
          rt = load(rt_path)
          rt['schema_version'] = '12.74.0'; rt['updated_at'] = NOW
          rt['canonical_selector']['rule'] = 'CURRENT_WORK_POINTER selects VTI-11 in_progress with acceptance-only authority; VTI-10 remains completed_verified and retired.'
          rt['work_state'].update({'selected_checkpoint':'governance/ai/work-state/VTI-11-attempt-001.json','selected_checkpoint_role':'in_progress'})
          rt['application_repository'].update({'canonical_main':BASE,'active_validation_family':'VTI','active_validation_family_state':'VTI01_VTI02_VTI03_VTI04_VTI05_VTI06_VTI07_VTI08_VTI09_VTI10_completed_VTI11_in_progress','sealed_predecessor_baseline':BASE})
          rt['active_work'].update({'work_item':'VTI-11','attempt_id':'VTI-11-attempt-001','repository':'cybalicistjt-stack/Multiversal-app','state':'in_progress','role':'current_implementation','implementation_branch':BRANCH,'implementation_authority':True,'acceptance_package_authorized':True,'production_mutation_authorized':False,'matching_red_observed':False,'execution_rule':'Acceptance-only governed start. Production remains locked until matching VTI-11 application RED is sealed.'})
          rt['boundaries'] = cp['selection_boundaries']
          rt['selected_vti'].update({'status':'in_progress','completed_through':'VTI-10','current':'VTI-11','current_state':'in_progress','implementation_authority':True,'implementation_branch':BRANCH,'application_baseline_sha':BASE,'strict_next':'VTI-12','last':'VTI-12'})
          save(rt_path, rt)

          prog_path = pathlib.Path('governance/application-planning/virtual-tabletop-interoperability/VTI_VIRTUAL_TABLETOP_INTEROPERABILITY_PROGRAM.md')
          text = prog_path.read_text(encoding='utf-8')
          text = re.sub(r'\*\*Status:\*\*[^\n]*', '**Status:** OWNER-APPROVED — VTI-01 THROUGH VTI-10 COMPLETED_VERIFIED; VTI-11 IN_PROGRESS', text, count=1)
          text = text.replace('10. **VTI-10 — Additional VTT Adapters & Compatibility Matrix** — **IN_PROGRESS**', '10. **VTI-10 — Additional VTT Adapters & Compatibility Matrix** — **COMPLETED_VERIFIED**')
          text = text.replace('11. **VTI-11 — Adventure / Campaign Package Export**  ', '11. **VTI-11 — Adventure / Campaign Package Export** — **IN_PROGRESS**  ', 1)
          marker = 'VTI-10 — Additional VTT Adapters & Compatibility Matrix — is `in_progress` under governed-start acceptance authority from that exact application main with no branch or implementation authority.'
          replacement = f'VTI-10 — Additional VTT Adapters & Compatibility Matrix — is `completed_verified` and retired after application PR #439 merged as `{BASE}`. VTI-11 — Adventure / Campaign Package Export — is `in_progress` under acceptance-only governed-start authority from that exact application main on `{BRANCH}`; production mutation remains locked pending genuine matching RED.'
          text = text.replace(marker, replacement)
          prog_path.write_text(text, encoding='utf-8')

          sup = ROOT/SUP
          sup.write_text(f'''# VTI-11 — Governed Start\n\nVTI-11 — Adventure / Campaign Package Export — is `in_progress` from exact application baseline `{BASE}` on `{BRANCH}`.\n\n## Governed-start RED evidence\n\n- exact test-only AIOC head: `{RED_HEAD}`\n- canonical repository-health run: `{RED_RUN}`\n- audit job: `{RED_JOB}`\n- canonical authority/lifecycle/sealed-proof validation: PASS\n- current control-plane regressions: 298 total, exactly one expected failure because VTI-11 was still `selected_not_started`\n- repository-health artifact: `{RED_ARTIFACT}`\n- artifact ZIP SHA-256: `{RED_ARTIFACT_SHA}`\n- historical validator executions: 0\n\n## Open authority\n\nOnly application branch creation, bounded implementation scaffolding and acceptance-package work are authorized. Acceptance may cover deterministic export-package manifests for maps/scenes, encounters, creatures/NPCs, tokens, journals/handouts, treasure/items, roll tables, environments and other explicitly permitted content. Completed VTI identity, permission, hidden-information, capability and compatibility semantics remain authoritative.\n\n## Closed authority\n\nProduction package-export behavior remains locked until a genuine matching VTI-11 self-hosted Linux/Windows RED is sealed. Provider credentials/accounts, provider network access, live external or canonical mutation, durable VTI persistence/new migration, provider activation, tester distribution, package publication/upload/distribution, release/deployment, VTI-12+ and SGC-01+ remain unauthorized. ARI/SAA remain planning only and P3D remains deferred.\n''', encoding='utf-8')
          PY
          rm .github/workflows/vti11-governed-start-projection.yml
          python3 -m unittest tests.control_plane.test_vti11_adventure_campaign_package_export_registration
          python3 -m unittest discover -s tests/control_plane -p 'test_*.py'
      - name: Commit governed-start projection and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cybalicistjt-stack'
          git config user.email 'cybalicist.jt@gmail.com'
          git add -A
          git commit -m 'VTI-11: project bounded governed-start authority'
          git push origin HEAD:governance/vti-11-governed-start
