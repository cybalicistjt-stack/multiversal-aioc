name: VTI-09 Governed Start Projection
on:
  push:
    branches:
      - governance/vti-09-governed-start
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/vti-09-governed-start
          fetch-depth: 0
      - name: Project governed-start state
        run: python3 scripts/_vti09_governed_start_projection.py
      - name: Repair convergence objective and diagnostic escalation from exact failures
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('governance/ai/work-state/VTI-09-attempt-001.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          cc=data.setdefault('convergence_control',{})
          cc['service_objective']={
            'ordinary_tranche_single_continue_target_percent':80,
            'ordinary_tranche_two_continue_target_percent':95,
            'max_execution_cycles_without_genuine_blocker':2,
            'unrelated_historical_validation_jobs_target':0,
            'reruns_without_changed_evidence_target':0,
            'post_merge_stale_pointer_target':0
          }
          cc['repository_state_repair_cycles']=2
          cc['repair_cycles']=2
          cc['diagnostic_mode']=True
          cc['last_failure_signature']='Governed-start projection passed 289/289 control-plane tests; repository health first rejected missing service_objective, then required diagnostic escalation after two accurately recorded repository-state repair cycles.'
          cc['last_failure_class']='repository_state'
          cc['diagnostic_hypotheses']=[
            'The initial projection copied tranche convergence counters but omitted the now-required service_objective object.',
            'The two accidental empty-file writes to AIOC main were immediately reverted and changed no canonical tree semantics, but they correctly count as VTI-09 repository-state repair cycles.',
            'Once repair_cycles reached two, the convergence policy required diagnostic_mode plus classified hypotheses even though the product and control-plane regressions were already green.'
          ]
          cc['retry_basis']={'changed_since_previous':[
            'added the exact repository-health service_objective',
            'kept the two repository-state repair cycles instead of lowering the count',
            'entered diagnostic_mode and recorded the classified failure evidence and hypotheses required by the second-repair convergence guard'
          ]}
          path.write_text(json.dumps(data,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Remove temporary helpers before validation
        run: rm scripts/_vti09_governed_start_projection.py .github/workflows/vti09-governed-start-projection.yml
      - name: Run control-plane regressions
        run: python3 -m unittest discover -s tests/control_plane -p 'test_*.py'
      - name: Run repository health
        run: python3 scripts/validate_repository_health.py --root .
      - name: Commit validated governed-start tree
        run: |
          git config user.name "cybalicistjt-stack"
          git config user.email "cybalicist.jt@gmail.com"
          git add -A
          git commit -m "VTI-09: governed start with Foundry VTT selection"
          git push origin HEAD:governance/vti-09-governed-start
