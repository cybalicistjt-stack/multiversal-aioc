<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiversal — Priority Content Review</title><link rel="stylesheet" href="./app.css?build=4.8.0"><style>.wrap{max-width:1500px;margin:auto;padding:24px}.hero,.panel{background:rgba(16,10,29,.92);border:1px solid #6845a7;border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{background:#0b0715;border:1px solid #3a2861;border-radius:12px;padding:14px}.metric b{font-size:1.8rem;color:#79e8ff}.row{display:grid;grid-template-columns:1.2fr .7fr .5fr .7fr 2fr;gap:10px;padding:12px;border-top:1px solid #2f214c;align-items:start}.tag{display:inline-block;padding:3px 8px;border:1px solid #6c55a2;border-radius:999px}.muted{color:#a99cbc}select,button,input{background:#100a1d;color:#eee;border:1px solid #6b4aa0;border-radius:8px;padding:8px}a{color:#79e8ff}@media(max-width:900px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="hero"><h1>Priority Content Review</h1><p>This is the first substantive recovery queue: high-confidence named game objects, excluding broad rule fragments until their dedicated decomposition pass.</p><p><a href="./index.html">← AIOC Dashboard</a> · <a href="./recovery-center.html">Recovery Center</a></p></div><div id="status" class="panel">Loading priority review data…</div><div id="metrics" class="grid"></div><div class="panel"><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="q" placeholder="Search name, type, source"><select id="type"><option value="">All object types</option></select><button id="export">Export decisions</button></div><div id="rows"></div></div></div><script>
const state={data:null,decisions:JSON.parse(localStorage.getItem('mv.priority.decisions')||'{}')};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){try{const r=await fetch('./audit-data/priority-content/priority-content-review-index.json?'+Date.now());if(!r.ok)throw 0;state.data=await r.json();render()}catch{document.querySelector('#status').innerHTML='<b>Priority queue is being generated.</b><p>The review workflow runs after the successful forensic audit and will publish up to 200 high-priority named objects here.</p>'}}
function render(){const d=state.data;document.querySelector('#status').innerHTML='<b>Substantive content review is ready.</b> No decision changes canon automatically.';document.querySelector('#metrics').innerHTML=`<div class=metric><b>${d.candidateCount}</b><div>Candidates</div></div><div class=metric><b>${d.batchCount}</b><div>Batches</div></div><div class=metric><b>${Object.keys(d.objectTypeCounts||{}).length}</b><div>Object families</div></div><div class=metric><b>${Object.keys(state.decisions).length}</b><div>Reviewed locally</div></div>`;const sel=document.querySelector('#type');Object.keys(d.objectTypeCounts||{}).sort().forEach(t=>sel.insertAdjacentHTML('beforeend',`<option>${esc(t)}</option>`));draw()}
function draw(){if(!state.data)return;let rows=state.data.publishedSample||[];const q=document.querySelector('#q').value.toLowerCase(),t=document.querySelector('#type').value;rows=rows.filter(x=>(!t||x.objectType===t)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));document.querySelector('#rows').innerHTML=rows.map(x=>{const id=x.candidateId,dec=state.decisions[id]||'unreviewed',src=(x.provenance||[])[0]||{};return `<div class=row><div><b>${esc(x.name)}</b><br><span class=tag>${esc(x.objectType)}</span></div><div>Priority ${esc(x.priorityScore)}<br><span class=muted>Ready ${esc(x.readinessScore)}%</span></div><div>${esc(x.recommendedPack||'Unassigned')}</div><div><select data-id="${esc(id)}"><option ${dec==='unreviewed'?'selected':''}>unreviewed</option><option ${dec==='approve-candidate'?'selected':''}>approve-candidate</option><option ${dec==='needs-changes'?'selected':''}>needs-changes</option><option ${dec==='duplicate'?'selected':''}>duplicate</option><option ${dec==='reject'?'selected':''}>reject</option><option ${dec==='defer'?'selected':''}>defer</option></select></div><div>${esc(src.sourcePath||'')} ${src.locator?`— ${esc(src.locator)}`:''}<br><span class=muted>${esc((x.reviewQuestions||[]).join(' · '))}</span></div></div>`}).join('');document.querySelectorAll('select[data-id]').forEach(s=>s.onchange=()=>{state.decisions[s.dataset.id]=s.value;localStorage.setItem('mv.priority.decisions',JSON.stringify(state.decisions));render()})}
document.querySelector('#q').oninput=draw;document.querySelector('#type').onchange=draw;document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'multiversal-priority-content-review-decisions',version:'1.0.0',exportedAt:new Date().toISOString(),decisions:state.decisions},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='priority-content-review-decisions.json';a.click();URL.revokeObjectURL(a.href)};load();
</script></body></html>
