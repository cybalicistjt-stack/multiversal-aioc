<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05030a"><title>Multiversal — Semantic Recovery Center</title><link rel="stylesheet" href="./app.css?build=5.0.0"><style>.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{padding:8px 12px;border:1px solid #3e315b;border-radius:10px;background:#120d1d;color:#ddd;cursor:pointer}.tab.active{border-color:#79e8ff;color:#79e8ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.metric{padding:16px;border:1px solid #36284d;border-radius:14px;background:#0d0915}.metric b{display:block;font-size:1.7rem;color:#79e8ff}.row{padding:14px;border:1px solid #302441;border-radius:12px;background:#0b0811;margin:10px 0}.muted{color:#a99fbb}.pill{display:inline-block;padding:3px 8px;margin:2px;border:1px solid #493662;border-radius:999px;font-size:.78rem}.warn{color:#ffc777}.good{color:#8ff0b3}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><main class="shell" style="margin:auto;max-width:1500px"><header class="topbar"><div><h1>Semantic Recovery Center</h1><p>Document structure, family-specific parsing, and canonical knowledge graph</p></div><div class="top-actions"><a class="button-label" href="./index.html">Dashboard</a><a class="button-label" href="./priority-content-review.html">Priority Review</a></div></header><section class="view"><section id="status" class="panel">Loading semantic recovery data…</section><section class="panel"><div class="tabs"><button class="tab active" data-view="structure">Structure</button><button class="tab" data-view="parsers">Parsed Objects</button><button class="tab" data-view="nodes">Graph Nodes</button><button class="tab" data-view="edges">Graph Edges</button><button class="tab" data-view="unresolved">Unresolved</button></div><div style="display:flex;gap:10px;margin:14px 0;flex-wrap:wrap"><input id="search" placeholder="Search names, types, sources, relationships…" style="min-width:300px;flex:1"><select id="family"><option value="">All families</option></select></div><div id="results"></div></section></section></main><script>
const base='./audit-data/semantic-recovery/';let data={},view='structure';const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){try{const [s,p,g]=await Promise.all(['document-structure-index.json','family-parser-index.json','knowledge-graph-index.json'].map(x=>fetch(base+x+'?t='+Date.now()).then(r=>{if(!r.ok)throw Error(x);return r.json()})));data={s,p,g};renderStatus();buildFamilies();render()}catch(e){document.querySelector('#status').innerHTML='<h2 class="warn">Semantic recovery is still running</h2><p>The workflow has not yet published all three required indexes.</p>'}}
function renderStatus(){const {s,p,g}=data;document.querySelector('#status').innerHTML=`<div class="grid"><div class="metric"><span>Structural blocks</span><b>${s.blockCount||0}</b></div><div class="metric"><span>Parsed candidates</span><b>${p.candidateCount||0}</b></div><div class="metric"><span>Object families</span><b>${Object.keys(p.familyCounts||{}).length}</b></div><div class="metric"><span>Graph nodes</span><b>${g.nodeCount||0}</b></div><div class="metric"><span>Graph edges</span><b>${g.edgeCount||0}</b></div><div class="metric"><span>Unresolved relationships</span><b>${g.unresolvedRelationshipCount||0}</b></div></div><p class="muted">All generated objects and graph relationships remain non-canonical until reviewed and approved.</p>`}
function buildFamilies(){const set=new Set(Object.keys(data.p.familyCounts||{}));document.querySelector('#family').innerHTML='<option value="">All families</option>'+[...set].sort().map(x=>`<option>${esc(x)}</option>`).join('')}
function rows(){if(view==='structure')return data.s.publishedSample||[];if(view==='parsers')return data.p.publishedSample||[];if(view==='nodes')return data.g.publishedNodeSample||[];if(view==='edges')return data.g.publishedEdgeSample||[];return data.g.publishedUnresolvedSample||[]}
function familyOf(x){return x.objectType||x.nodeType||x.blockType||x.relationshipType||''}
function render(){const q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#family').value;let list=rows().filter(x=>(!f||familyOf(x)===f)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));document.querySelector('#results').innerHTML=list.map(card).join('')||'<p class="muted">No matching records.</p>'}
function card(x){if(view==='structure')return `<article class="row"><b>${esc(x.heading||x.blockType)}</b> <span class="pill">${esc(x.blockType)}</span><p>${esc((x.text||'').slice(0,500))}</p><small class="muted">${esc(x.sourcePath)} · ${esc(x.locator)}</small></article>`;if(view==='parsers')return `<article class="row"><b>${esc(x.name)}</b> <span class="pill">${esc(x.objectType)}</span> <span class="pill">readiness ${esc(x.readinessScore)}</span><p>${esc(x.spec?.summary||'')}</p><p class="muted">Missing: ${esc((x.missingFields||[]).join(', ')||'none')}</p><small>${esc(x.provenance?.[0]?.sourcePath)} · ${esc(x.provenance?.[0]?.locator)}</small></article>`;if(view==='nodes')return `<article class="row"><b>${esc(x.name)}</b> <span class="pill">${esc(x.nodeType)}</span> <span class="pill">${esc(x.authority)}</span><p class="muted">${esc(x.nodeId)}</p></article>`;if(view==='edges')return `<article class="row"><b>${esc(x.relationshipType)}</b> <span class="pill good">resolved</span><p>${esc(x.sourceId)} → ${esc(x.targetId)}</p><small class="muted">confidence ${esc(x.confidence)}</small></article>`;return `<article class="row"><b>${esc(x.sourceName||x.sourceId)}</b> <span class="pill warn">${esc(x.state)}</span><p>${esc(x.relationshipType)} → ${esc(x.targetText)}</p><small class="muted">${esc((x.candidateTargetIds||[]).join(', '))}</small></article>`}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelector('#search').oninput=render;document.querySelector('#family').onchange=render;load();
</script></body></html>
