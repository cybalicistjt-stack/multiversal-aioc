<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiversal — Semantic Recovery v4</title><link rel="stylesheet" href="./app.css"></head><body><main class="shell" style="max-width:1200px;margin:auto"><header class="topbar"><div><h1>Semantic Recovery v4</h1><p>Object assembly, Golden Corpus convergence, baseline lock, and UI/UX transition</p></div><a href="./project-control.html">Project Control</a></header><section id="view" class="view"><section class="panel">Loading v4 diagnostics…</section></section></main><script type="module">
const base='./audit-data/semantic-recovery-v4/';
const files=['stage-status.json','object-assembly-v4-index.json','canonical-candidate-v4-index.json','golden-corpus-annotation-packet.json','golden-corpus-evaluation.json','baseline-lock-status.json'];
const data={};for(const f of files){try{const r=await fetch(base+f+'?t='+Date.now());if(r.ok)data[f]=await r.json()}catch{}}
const stage=data['stage-status.json']||{};const a=data['object-assembly-v4-index.json']||{};const c=data['canonical-candidate-v4-index.json']||{};const g=data['golden-corpus-evaluation.json']||{};const l=data['baseline-lock-status.json']||{};
const card=(n,v,d='')=>`<article class="panel"><h3>${n}</h3><div style="font-size:2rem;font-weight:700">${v??'—'}</div><p>${d}</p></article>`;
const stages=Object.entries(stage.stages||{}).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
document.querySelector('#view').innerHTML=`<section class="grid cols-4">${card('Assembled objects',a.assembledObjectCount,'Object-centric records')}${card('Average completeness',a.averageCompleteness!=null?a.averageCompleteness+'%':'—','Grammar-based completeness')}${card('Canonical candidates',c.candidateCount,'Still non-canonical')}${card('Golden verified',g.verifiedRecordCount,'Owner/expert checked')}</section><section class="grid cols-3">${card('Precision',g.precision,'Target ≥ 0.90')}${card('Recall',g.recall,'Target ≥ 0.80')}${card('F1',g.f1,'Target ≥ 0.85')}</section><section class="panel"><h2>Baseline lock</h2><p><strong>${l.baselineLocked?'LOCKED':'NOT LOCKED'}</strong></p><p>${l.nextRequiredAction||'Waiting for diagnostics.'}</p><p>UI/UX Consultancy: ${l.uiUxConsultancyPhase||'blocked'}</p></section><section class="panel"><h2>Pipeline stages</h2><table><thead><tr><th>Stage</th><th>Status</th></tr></thead><tbody>${stages||'<tr><td colspan="2">No stage data published yet.</td></tr>'}</tbody></table></section><section class="panel"><h2>Family coverage</h2><pre>${JSON.stringify(a.familyCounts||c.familyCounts||{},null,2)}</pre></section>`;
</script></body></html>
