<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05030a"><title>Multiversal — Recovery Handoff Center</title><link rel="stylesheet" href="./app.css?build=4.3.0"><style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{padding:16px;border:1px solid #3b275b;border-radius:14px;background:#10091c}.metric b{display:block;font-size:1.7rem;color:#79e8ff}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.card{padding:16px;border:1px solid #3b275b;border-radius:14px;background:#10091c;margin:10px 0}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#291642;margin:2px;font-size:.82rem}.muted{opacity:.72}.danger{color:#ff8d9d}.ok{color:#86f7b5}select,input,button{padding:9px 11px;border-radius:9px;border:1px solid #513874;background:#130b22;color:#eee}</style></head>
<body><main class="shell" style="max-width:1400px;margin:auto;padding:20px"><header class="topbar"><div><h1>Recovery Handoff Center</h1><p>Review-ready recovery candidates, unresolved relationships, source-area receipts, and Production Database exports.</p></div><div><a class="button-label" href="./recovery-center.html">Recovery Center</a> <a class="button-label" href="./production-database.html">Production Database</a> <a class="button-label" href="./index.html">Dashboard</a></div></header><section id="status" class="panel">Loading governed handoff data…</section><section id="metrics" class="grid"></section><div class="toolbar"><select id="band"><option value="">All readiness bands</option><option value="ready">Ready</option><option value="developing">Developing</option><option value="early">Early</option></select><input id="search" placeholder="Search candidates, source groups, packs"><button id="exportBtn">Export review ledger</button></div><section class="panel"><h2>Candidate handoffs</h2><div id="list"></div></section><section class="panel"><h2>Source completion receipts</h2><div id="receipts"></div></section><section class="panel"><h2>Relationship resolution queue</h2><div id="relationships"></div></section></main><script>
const BASE='./audit-data/handoffs/'; const KEY='mv_recovery_handoff_decisions_v1'; let index={}, receipts=[], relationships=[], decisions=JSON.parse(localStorage.getItem(KEY)||'{}');
async function j(n){const r=await fetch(BASE+n+'?t='+Date.now()); if(!r.ok) throw new Error(n+' unavailable'); return r.json()}
function save(){localStorage.setItem(KEY,JSON.stringify(decisions)); render()}
function metric(label,value){return `<div class="metric"><span>${label}</span><b>${value??0}</b></div>`}
function decision(id,value){decisions[id]={state:value,updatedAt:new Date().toISOString()};save()}
window.decision=decision;
function render(){document.getElementById('metrics').innerHTML=metric('Candidates',index.candidateCount)+metric('Ready for review',index.readyForReviewCount)+metric('Unresolved relationships',index.unresolvedRelationshipCount)+metric('Source groups',index.sourceGroupCount)+metric('Batches',index.batchCount)+metric('Decisions saved',Object.keys(decisions).length); const q=document.getElementById('search').value.toLowerCase(), band=document.getElementById('band').value; const rows=(index.publishedSample||[]).filter(x=>{const b=(Number(x.readinessScore)>=76?'ready':Number(x.readinessScore)>=50?'developing':'early');return(!band||band===b)&&(!q||JSON.stringify(x).toLowerCase().includes(q))}); document.getElementById('list').innerHTML=rows.map(x=>`<article class="card"><h3>${x.canonicalDraft?.name||x.candidateId}</h3><div><span class="pill">${x.canonicalDraft?.objectType||'unknown'}</span><span class="pill">readiness ${x.readinessScore||0}%</span><span class="pill">${x.recommendedPack||'unassigned pack'}</span></div><p class="muted">${x.sourceGroup}</p><p>${(x.missingFields||[]).length?'<span class="danger">Missing: '+x.missingFields.join(', ')+'</span>':'<span class="ok">No structural fields currently flagged</span>'}</p><select onchange="decision('${x.handoffId}',this.value)"><option value="">Unreviewed</option>${['approve-handoff','needs-revision','existing-object','duplicate','defer','reject'].map(v=>`<option ${decisions[x.handoffId]?.state===v?'selected':''}>${v}</option>`).join('')}</select></article>`).join('')||'<p>No matching published sample.</p>'; document.getElementById('receipts').innerHTML=receipts.slice(0,120).map(r=>`<article class="card"><h3>${r.sourceGroup}</h3><div><span class="pill">${r.candidateCount} candidates</span><span class="pill">${r.readyForReview} ready</span><span class="pill">${r.relationshipCount} relationships</span><span class="pill">${r.completionPercent}% structural readiness</span></div></article>`).join(''); document.getElementById('relationships').innerHTML=relationships.slice(0,120).map(r=>`<article class="card"><b>${r.sourceName}</b> <span class="pill">${r.relationshipType}</span> → ${r.targetText}<p class="muted">${r.resolutionState}</p></article>`).join('')||'<p>No published relationship sample.</p>'}
async function init(){try{[index,receipts,relationships]=await Promise.all([j('recovery-handoff-index.json'),j('source-completion-receipts.json'),j('relationship-resolution-queue.json')]);document.getElementById('status').innerHTML='<b class="ok">Handoff data published.</b> Review decisions remain local until exported.';render()}catch(e){document.getElementById('status').innerHTML='<b class="danger">Handoff data is still being generated.</b><p>'+e.message+'</p>'}}
document.getElementById('search').oninput=render;document.getElementById('band').onchange=render;document.getElementById('exportBtn').onclick=()=>{const b=new Blob([JSON.stringify({format:'multiversal-recovery-handoff-decisions',version:'1.0.0',exportedAt:new Date().toISOString(),decisions},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='multiversal-recovery-handoff-decisions.json';a.click();URL.revokeObjectURL(a.href)};init();
</script></body></html>
