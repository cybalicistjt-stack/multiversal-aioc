<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Review & Source Closure</title><link rel="stylesheet" href="./app.css?build=4.7.0"><style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{padding:16px;border:1px solid #41345d;border-radius:12px;background:#0d0916}.metric strong{display:block;font-size:1.8rem}.row{padding:12px;border-bottom:1px solid #302640}.bad{color:#ff8a9b}.good{color:#79e8ff}.muted{opacity:.72}</style></head><body data-build="4.7.0-owner-review"><main class="shell" style="margin:0;max-width:none"><header class="topbar"><div><h1>Owner Review & Source Closure</h1><p>Final human decision layer before controlled legacy-recovery imports and later Main Canon consideration.</p></div><div class="top-actions"><a class="button-label" href="./main-canon-readiness.html">Merge Readiness</a><a class="button-label" href="./index.html">Dashboard</a></div></header><section class="view"><section id="state" class="panel">Loading published owner-review data…</section><section class="grid" id="metrics"></section><section class="panel"><h2>Release gate</h2><div id="gate"></div></section><section class="panel"><h2>Owner review sample</h2><div id="reviews"></div></section><section class="panel"><h2>Final source-closure certificates</h2><div id="closures"></div></section></section></main><script type="module">
const q=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
try{const r=await fetch('./audit-data/owner-review/owner-review-index.json',{cache:'no-store'});if(!r.ok)throw new Error('Owner-review results are still being generated.');const d=await r.json();q('#state').innerHTML='<strong class="good">OWNER REVIEW DATA PUBLISHED</strong><p class="muted">These packets do not authorize automatic imports or Main Canon merges.</p>';const metrics=[['Review packets',d.reviewPacketCount],['Review batches',d.reviewBatchCount],['Source certificates',d.sourceClosureCertificateCount],['Open blockers',d.openBlockerCount]];q('#metrics').innerHTML=metrics.map(x=>`<div class="metric"><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong></div>`).join('');q('#gate').innerHTML=Object.entries(d.releaseGate||{}).map(([k,v])=>`<div class="row"><strong>${esc(k)}</strong>: ${v===true?'<span class="good">required</span>':v===false?'<span class="bad">disabled</span>':esc(v)}</div>`).join('');q('#reviews').innerHTML=(d.publishedReviewSample||[]).slice(0,100).map(x=>`<div class="row"><strong>${esc(x.name||x.candidateId)}</strong> <span class="muted">${esc(x.objectType)} · ${esc(x.targetPack||'unassigned')}</span><br><span>Decision: ${esc(x.decision)}</span> · <span>Source: ${esc(x.sourceGroup)}</span></div>`).join('')||'<p>No review packets in the published sample.</p>';q('#closures').innerHTML=(d.publishedClosureSample||[]).map(x=>`<div class="row"><strong>${esc(x.sourceGroup)}</strong><br>${esc(x.candidateCount)} candidates · closure ${esc(x.closureState)} · owner signed ${esc(x.ownerSigned)}</div>`).join('')||'<p>No source-closure certificates published.</p>';}catch(e){q('#state').innerHTML=`<strong class="bad">OWNER REVIEW DATA NOT YET PUBLISHED</strong><p>${esc(e.message)}</p>`;q('#metrics').innerHTML='';}
</script></body></html>
