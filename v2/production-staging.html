<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiversal Production Staging</title><link rel="stylesheet" href="./app.css?build=4.4.0"></head><body><main class="shell" style="max-width:1500px;margin:auto"><header class="topbar"><div><h1>Production Staging Center</h1><p>Branch-safe validation and import preparation for recovered legacy content</p></div><div class="top-actions"><a class="button-label" href="./recovery-handoffs.html">Recovery Handoffs</a><a class="button-label" href="./production-database.html">Production Database</a><a class="button-label" href="./index.html">Dashboard</a></div></header><section id="view" class="view"><section class="panel">Loading production staging data…</section></section></main><script>
const view=document.getElementById('view');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const card=(k,v)=>`<article class="panel"><small>${esc(k)}</small><h2>${esc(v)}</h2></article>`;
async function run(){try{const r=await fetch('./audit-data/production-staging/production-staging-index.json?'+Date.now());if(!r.ok)throw new Error('Production staging has not published yet.');const d=await r.json();const blockers=Object.entries(d.blockerCounts||{}).sort((a,b)=>b[1]-a[1]);const staged=d.publishedSample||[], blocked=d.blockedSample||[];view.innerHTML=`<section class="grid four">${card('Handoffs',d.handoffCount)}${card('Stageable',d.stagedCount)}${card('Blocked',d.blockedCount)}${card('Import batches',d.batchCount)}</section><section class="panel"><h2>Authority boundary</h2><p>No staging record is canonical. Designer approval and owner approval remain mandatory, and all imports target the <code>${esc(d.targetBranch||'legacy-recovery')}</code> branch first.</p></section><section class="grid two"><article class="panel"><h2>Top blockers</h2>${blockers.length?blockers.map(([k,v])=>`<div class="list-row"><strong>${esc(k)}</strong><span>${v}</span></div>`).join(''):'<p>No blockers reported.</p>'}</article><article class="panel"><h2>Stageable sample</h2>${staged.length?staged.slice(0,30).map(x=>`<div class="list-row"><div><strong>${esc(x.canonicalDraft?.name||x.candidateId)}</strong><small>${esc(x.canonicalDraft?.objectType)} · ${esc(x.recommendedPack||'unassigned')}</small></div><span>${esc(x.targetBranch)}</span></div>`).join(''):'<p>No records currently satisfy structural staging checks.</p>'}</article></section><section class="panel"><h2>Blocked sample</h2>${blocked.length?blocked.slice(0,50).map(x=>`<div class="list-row"><div><strong>${esc(x.candidateId)}</strong><small>${esc((x.blockers||[]).join(', '))}</small></div><span>${esc(x.readinessScore)}</span></div>`).join(''):'<p>No blocked receipts.</p>'}</section>`}catch(e){view.innerHTML=`<section class="panel"><h2>Production staging is still processing</h2><p>${esc(e.message)}</p><p>The current forensic workflow is generating recovery handoffs, validating them, and publishing the first staging index.</p></section>`}}run();
</script></body></html>
